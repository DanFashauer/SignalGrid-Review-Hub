# CodeQL configuration for SignalGrid Review Hub.
#
# Two deliberate choices, both to keep the security signal meaningful on a
# public-safe reference repo:
#
# 1) Query suite: `security-extended` (security queries, incl. the extended
#    set) instead of `security-and-quality`. The quality suite emits a large
#    volume of code-style "note/warning" lint (unused vars, complexity, etc.)
#    that is not a security signal and only creates noise on large diffs. We
#    keep the FULL security suite — nothing security-relevant is dropped.
#
# 2) Scope: analysis is scoped to the first-party SignalGrid product code that
#    this project authors and runs. The following are excluded from the
#    security gate (they are still in the repo, just not CI-gated here):
#      - lib/integrations, lib/integration-bridge — harvested vendor API
#        *client* adapters (Jamf/ISE/Splunk/Sentinel/ServiceNow/…). By design
#        they issue outbound HTTP to an operator-configured vendor endpoint,
#        which CodeQL reports as request-forgery (SSRF) on every call site.
#        That is inherent to an integration client, not a defect; these
#        adapters are fixture-safe and never make a live call in the default
#        (demo) tier. Gating CI red on them produces false signal.
#      - lib/api-client-react — generated (orval) typed client; regenerated
#        from the OpenAPI spec, not hand-authored.
#      - tests — the `tests/` tree. As of 2026-09-02 that is `tests/load/`
#        alone (k6 load drivers); `tests/security-reference/` was retired once
#        its invariants were ported onto the /v1 suite and the webhooks proof.
#      - **/*.test.ts — unit-test files (1 tracked as of 2026-09-02:
#        `artifacts/mcp-server/test/server.test.ts`; was 9 before the
#        security-reference retirement). NOTE: no gate reads this file, so every
#        count in this comment is HAND-HELD and can rot. Re-derive before
#        trusting one: `git ls-files "*.test.ts" | wc -l`.
#      - **/*.spec.ts — Playwright specs. TODAY THAT IS EXACTLY THE TEN FILES IN
#        `scripts/src/e2e/`, so the entire browser E2E suite is outside the
#        security scan. That is a consequence worth stating rather than
#        discovering: the suite drives real browsers, handles a WebAuthn step-up
#        flow, and is the one place a URL or credential is assembled for a live
#        surface. It is excluded as test code, not because it was judged safe.
#      - **/dist/**, **/build/** — build output, not authored source.
#      - **/*.min.js — minified bundles (zero tracked today; the rule is a
#        standing one, kept so a vendored bundle cannot arrive unnoticed).
#    The bullets above cover the same entries as `paths-ignore`, in the same order (two bullets each cover a pair of entries)
#    below, in the same order, and it must stay that way. The previous version of
#    this comment stopped at "build outputs and vendored bundles", which named
#    neither `**/*.spec.ts` nor the ten e2e files it removes from the scan — a
#    scope note that under-reported its own scope.
#    First-party code (signalgrid-core, orchestration, room-sim, signal-radar,
#    webauthn, api-server, mcp-server, the apps, scripts, tools) stays fully
#    security-scanned.
name: "SignalGrid CodeQL config"

queries:
  - uses: security-extended

paths-ignore:
  - lib/integrations
  - lib/integration-bridge
  - lib/api-client-react
  - tests
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.min.js"
