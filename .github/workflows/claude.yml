# claude.yml — the GitHub-side trigger of the brain (DR-063: triggers = the Claude
# GitHub App + the Mac). When the OWNER writes `@claude` in a comment, review or issue,
# Claude Code runs on GitHub's runner in this checkout — it reads CLAUDE.md, AGENTS.md
# and the skills plane like any other lane — and answers in a comment or pushes a branch.
#
# Shape the owner chose on 2026-10-02 ("Full workflow"): the job runs only for the
# owner's own account (this is a public repository — a stranger's `@claude` never starts
# a runner); the checkout is writable so Claude can push a fix branch, but it never
# merges (DR-037 landing conditions still govern every merge); every run is bounded by
# --max-turns. The Claude GitHub App (installed by the owner on every DanFashauer
# repository) is the GitHub identity; the model side authenticates with the owner's
# subscription through CLAUDE_CODE_OAUTH_TOKEN, a repository secret the OWNER mints with
# `claude setup-token` — a lane may never materialize that credential.
#
# Owner-gated surface (SAFETY_MACHINERY, scripts/check-owner-gated-surfaces.mjs): the
# owner lands changes to this file. Tier: Opus (DR-047 — a mention is a judgment call).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == 'DanFashauer' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Claude reads CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 50
