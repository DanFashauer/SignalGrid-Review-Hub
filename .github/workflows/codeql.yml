name: CodeQL

# Static code scanning for the TypeScript/JavaScript in the workspace.
# Findings surface in the repository's Security tab.
on:
  push:
    branches:
      # The only long-lived branch. The dev/alpha/beta/prod tier branches were
      # pruned (docs/BRANCH_HYGIENE.md); triggering on names that resolve to
      # nothing is a scan that can never run.
      - SignalGrid_Alpha
    # A heartbeat-only push (the Mac tick rewriting artifacts/agent-heartbeats/*.json,
    # gated by lane-deliver's own checks) changes no code and used to start this
    # workflow every 5 minutes, cancelling the mainline run of the merge before it
    # (concurrency below) and spending the repository's GITHUB_TOKEN budget — the
    # CI liveness gate failed a product PR on a 403 for exactly that (2026-09-12).
    # A push that touches anything else still runs.
    paths-ignore:
      - "artifacts/agent-heartbeats/**"
  pull_request:
  schedule:
    # Weekly baseline scan (Mondays 07:17 UTC).
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    timeout-minutes: 30
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Query suite + analysis scope live in the config file so the
          # security gate stays meaningful (security queries only) and scoped
          # to first-party product code. See .github/codeql/codeql-config.yml.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
