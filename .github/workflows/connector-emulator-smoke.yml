name: Connector Emulator Smoke

on:
  push:
    branches:
      - SignalGrid_Alpha
    # A heartbeat-only push (the Mac tick rewriting artifacts/agent-heartbeats/*.json,
    # gated by lane-deliver's own checks) changes no code and used to start this
    # workflow every 5 minutes, cancelling the mainline run of the merge before it
    # (concurrency below) and spending the repository's GITHUB_TOKEN budget — the
    # CI liveness gate failed a product PR on a 403 for exactly that (2026-09-12).
    # A push that touches anything else still runs.
    paths-ignore:
      - "artifacts/agent-heartbeats/**"
  workflow_dispatch:
    inputs:
      scenarioGroup:
        description: Optional scenario group to run (leave as all for every deterministic fixture)
        required: false
        default: all
        type: choice
        options:
          - all
          - microsoftGraphPosture
          - workflowRouting
          - physicalCustody
          - networkTrust
          - credentialReader

jobs:
  smoke:
    timeout-minutes: 20
    name: Deterministic connector emulator smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PORT: 3000
      BASE_PATH: /
      SELECTED_SCENARIO_GROUP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scenarioGroup || 'all' }}
      CONNECTOR_EMULATOR_ARTIFACT_NAME: connector-emulator-results
      CONNECTOR_EMULATOR_EVIDENCE_ARTIFACT_NAME: connector-emulator-smoke-evidence
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Connector emulator proof - all scenarios
        if: ${{ env.SELECTED_SCENARIO_GROUP == 'all' }}
        run: pnpm run proof:connector-emulator
      - name: Connector emulator proof - selected group
        if: ${{ env.SELECTED_SCENARIO_GROUP != 'all' }}
        env:
          SCENARIO_GROUP: ${{ env.SELECTED_SCENARIO_GROUP }}
        run: pnpm run proof:connector-emulator
      - name: Existing proof suite
        run: |
          pnpm run proof:intune-entra-posture
          pnpm run proof:signalgrid-simulator
          pnpm run proof:signalgrid-grid
          pnpm run proof:microsoft-graph-sandbox
      # The public-safety properties are MEASURED, not typed (plan row 172). They used
      # to be six string literals in the manifest below, re-emitted on every run beside
      # a run id and a sha with nothing checking any of them. This step scans the proof's
      # import closure, its fixture inputs and the proof output, and writes one entry per
      # property naming the check that produced it; it fails the job if one does not hold.
      # `scripts/check-connector-emulator-evidence.mjs` (preflight + CI) fails if this
      # workflow ever types a property itself again.
      - name: Measure public-safety properties
        run: node scripts/check-connector-emulator-evidence.mjs --results artifacts/connector-emulator/results.json --emit artifacts/connector-emulator/public-safety.json
      - name: Generate smoke evidence manifest
        run: |
          node <<'NODE'
          const { mkdirSync, readFileSync, writeFileSync } = require('node:fs');
          const manifest = {
            workflowName: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            eventName: process.env.GITHUB_EVENT_NAME,
            branch: process.env.GITHUB_REF_NAME,
            headSha: process.env.GITHUB_SHA,
            scenarioGroup: process.env.SELECTED_SCENARIO_GROUP || 'all',
            artifactName: process.env.CONNECTOR_EMULATOR_ARTIFACT_NAME,
            evidenceArtifactName: process.env.CONNECTOR_EMULATOR_EVIDENCE_ARTIFACT_NAME,
            proofCommand:
              process.env.SELECTED_SCENARIO_GROUP === 'all'
                ? 'pnpm run proof:connector-emulator'
                : `SCENARIO_GROUP=${process.env.SELECTED_SCENARIO_GROUP} pnpm run proof:connector-emulator`,
            publicSafety: JSON.parse(readFileSync('artifacts/connector-emulator/public-safety.json', 'utf8')),
          };
          mkdirSync('artifacts/connector-emulator', { recursive: true });
          writeFileSync(
            'artifacts/connector-emulator/evidence.json',
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          NODE
      - name: Upload sanitized emulator output
        uses: actions/upload-artifact@v7
        with:
          name: connector-emulator-results
          path: artifacts/connector-emulator/results.json
          if-no-files-found: error
      - name: Upload smoke evidence manifest
        uses: actions/upload-artifact@v7
        with:
          name: connector-emulator-smoke-evidence
          path: artifacts/connector-emulator/evidence.json
          if-no-files-found: error
