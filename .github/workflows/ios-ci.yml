# Consolidated iOS CI/CD Workflow
# Combines: build, test, lint, security analysis

name: iOS CI

on:
  push:
    branches: [main, SignalGrid_Alpha]
    paths:
      - 'native/ios/**'
  pull_request:
    branches: [main, SignalGrid_Alpha]
    paths:
      - 'native/ios/**'


jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Setup Swift
        run: swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: native/ios
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

      - name: Pick an available iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable')];print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then echo "No available iOS simulator" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build EnterpriseShell
        working-directory: native/ios
        run: |
          xcodebuild -project EnterpriseShell.xcodeproj \
            -scheme EnterpriseShell \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        working-directory: native/ios
        run: |
          xcodebuild -project EnterpriseShell.xcodeproj \
            -scheme EnterpriseShell \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            test

  lint-and-security:
    name: Lint & Security
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint --config .swiftlint.yml
        working-directory: native/ios

      - name: Security Analysis
        run: |
          echo "=== Security Analysis ==="
          
          # Check for hardcoded credentials
          echo "Checking for hardcoded credentials..."
          grep -r "password\s*=" native/ios/EnterpriseShell --include="*.swift" | grep -v "TODO\|FIXME" || echo "✅ No hardcoded credentials"
          
          # Check for insecure URL schemes
          echo "Checking for insecure URL schemes..."
          grep -r "http://" native/ios/EnterpriseShell --include="*.swift" | grep -v "// TODO" | grep -v "// FIXME" || echo "✅ No insecure URLs"
          
          # Check for TODOs
          echo "Checking for TODOs..."
          grep -rn "TODO:" native/ios/EnterpriseShell --include="*.swift" || echo "✅ No TODOs found"
          grep -rn "FIXME:" native/ios/EnterpriseShell --include="*.swift" || echo "✅ No FIXMEs found"
