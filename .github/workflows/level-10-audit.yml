name: Level 10 Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/level-10-audit.yml'

permissions:
  contents: read

jobs:
  level-10-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run proof:connector-emulator
      - run: pnpm run phase:gate
      - run: pnpm run phase:summary-check
      - run: pnpm run phase:pr-report
      - run: pnpm run autopilot:backlog-check
      - run: pnpm run level10:audit
      - uses: actions/upload-artifact@v4
        with:
          name: level-10-scorecard
          path: artifacts/level-10/
