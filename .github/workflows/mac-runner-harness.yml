# .github/workflows/mac-runner-harness.yml  — DRAFT, lives in the scratchpad until the
# self-hosted runner is registered and shows "Idle" on the repo's Runners page.
#
# WHY. The cloud lane cannot reach the Mac: no route, no tunnel, and a 5-minute git
# poll is the only channel. A self-hosted runner is OUTBOUND-ONLY (the Mac polls
# GitHub for jobs; nothing listens on the Mac, no credential leaves it), so the cloud
# lane can dispatch a job that runs on this hardware in seconds. This first job is
# deliberately READ-ONLY: it runs the two lanes only a Mac can run and uploads the
# logs. It commits nothing — minting live evidence from CI is a separate decision.
#
# RUNS ONLY ON DEMAND (workflow_dispatch). A job queued against a runner that does
# not exist would sit forever and read as a silent skip, which is why this file does
# not land before the runner is online.
name: Mac harness (self-hosted, on demand)

on:
  # Reusable: mac-runner-auto.yml calls this nightly with lane=both and lane=mcp.
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      lane:
        description: "harness = validate-sim-macos.sh (full, incl. web build); preflight = node scripts/preflight.mjs; both = harness+preflight; mcp = the signalgrid-mcp sibling verified on real macOS, then both halves against the shared posture-report contract (verify:all --require-mcp, no evidence minted)"
        required: true
        default: both
        type: choice
        options: [harness, preflight, both, mcp]

concurrency:
  group: mac-runner
  cancel-in-progress: false

jobs:
  mac-harness:
    name: Mac harness on the SignalGrid Mac
    runs-on: [self-hosted, macOS, ARM64, signalgrid-mac]
    # 660m admission, 90m work (the previous job bound), 30m setup/upload margin.
    # Keep the owning step free of a declared timeout (step maximum is 360m).
    timeout-minutes: 780
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install and verify under the shared host reservation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SG_CI_LANE: ${{ inputs.lane }}
        run: |
          bash scripts/mac/ci-host-verification.sh 24eff86a940099e0725d474d1d5520bfbc71d368 39600 5400 <<'CI_CHAIN'
          set -u
          case "$SG_CI_LANE" in harness|preflight|both|mcp) ;; *) echo 'invalid Mac harness lane' >&2; exit 2;; esac
          node -v; pnpm -v; xcodebuild -version | head -1 || true
          echo "docker: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo absent)"
          code=0
          install_code=0
          pnpm install --frozen-lockfile || install_code=$?
          [ "$install_code" = 0 ] || exit "$install_code"
          bash scripts/mac/free-test-port.sh || exit $?
          if [ "$SG_CI_LANE" = harness ] || [ "$SG_CI_LANE" = both ]; then
            harness_code=0
            ./validate-sim-macos.sh > harness.log 2>&1 || harness_code=$?
            tail -40 harness.log
            [ "$harness_code" = 0 ] || code="$harness_code"
          fi
          # Run even after a failing harness; preserve both verdicts and either failure.
          if [ "$SG_CI_LANE" = preflight ] || [ "$SG_CI_LANE" = both ]; then
            preflight_code=0
            node scripts/preflight.mjs > preflight.log 2>&1 || preflight_code=$?
            grep -E "Preflight (PASSED|FAILED)|FAILED at" preflight.log || true
            [ "$preflight_code" = 0 ] || code="$preflight_code"
          fi
          if [ "$SG_CI_LANE" = mcp ]; then
            # Keep the sibling outside the checkout; this verifies, never mints evidence.
            MCP="$RUNNER_TEMP/signalgrid-mcp"
            git clone -q https://github.com/DanFashauer/signalgrid-mcp "$MCP" || exit $?
            echo "signalgrid-mcp @ $(git -C "$MCP" rev-parse --short HEAD)"
            mcp_code=0
            ( cd "$MCP" && ./verify.sh ) > mcp-verify.log 2>&1 || mcp_code=$?
            grep -E "passed|failed|error|== [0-9]/3" mcp-verify.log | tail -6 || true
            [ "$mcp_code" = 0 ] || code="$mcp_code"
            verify_code=0
            SIGNALGRID_MCP_PATH="$MCP" pnpm run verify:all --require-mcp > verify-all.log 2>&1 || verify_code=$?
            grep -E "mcp tool count|Review-Hub preflight|Review-Hub breadth|signalgrid-mcp:|shared contract" verify-all.log || true
            [ "$verify_code" = 0 ] || code="$verify_code"
          fi
          exit "$code"
          CI_CHAIN

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-runner-logs-${{ github.run_id }}
          path: |
            harness.log
            preflight.log
            mcp-verify.log
            verify-all.log
          if-no-files-found: ignore
