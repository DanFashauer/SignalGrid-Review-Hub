# .github/workflows/mac-runner-harness.yml  — DRAFT, lives in the scratchpad until the
# self-hosted runner is registered and shows "Idle" on the repo's Runners page.
#
# WHY. The cloud lane cannot reach the Mac: no route, no tunnel, and a 5-minute git
# poll is the only channel. A self-hosted runner is OUTBOUND-ONLY (the Mac polls
# GitHub for jobs; nothing listens on the Mac, no credential leaves it), so the cloud
# lane can dispatch a job that runs on this hardware in seconds. This first job is
# deliberately READ-ONLY: it runs the two lanes only a Mac can run and uploads the
# logs. It commits nothing — minting live evidence from CI is a separate decision.
#
# RUNS ONLY ON DEMAND (workflow_dispatch). A job queued against a runner that does
# not exist would sit forever and read as a silent skip, which is why this file does
# not land before the runner is online.
name: Mac harness (self-hosted, on demand)

on:
  # Reusable: mac-runner-auto.yml calls this nightly with lane=both and lane=mcp.
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      lane:
        description: "harness = validate-sim-macos.sh (full, incl. web build); preflight = node scripts/preflight.mjs; both = harness+preflight; mcp = the signalgrid-mcp sibling verified on real macOS, then both halves against the shared posture-report contract (verify:all --require-mcp, no evidence minted)"
        required: true
        default: both
        type: choice
        options: [harness, preflight, both, mcp]

concurrency:
  group: mac-runner
  cancel-in-progress: false

jobs:
  mac-harness:
    name: Mac harness on the SignalGrid Mac
    runs-on: [self-hosted, macOS, ARM64, signalgrid-mac]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free the api-server test port 5310 (runner-owned orphan from a prior killed job)
        run: bash scripts/mac/free-test-port.sh 5310

      - name: Toolchain present on this Mac (report, never install here)
        run: |
          node -v; pnpm -v; xcodebuild -version | head -1 || true
          echo "docker: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo absent)"

      - name: Install (frozen lockfile — what CI installs with)
        id: install
        run: pnpm install --frozen-lockfile

      - name: Full harness (proofs + web build; darwin binaries supplied for the run, manifests restored)
        if: ${{ inputs.lane == 'harness' || inputs.lane == 'both' }}
        run: |
          code=0; ./validate-sim-macos.sh > harness.log 2>&1 || code=$?
          tail -40 harness.log; exit "$code"

      - name: Preflight (every non-proof gate)
        # Independent of the harness: a failing harness must not hide preflight's verdict
        # (the first dispatched run showed only half an answer). Gated on the install
        # instead of always(), so a broken checkout cannot produce a misleading failure.
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (inputs.lane == 'preflight' || inputs.lane == 'both') }}
        run: |
          code=0; node scripts/preflight.mjs > preflight.log 2>&1 || code=$?
          grep -E "Preflight (PASSED|FAILED)|FAILED at" preflight.log || true; exit "$code"

      - name: MCP lane — signalgrid-mcp on real macOS, then both halves against the shared contract
        # The MCP repo's own CI is ubuntu smoke-only by design (its probes answer only on a
        # Mac). This is the real check, runnable by either lane on demand: clone the public
        # sibling OUTSIDE the checkout (a nested dir would dirty the Review-Hub tree and trip
        # provenance) into RUNNER_TEMP, which is fresh per job; let verify.sh pick a Python
        # >= 3.10 (it prefers python3.12; Apple's python3 is 3.9); then verify:all binds its
        # contract test to THIS repo's posture-report.contract.json. --emit-evidence is
        # deliberately absent: verify-all refuses to mint on CI, and Mac-minted evidence
        # from a runner is a separate decision record.
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.lane == 'mcp' }}
        run: |
          set -u
          MCP="$RUNNER_TEMP/signalgrid-mcp"
          git clone -q https://github.com/DanFashauer/signalgrid-mcp "$MCP"
          echo "signalgrid-mcp @ $(git -C "$MCP" rev-parse --short HEAD)"
          code=0
          ( cd "$MCP" && ./verify.sh ) > mcp-verify.log 2>&1 || code=$?
          grep -E "passed|failed|error|== [0-9]/3" mcp-verify.log | tail -6
          SIGNALGRID_MCP_PATH="$MCP" pnpm run verify:all --require-mcp > verify-all.log 2>&1 || code=$?
          grep -E "mcp tool count|Review-Hub preflight|Review-Hub breadth|signalgrid-mcp:|shared contract" verify-all.log || true
          exit "$code"

      - name: Free the api-server test port 5310 (teardown — do not orphan it for the next job)
        if: always()
        run: bash scripts/mac/free-test-port.sh 5310

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-runner-logs-${{ github.run_id }}
          path: |
            harness.log
            preflight.log
            mcp-verify.log
            verify-all.log
          if-no-files-found: ignore
