name: Deploy demo site to Pages

# Publishes the on-device demos (Trusted Room Entry console + battlecard) to
# GitHub Pages, giving a permanent public link that opens on any device.
#
# Manual-only. The default GITHUB_TOKEN cannot enable Pages, so this runs on
# demand (never automatically) to avoid failing until Pages is turned on.
#
# One-time setup, then it's a green one-click deploy:
#   1. Repo Settings → Pages → Source = "GitHub Actions".
#   2. Actions tab → "Deploy demo site to Pages" → Run workflow.
# Everything is public-safe static HTML — no server, no data.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enable GitHub Pages automatically if it isn't already, so this workflow
      # doesn't fail (and email) when Pages hasn't been turned on by hand.
      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Regenerate the on-device console from source so Pages is always current.
      - run: pnpm run build:room-console
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp docs/room-entry-console.html _site/console.html
          cp docs/competitive-battlecard.html _site/battlecard.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
