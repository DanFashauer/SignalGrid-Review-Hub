name: Deploy site to Pages

# Publishes the SignalGrid marketing site (artifacts/signalgrid-web) to GitHub
# Pages at the custom domain signalgrid.app, with the on-device demos (Trusted
# Room Entry console + battlecard) preserved at stable sub-paths.
#
# Manual-only. The default GITHUB_TOKEN cannot enable Pages, so this runs on
# demand (never automatically) to avoid failing until Pages is turned on.
#
# One-time setup (see docs/DOMAIN_SETUP.md for the DNS + go-live checklist):
#   1. Repo Settings → Pages → Source = "GitHub Actions".
#   2. Point signalgrid.app's DNS at GitHub Pages (records in DOMAIN_SETUP.md).
#   3. Actions tab → "Deploy site to Pages" → Run workflow.
#   4. Settings → Pages → Custom domain shows signalgrid.app; tick "Enforce HTTPS".
# Everything is public-safe static content — no server, no data. The site/CNAME
# file pins the custom domain so Pages keeps serving signalgrid.app.
on:
  workflow_dispatch:
    inputs:
      custom_domain:
        description: >-
          Pin signalgrid.app via the CNAME file. Leave FALSE until the DNS
          A-records actually point at GitHub Pages — a CNAME whose domain does
          not resolve makes Pages 301 the working github.io URL to a dead host,
          which is worse than having no custom domain at all. Flip to true only
          after `dig signalgrid.app` returns the four GitHub Pages IPs.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Enable GitHub Pages automatically if it isn't already, so this workflow
      # doesn't fail (and email) when Pages hasn't been turned on by hand.
      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Build the marketing site at the base path it will actually be served
      # from. On the apex custom domain that is "/"; on the github.io fallback it
      # is "/<repo>/", and building with the wrong one 404s every asset — the page
      # loads as unstyled HTML, which looks broken to exactly the audience the
      # site exists for. Derived from the same input that gates the CNAME so the
      # two can never disagree.
      - name: Resolve base path
        id: base
        run: |
          if [ "${{ inputs.custom_domain }}" = "true" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "site=https://signalgrid.app" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
            # ORIGIN ONLY — Vite appends the base path to og:image itself.
            owner_lc=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
            echo "site=https://${owner_lc}.github.io" >> "$GITHUB_OUTPUT"
          fi
      - name: Build marketing site
        run: |
          BASE_PATH='${{ steps.base.outputs.path }}' \
          SITE_URL='${{ steps.base.outputs.site }}' \
            pnpm --filter @workspace/signalgrid-web run build
      # Regenerate the on-device console from source so Pages is always current.
      - run: pnpm run build:room-console
      # Same reason: the Evidence Coverage page bundles the live coverage model, so it is
      # rebuilt here rather than trusted from the commit.
      - run: pnpm run build:evidence-coverage
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Marketing site (signalgrid-web) at the root.
          cp -r artifacts/signalgrid-web/dist/public/. _site/
          # Per-route static shells so a DIRECT hit on a client-side route returns
          # HTTP 200 (not the 404.html fallback, which Pages serves with a real
          # 404 status). Each shell is the SPA index; wouter reads the URL and
          # renders the right page. Keep this list in sync with the routes in
          # artifacts/signalgrid-web/src/App.tsx.
          for route in hardware pricing federal downloads about; do
            mkdir -p "_site/$route"
            cp _site/index.html "_site/$route/index.html"
          done
          # Last-resort fallback for genuinely-unknown paths (renders the SPA).
          cp _site/index.html _site/404.html
          # On-device demos preserved at their stable permanent-link paths.
          cp docs/room-entry-console.html _site/console.html
          # Live decision fabric — 9 signals fuse to one verdict + one incident.
          cp docs/fabric-console.html _site/fabric.html
          cp docs/competitive-battlecard.html _site/battlecard.html
          cp docs/embedded-host-app-demo.html _site/embedded-demo.html
          cp docs/embedded-desktop-demo.html _site/desktop-demo.html
          # Public investor pitch deck (self-contained, public-safe).
          cp docs/pitch-deck.html _site/pitch.html
          # Evidence coverage — what a prospect's own estate can and cannot answer.
          cp docs/evidence-coverage.html _site/evidence-coverage.html
          # Pin the custom domain so Pages keeps serving signalgrid.app — but ONLY
          # when the operator says the DNS is live. Copying CNAME while the domain
          # is still parked elsewhere makes Pages redirect the working github.io
          # URL to a host that does not answer, so the safe default is to omit it
          # and serve at https://<owner>.github.io/<repo>/ instead.
          if [ "${{ inputs.custom_domain }}" = "true" ]; then
            cp site/CNAME _site/CNAME
            echo "CNAME pinned: $(cat site/CNAME)"
          else
            echo "CNAME omitted — serving at the github.io path (custom_domain=false)."
          fi
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }

  deploy:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
