name: Phase PR Evidence

on:
  pull_request:
    # `edited`: the PR body is what the summary check reads, so fixing it must re-run.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-pr-evidence:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Phase gate self-test (lane escalation is wired to the exit code, not the printed lane)
        run: pnpm --filter @workspace/scripts exec tsx ./src/phase-gate.ts --self-test
      - name: Phase PR report self-test (an empty and a clean docs-only change set do not reach the same lane)
        run: pnpm --filter @workspace/scripts exec tsx ./src/phase-pr-report.ts --self-test
      - name: Run phase gate
        run: pnpm run phase:gate

      - name: Phase summary check self-test (unset or template input refuses)
        run: pnpm --filter @workspace/scripts exec tsx ./src/phase-summary-check.ts --self-test
      # The PR body is the summary under review (plan row 143). Passed through env,
      # never interpolated into the script, so its text cannot become shell.
      # Scoped to pull_request (a dispatch run has no body) and off the machine-written
      # lane-mail and tick heads, whose bodies are delivery records, not summaries.
      # Every other PR, agent-authored included, uses the template headings.
      - name: Run phase summary check
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'lane/') && !startsWith(github.head_ref, 'mac/tick-')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-summary.md"
          PHASE_SUMMARY_FILE="$RUNNER_TEMP/pr-summary.md" pnpm run phase:summary-check

      - name: Generate phase report
        run: pnpm run phase:pr-report

      - name: Upload phase report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-pr-report
          path: artifacts/phase-pr-report/
