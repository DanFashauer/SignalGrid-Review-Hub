name: PR Triage

# Auto-labels pull requests by changed area and size, and posts a short triage
# summary. Read-only beyond labels + a single sticky comment. The substantive
# gates (CI, safety gate, proofs) run in the main SignalGrid CI workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    timeout-minutes: 10
    name: Label & summarize
    runs-on: ubuntu-latest
    steps:
      - name: Triage
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            // Collect changed files (paginated).
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const paths = files.map(f => f.filename);
            const churn = files.reduce((n, f) => n + (f.additions || 0) + (f.deletions || 0), 0);

            // Area labels from changed paths.
            const rules = [
              ["area:core",          p => p.startsWith("lib/signalgrid-core/")],
              ["area:orchestration", p => p.startsWith("lib/orchestration/") || p.startsWith("lib/room-sim/")],
              ["area:signals",       p => p.startsWith("lib/signal-radar/")],
              ["area:api",           p => p.startsWith("artifacts/api-server/")],
              ["area:mcp",           p => p.startsWith("artifacts/mcp-server/")],
              ["area:apps",          p => /^artifacts\/signalgrid-(app|desktop|mobile-pwa|review|web)\//.test(p)],
              ["area:integrations",  p => p.startsWith("lib/integrations/") || p.startsWith("lib/integration-bridge/")],
              ["area:ios",           p => p.startsWith("native/ios/")],
              ["area:ci",            p => p.startsWith(".github/")],
              ["area:docs",          p => p.startsWith("docs/") || p.endsWith(".md")],
              ["area:tooling",       p => p.startsWith("scripts/") || p.startsWith("tools/")],
              // Added 2026-08-23 from two observed misses, not from imagination.
              //
              // CONTAINER: PR #283 changed Dockerfile.api to clear a live CRITICAL
              // and was labelled `area:docs` ONLY — the .md that rode along matched,
              // the Dockerfile matched nothing. A pure container change was therefore
              // invisible to triage, and the deploy surface is the last one that
              // should draw less scrutiny than a doc edit.
              ["area:container",     p => /^(Dockerfile|docker-compose|\.dockerignore)/.test(p) || p.endsWith(".dockerfile")],
              // LANES: PR #285 carried a lane message and a steward heartbeat and
              // reported "Areas: —". The cross-lane coordination artifacts are how
              // the two Claude lanes tell each other what changed; a change to them
              // having no area at all is exactly backwards.
              ["area:lanes",         p => /^artifacts\/(lane-messages|agent-heartbeats|sim-requests|sim-results)\//.test(p)],
              // NATIVE: native/ios had a rule and its siblings did not, which reads
              // as an oversight rather than a decision.
              ["area:native",        p => p.startsWith("native/android/") || p.startsWith("firmware/")],
            ];
            // NOT every path needs an area, and no gate demands one — a PR touching
            // only, say, a fixture may legitimately match nothing. What these three
            // fix is a surface that SHOULD be visible and was not.
            const areas = rules.filter(([, test]) => paths.some(test)).map(([label]) => label);

            // Size label.
            const size = churn < 30 ? "size:XS" : churn < 120 ? "size:S" : churn < 400 ? "size:M" : churn < 1000 ? "size:L" : "size:XL";

            const desired = [...areas, size];

            // Ensure labels exist (ignore "already exists").
            const colors = { "size:XS":"c2e0c6","size:S":"bfdadc","size:M":"fef2c0","size:L":"f9d0c4","size:XL":"e11d21" };
            for (const name of desired) {
              try { await github.rest.issues.createLabel({ owner, repo, name, color: colors[name] || "ededed" }); } catch (e) { /* exists */ }
            }

            // Replace only the labels this bot manages; leave others intact.
            const current = (await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: number })).data.map(l => l.name);
            const managed = current.filter(l => l.startsWith("area:") || l.startsWith("size:"));
            for (const l of managed.filter(l => !desired.includes(l))) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: l }); } catch (e) {}
            }
            if (desired.length) await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: desired });

            // Sticky triage comment.
            const marker = "<!-- signalgrid-triage -->";
            const body = [
              marker,
              "### 🧭 PR triage",
              `- **Areas:** ${areas.length ? areas.map(a => "`"+a+"`").join(" ") : "—"}`,
              `- **Size:** \`${size}\` (${churn} lines across ${files.length} files)`,
              "",
              "CI runs the full gate suite (build, typecheck, proofs, API tests, safety gate). This comment updates on each push.",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
