name: Promote Tier

# Opens a promotion pull request from one tier to the next (dev → alpha → beta
# → prod). Promotion is always via PR so the full CI gate suite runs and the
# target tier's branch protection (review + green checks) applies. This workflow
# never merges — it only opens the PR.

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Source tier"
        required: true
        type: choice
        options: [dev, alpha, beta]
      to:
        description: "Target tier"
        required: true
        type: choice
        options: [alpha, beta, prod]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    timeout-minutes: 10
    name: Open promotion PR
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion is one step upward
        run: |
          declare -A rank=( [dev]=0 [alpha]=1 [beta]=2 [prod]=3 )
          from="${{ github.event.inputs.from }}"
          to="${{ github.event.inputs.to }}"
          if [ "$(( ${rank[$to]} - ${rank[$from]} ))" -ne 1 ]; then
            echo "Promotion must be exactly one tier upward (dev→alpha→beta→prod). Got $from → $to." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      # Report where every tier actually points, BEFORE attempting the promotion and
      # regardless of how the promotion turns out.
      #
      # This exists because the first real dispatch of this workflow failed with an
      # opaque red X, and the log said nothing an operator could act on. The cause was
      # not in the promotion at all: the four tier branches are pinned to an old commit
      # and no longer follow the branch where work lands, so EVERY promotion this
      # workflow can offer has an empty diff. That is a fact about the repository, not
      # about the run — and a workflow that can only fail should say why on its own,
      # rather than requiring someone to go read four branch refs by hand.
      - name: Report tier state
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const TIERS = ["dev", "alpha", "beta", "prod"];

            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const def = repoInfo.default_branch;

            const shaOf = async (branch) => {
              try {
                const { data } = await github.rest.repos.getBranch({ owner, repo, branch });
                return data.commit.sha;
              } catch (err) {
                if (err.status === 404) return null;
                throw err;
              }
            };

            // How many commits is this tier MISSING relative to the branch work lands on?
            //
            // `basehead` is `base...head`, so `${branch}...${def}` puts the tier as base and the
            // default as head — and `ahead_by` is then the count of commits the DEFAULT has that
            // the tier lacks. That is the "how far behind" number, confirmed against a live run
            // (108) matching `git rev-list --count <tier>..<default>`.
            //
            // The catch discriminates rather than swallowing. A bare `catch { return null }` here
            // rendered EVERY fault — a 502, a socket timeout, a rate limit — as the definite
            // ancestry claim "unrelated history", and then dropped the row from the staleness
            // filter, so the explanatory banner vanished at exactly the moment its data was least
            // trustworthy, with the job still green. A false statement and a fault reading as
            // success, in one line. `shaOf` above already had this right, and the create step
            // below states the same rule for itself.
            const missingFrom = async (branch) => {
              try {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${branch}...${def}`,
                });
                return data.ahead_by;
              } catch (err) {
                // The branch is known to exist (shaOf resolved it), so a 404 here means the two
                // histories share no common ancestor — a real answer, not a fault.
                if (err.status === 404) return null;
                core.error(`compare ${branch}...${def} failed with ${err.status}: ${err.message}`);
                throw err;
              }
            };

            const rows = [];
            for (const tier of TIERS) {
              const sha = await shaOf(tier);
              rows.push({
                tier,
                sha: sha ? sha.slice(0, 7) : "—",
                missing: sha ? await missingFrom(tier) : null,
              });
            }

            const fmt = (r) => {
              if (r.sha === "—") return "branch does not exist";
              if (r.missing === null) return "no common ancestor";
              return r.missing === 0 ? "up to date" : `${r.missing} commit(s) behind \`${def}\``;
            };

            // MEASURE THE PROMOTION, don't infer it.
            //
            // The table above says how far each tier is BEHIND the default. It says nothing about
            // what a promotion would carry, because those are different comparisons: a tier can be
            // behind the default and simultaneously ahead of the tier above it. The first version
            // of this step inferred "every promotion is a no-op" from "every tier is behind", which
            // is invalid — land one commit on `dev` per the documented flow and the merge base does
            // not move, so every tier still reads 108 behind while `dev → alpha` now carries real
            // work. The summary would have called that a no-op while the step below offered a live
            // link to open it.
            //
            // So compare the pair actually dispatched. `${to}...${from}` makes the target the base
            // and the source the head, and `ahead_by` is exactly the number of commits this
            // promotion would move.
            const from = context.payload.inputs.from;
            const to = context.payload.inputs.to;
            let carries = null;
            try {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${to}...${from}`,
              });
              carries = data.ahead_by;
            } catch (err) {
              if (err.status !== 404) {
                core.error(`compare ${to}...${from} failed with ${err.status}: ${err.message}`);
                throw err;
              }
            }

            const allBehind = rows.filter((r) => typeof r.missing === "number" && r.missing > 0).length === TIERS.length;

            const verdict =
              carries === 0
                ? `\n**This promotion carries nothing.** \`${to}\` already contains every commit in ` +
                  `\`${from}\`, so \`${from}\` → \`${to}\` is a no-op.\n`
                : carries === null
                  ? `\n**\`${from}\` and \`${to}\` share no common ancestor**, so no promotion between ` +
                    `them is possible.\n`
                  : `\n**This promotion carries ${carries} commit(s)** from \`${from}\` into \`${to}\`.\n`;

            const entryPoint = allBehind
              ? `\nSeparately: **every tier is behind \`${def}\`**, the branch work actually lands on. ` +
                `That does not by itself make a promotion empty — the two are different comparisons — ` +
                `but it does mean the pipeline's entry tier is not being fed. Reconnecting it is an ` +
                `owner decision; see \`docs/BRANCHING_AND_ENVIRONMENTS.md\`.\n`
              : "";

            await core.summary
              .addHeading("Tier state", 3)
              .addRaw(`Default branch: \`${def}\`\n\n`)
              .addTable([
                [{ data: "Tier", header: true }, { data: "Commit", header: true }, { data: "Relative to default", header: true }],
                ...rows.map((r) => [r.tier, r.sha, fmt(r)]),
              ])
              .addRaw(verdict)
              .addRaw(entryPoint)
              .write();

            for (const r of rows) core.info(`${r.tier.padEnd(6)} ${r.sha}  ${fmt(r)}`);
            core.info(`${from} -> ${to} carries: ${carries === null ? "no common ancestor" : carries}`);

      - name: Open promotion PR
        uses: actions/github-script@v9
        with:
          script: |
            const from = context.payload.inputs.from;
            const to = context.payload.inputs.to;
            const title = `Promote ${from} → ${to}`;
            const body = [
              `Automated tier promotion: **${from} → ${to}**.`,
              ``,
              `Merging requires the full CI gate suite to be green and the`,
              `target branch's protection rules (review) to be satisfied.`,
            ].join("\n");
            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", base: to, head: `${context.repo.owner}:${from}`,
            });
            if (existing.length > 0) {
              core.notice(`A promotion PR ${from} → ${to} is already open: #${existing[0].number}`);
              return;
            }
            // TWO OUTCOMES THAT ARE NOT FAILURES. Both were previously uncaught, and both
            // surfaced as an opaque red X that an operator could not tell from a broken
            // workflow. Each is now reported as what it is, and the job stays green.
            //
            // Anything else is rethrown — an unrecognised error is a real failure and must
            // stay red — but the status and body are logged on one readable line first, so
            // the next unknown case is diagnosable from the run alone instead of from a
            // hundred lines of Octokit object dump.
            //
            // Matched on BOTH the structured body and the message: Octokit folds a response
            // body into `err.message`, and which of the two carries the text has moved
            // across versions.
            const compare =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/compare/${to}...${from}?expand=1`;
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, head: from, base: to,
              });
              core.notice(`Opened promotion PR #${pr.number}: ${from} → ${to}`);
            } catch (err) {
              const haystack = `${err.message ?? ""} ${JSON.stringify(err.response?.data ?? {})}`;

              // (1) Nothing to promote. The target already contains everything in the
              // source, so there is no pull request to open. Normal, and common here while
              // the tiers sit at the same commit.
              if (err.status === 422 && haystack.includes("No commits between")) {
                core.notice(
                  `Nothing to promote: \`${to}\` already contains everything in \`${from}\` ` +
                  `(no commits between them). This is a no-op, not a failure — see the ` +
                  `"Tier state" table in the run summary for where each tier points.`,
                );
                return;
              }

              // (2) The repository does not let Actions open pull requests.
              //
              // This is REPOSITORY POLICY, not a bug, and it is GitHub's default. The
              // job-level `pull-requests: write` permission below is necessary but NOT
              // sufficient — the "Allow GitHub Actions to create and approve pull requests"
              // setting overrides it, and while it is off this call can never succeed.
              //
              // Failing red for a permanent, deliberate policy just teaches people to
              // ignore red. So the workflow does the rest of its job instead: it hands over
              // the exact compare link that opens the same PR in one click. That path needs
              // no elevated permission and no stored credential, which is a better default
              // than asking an owner to switch off a security setting for a convenience
              // workflow. Turning the setting on is optional, and stated as optional.
              if (err.status === 403 && haystack.includes("not permitted to create or approve pull requests")) {
                core.notice(
                  `Could not open the PR automatically: this repository does not allow ` +
                  `GitHub Actions to create pull requests. Open it in one click instead: ${compare}`,
                );
                await core.summary
                  .addHeading("Promotion PR not opened automatically", 3)
                  .addRaw(
                    `This repository has **Settings → Actions → General → Workflow permissions ` +
                    `→ "Allow GitHub Actions to create and approve pull requests"** turned off, ` +
                    `which is GitHub's default. The job-level \`pull-requests: write\` grant ` +
                    `cannot override it.\n\n` +
                    `Nothing is broken, and nothing needs changing unless you want to. ` +
                    `**[Open the \`${from}\` → \`${to}\` pull request](${compare})** — same PR, one click.\n\n` +
                    `Enabling that setting would let this workflow open it for you; leaving it off ` +
                    `keeps Actions unable to author pull requests, which is the safer posture.\n`,
                  )
                  .write();
                return;
              }

              core.error(`pulls.create failed with ${err.status}: ${haystack}`);
              throw err;
            }
