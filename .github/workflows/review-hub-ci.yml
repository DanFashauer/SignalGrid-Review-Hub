name: SignalGrid CI

on:
  pull_request:
  push:
    branches:
      - dev
      - alpha
      - beta
      - prod
      - SignalGrid_Alpha
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Typecheck, build, and proof scaffold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Invariant review (fail-closed / determinism / Assist / truth)
        run: pnpm run review:invariants

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: PORT=3000 BASE_PATH=/ pnpm run build

      - name: Intune / Entra posture proof
        run: pnpm run proof:intune-entra-posture

      - name: SignalGrid core proof
        run: pnpm run proof:signalgrid-core

      - name: SignalGrid simulator proof
        run: pnpm run proof:signalgrid-simulator

      - name: SignalGrid grid proof
        run: pnpm run proof:signalgrid-grid

      - name: Microsoft Graph sandbox proof
        run: pnpm run proof:microsoft-graph-sandbox

      - name: Connector emulator proof
        run: pnpm run proof:connector-emulator

      - name: OpenAPI contract check
        run: pnpm run proof:api-contract

      - name: API integration test
        run: pnpm run test:api

      - name: WebAuthn signature-verification proof
        run: pnpm run proof:webauthn-verify

      - name: Audit-ledger (redaction + tamper-evident chain) proof
        run: pnpm run proof:audit-ledger

      - name: Orchestration (Trust→Action) proof
        run: pnpm run proof:orchestration

      - name: Room-sim (Trusted-Entry, multi-vertical) proof
        run: pnpm run proof:room-sim

      - name: App-workflows (application gating) proof
        run: pnpm run proof:app-workflows

      - name: App-workflow templates + validation lint proof
        run: pnpm run proof:app-workflow-templates

      - name: Flows (admin flow config + health) proof
        run: pnpm run proof:flows

      - name: Recommendations (learned-habit proposals) proof
        run: pnpm run proof:recommendations

      - name: Signal-discovery (auto-onboarding) proof
        run: pnpm run proof:signal-discovery

      - name: DDM / device-health connector proof
        run: pnpm run proof:ddm-connector

      - name: Signal Radar (new-signal detection) proof
        run: pnpm run proof:signal-radar

      - name: Control-plane (cloud↔edge contract) proof
        run: pnpm run proof:control-plane

      - name: Edge-sync (config-down integrity) proof
        run: pnpm run proof:edge-sync

      - name: Telemetry-up (decision plane → control plane) proof
        run: pnpm run proof:telemetry-up

      - name: Safety gate (guardrails)
        run: pnpm run safety:check

      - name: Postman collection is committed in sync
        run: |
          pnpm run build:postman
          git diff --exit-code docs/postman || (echo "::error::Postman collection out of date — run 'pnpm run build:postman' and commit." && exit 1)

      - name: Decision-latency pilot gate
        run: pnpm run bench:decision-latency

  docs-sanity:
    name: Required docs and unsafe-claim sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Required docs exist + affirmative-unsafe-claim scan. Shared with
      # `pnpm run preflight` via scripts/docs-sanity.mjs so the check is the same
      # locally and in CI.
      - name: Docs sanity (required docs + unsafe-claim scan)
        run: node scripts/docs-sanity.mjs

  durable-persistence:
    name: Durable persistence (Postgres audit ledger)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sg
          POSTGRES_PASSWORD: sg
          POSTGRES_DB: signalgrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exercises the REAL durable path: writes/reads the tamper-evident audit
      # ledger against a live Postgres, proving durability, redaction, tamper
      # detection, and fork-free concurrency. The default (DATABASE_URL unset)
      # in-memory path is covered separately by proof:audit-ledger.
      - name: Durable audit-ledger proof on Postgres
        env:
          DATABASE_URL: postgres://sg:sg@localhost:5432/signalgrid
        run: pnpm run proof:audit-ledger-pg
