name: Review Hub CI

on:
  pull_request:
  push:
    branches:
      - SignalGrid_Alpha
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Typecheck, build, and proof scaffold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: PORT=3000 BASE_PATH=/ pnpm run build

      - name: Intune / Entra posture proof
        run: pnpm run proof:intune-entra-posture

  docs-sanity:
    name: Required docs and unsafe-claim sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required docs exist
        run: |
          set -euo pipefail
          required_docs=(
            README.md
            docs/INDEX.md
            docs/INTEGRATION_CATALOG.md
            docs/PRODUCTION_PATH.md
            docs/INTUNE_ENTRA_POSTURE_PROOF.md
            docs/ECOSYSTEM_POSITIONING.md
            docs/MOBILE_AND_PLATFORM_STRATEGY.md
            docs/DOCKBRIDGE_STRATEGY.md
          )

          for doc in "${required_docs[@]}"; do
            test -f "$doc" || { echo "Missing required doc: $doc" >&2; exit 1; }
          done

      - name: Check direct unsafe claims
        run: |
          set -euo pipefail
          denylist=(
            "SignalGrid is production-ready"
            "SignalGrid replaces"
            "SignalGrid is an Imprivata partner"
            "SignalGrid is MFi certified"
            "autonomous production remediation"
          )

          failed=0
          for phrase in "${denylist[@]}"; do
            while IFS= read -r match; do
              # Allow explicit disclaimers, avoid lists, guardrails, and non-claim boundary language.
              if printf '%s\n' "$match" | grep -Eiq 'not |does not|do not|no |avoid|guardrail|disclaimer|should not|must not|without claiming|no claim|doesn.t claim|not claim'; then
                continue
              fi

              echo "Unsafe direct claim found for '$phrase': $match" >&2
              failed=1
            done < <(git grep -nF -- "$phrase" -- README.md docs artifacts/signalgrid-review/src 2>/dev/null || true)
          done

          exit "$failed"
