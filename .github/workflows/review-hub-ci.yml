name: SignalGrid CI

on:
  pull_request:
  push:
    branches:
      - SignalGrid_Alpha
  workflow_dispatch:

# Supersede an in-flight run when a newer commit lands on the same ref, and say so.
#
# Without this, pushing three commits in half an hour left earlier runs to be abandoned
# and reported as `failure` with no logs (404, because they never uploaded). That is
# genuinely hard to tell apart from a real regression, and it cost a careful diagnosis:
# the only thing that distinguished them was noticing the superset commit had passed the
# same job. `cancel-in-progress` makes the outcome `cancelled` — an unambiguous status —
# and stops paying for runs whose result nobody will read.
#
# Scoped per workflow AND per ref, so concurrent PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # actions: read is what lets check-ci-liveness.mjs ask the Actions API when the
  # mutation sweep last SUCCEEDED. Without it GITHUB_TOKEN cannot read workflow
  # runs, the gate's API call fails, and because that gate is FATAL in CI by
  # design it would redden every build the moment it merged. Read-only scope,
  # added deliberately rather than discovered.
  actions: read

jobs:
  validation:
    name: Typecheck, build, and proof scaffold
    runs-on: ubuntu-latest
    # Bounded so a regression that makes a proof HANG (an unbounded prototype walk
    # against a Proxy returning a fresh prototype each call) fails red instead of
    # silently consuming the default job timeout.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Invariant review self-test (a default-less switch / stray clock read must fail)
        run: node scripts/review-invariants.mjs --self-test
      - name: Invariant review (fail-closed / determinism / Assist / truth)
        run: pnpm run review:invariants

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: PORT=3000 BASE_PATH=/ pnpm run build

      - name: Intune / Entra posture proof
        run: pnpm run proof:intune-entra-posture

      - name: SignalGrid core proof
        run: pnpm run proof:signalgrid-core

      - name: SignalGrid simulator proof
        run: pnpm run proof:signalgrid-simulator

      - name: Remediation-allow proof (a remediation record must not buy an allow the base-trust gate would refuse)
        run: pnpm run proof:remediation-allow

      - name: Remediation-allow conformance (shared vectors bound; native port REPORTED as pending)
        run: node scripts/check-remediation-allow-conformance.mjs

      - name: Remediation-allow conformance self-test (the gate can fail)
        run: node scripts/check-remediation-allow-conformance.mjs --self-test

      - name: SignalGrid grid proof
        run: pnpm run proof:signalgrid-grid

      - name: Microsoft Graph sandbox proof
        run: pnpm run proof:microsoft-graph-sandbox

      - name: Read-only Microsoft Graph connector proof
        run: pnpm run proof:graph-connector

      - name: Canonical event-contract proof (validation + cross-domain detections)
        run: pnpm run proof:event-contract

      - name: "Proof: local-authority (may this device act on its own authority now)"
        run: pnpm run proof:local-authority

      - name: "Proof: evidence-coverage (what can this estate answer)"
        run: pnpm run proof:evidence-coverage
      - name: "Proof: device-resolver (read-only injection boundary)"
        run: pnpm run proof:device-resolver
      - name: "Proof: config-scope (per-tenant connector config keys)"
        run: pnpm run proof:config-scope
      - name: "Proof: unsafe-claim (negation-aware claim scan)"
        run: pnpm run proof:unsafe-claim
      # Both of these ran in preflight but in NO workflow — proven only on a developer
      # machine while every status page said "CI runs the full gate suite".
      # `check-ci-preflight-sync.mjs` now derives this list rather than trusting it.
      - name: "Proof: dual-control (two-person integrity)"
        run: pnpm run proof:dual-control
      - name: "Proof: session-store (in-memory lifecycle)"
        run: pnpm run proof:session-store
      - name: "Proof: provisioning-order (zero-touch step order)"
        run: pnpm run proof:provisioning-order
      - name: macOS posture ↔ apple/device-management schema alignment proof
        run: pnpm run proof:macos-apple-schema

      # Agent BEHAVIOR — the action-judgment layer. Access brokers (Okta AI Agent
      # Gateway, Entra Agent ID) answer WHO the agent is; this asks whether the ACTION
      # is in-pattern: a prompt that became 40k updates, a never-opened target, no
      # provenance, a broad blast radius, a superhuman cadence. Fail-closed; one combo
      # of 1,944 grants.
      # Custody BEACON — the offline asset-recovery channel: an independent
      # case-embedded beacon fused with reachability tells "powered off in its bay"
      # (monitor) apart from "removed and dark" (escalate).
      # App-update currency — min_version floors, force_update, install-channel
      # provenance as posture (an iOS app cannot install itself; distribution stays
      # with itms-services / MDM InstallApplication / ABM).
      # Platform SSO — the METHOD decides the credential's worth; a login policy
      # claimed on a method that cannot enforce it is config drift.
      # MCP answer discipline — the SECOND of two MCP proofs, and deliberately so.
      # `proof:mcp-server` (further down, from the Mac lane) asks whether the published
      # plugin path boots and serves the tools the manifest declares. This asks whether
      # what it serves is EARNED: every optional input is a claim, and omitting one must
      # not be answered as an affirmative. Different questions, both load-bearing.
      - name: Proof — mcp-answer-discipline (silence is not an affirmative)
        run: pnpm run proof:mcp-answer-discipline

      # Policy binding — membership IS the policy: unbound, too-wide (fail-open),
      # too-narrow, or mixed-membership group assignment.
      - name: Proof — absent-collection (nothing observed is not nothing wrong)
        run: pnpm run proof:absent-collection
      - name: Proof — mdm-profile (the shipped profiles say what the product claims)
        run: pnpm run proof:mdm-profile
      - name: Proof — facility-trust-graph (canonical space model + location certainty)
        run: pnpm run proof:facility-trust-graph
      - name: Device-management-health / config-drift proof
        run: pnpm run proof:device-management-health

      # The task plane joins the grid: WMS/task-system exceptions (short pick,
      # wrong-aisle bin, assignment mismatch) as decision signals. The WMS stays
      # system of record; SignalGrid consumes, decides, and routes.
      # Issue #136's portable work context: the context carries the WORK (tasks,
      # exceptions, restrictions travel with the person); trust is re-earned per
      # device. Three monotone invariants proven over the full matrix.
      - name: Proof — work context (portable, descriptive, never permissive)
        run: pnpm run proof:work-context

      # Issue #136's handoff criterion + the warehouse release loop: exception →
      # hold → the worker keeps working → fix posted → fix INDEPENDENTLY verified
      # → released on a trusted device. A resolution posting is not verification.
      - name: Proof — handoff simulation (exception-release loop)
        run: pnpm run proof:handoff-sim

      # Issue #136 step 6: the grid proposes better flows from observed history,
      # but a proposal can never activate itself — approval is a required human
      # gate, proven exhaustively over the transition table.
      - name: Proof — adaptive proposals (governed lifecycle, no self-activation)
        run: pnpm run proof:adaptive-proposals

      # The self-aware, self-healing checklist over backend/frontend/API contracts:
      # fail-closed status, coverage-gap self-reporting, and a heal that cannot
      # apply itself — the same human-gate invariant as adaptive-proposals.
      - name: Proof — self-audit (fail-closed checklist, governed self-healing)
        run: pnpm run proof:self-audit

      # SLO / error-budget reliability for the decision plane. Latency and
      # availability carry error budgets; fail-closed integrity is zero-tolerance —
      # one fail-open exhausts it, so reliability can never be bought at the cost of
      # the fabric's core promise.
      - name: Proof — reliability (SLO/error-budget, fail-closed has no budget)
        run: pnpm run proof:reliability

      # Trust-gated GitOps: a declared desired-state is diffed (plan), rolled out
      # only through a governed lifecycle whose apply needs BOTH a recorded human
      # approval and an `allow` trust decision, and drift between declared and
      # observed becomes a self-audit signal. A rollout cannot apply itself.
      - name: Proof — iac (trust-gated GitOps, a rollout cannot apply itself)
        run: pnpm run proof:iac

      - name: Proof — verdict attestation (forged verdicts degrade)
        run: pnpm run proof:verdict-attestation

      - name: Guard-registry drift check
        run: node scripts/check-guard-registries.mjs
      # Runs in the fast source-reading job on purpose: it guards the Docker build
      # without needing Docker, so a missing hook entrypoint fails here in seconds
      # instead of in the compose smoke minutes later.
      - name: "Docker carries every install-hook entrypoint"
        run: node scripts/check-docker-lifecycle-copy.mjs
      # deploy-stack builds docker-compose.prod.yml, which contains only `db` and
      # `api` — so Dockerfile.web was never built by any job and had been
      # unbuildable (alpine is musl; only the -gnu native binaries survive the
      # workspace overrides). Static, so it catches that without a daemon.
      - name: "Container native base (a Dockerfile that cannot build is not a deploy path)"
        run: node scripts/check-container-native-base.mjs
      - name: "Publication boundary (public repo — nothing arrives unclassified)"
        run: node scripts/check-publication-boundary.mjs
      - name: API collection (a committed request must name a served route)
        run: node scripts/check-api-collection.mjs

      - name: Deployment runbook (the documented path must be the real one)
        run: node scripts/check-deployment-runbook.mjs
      - name: Scheduled routines self-test (the gate must be able to fail)
        run: node scripts/check-scheduled-routines.mjs --self-test
      - name: Scheduled routines (every always-on lane declared, authorized, scoped, evidenced)
        run: node scripts/check-scheduled-routines.mjs
      - name: iOS dynamic type self-test (the gate must be able to fail)
        run: node scripts/check-ios-dynamic-type.mjs --self-test
      - name: iOS dynamic type (no raw system font outside DesignSystem.swift)
        run: node scripts/check-ios-dynamic-type.mjs
      - name: iOS dead stored properties self-test (the gate must be able to fail)
        run: node scripts/check-ios-dead-stored-properties.mjs --self-test
      - name: iOS dead stored properties (a field nothing assigns makes every read of it dead)
        run: node scripts/check-ios-dead-stored-properties.mjs
      - name: iOS policy defaults self-test (the gate must be able to fail)
        run: node scripts/check-ios-policy-defaults.mjs --self-test
      - name: iOS policy defaults (no managed-config default derived from the absence of policy)
        run: node scripts/check-ios-policy-defaults.mjs
      - name: Sim-script self-check self-test (the gate must be able to fail)
        run: node scripts/check-sim-scripts-selfcheck.mjs --self-test
      - name: Sim-script self-check (a queued Mac operation must name a script that runs)
        run: node scripts/check-sim-scripts-selfcheck.mjs
      # Runs in this Node-only job on purpose. The rules it mirrors are enforced
      # for real by swiftlint in ios-ci.yml's `Lint & Security` job on a macOS
      # runner ~20 minutes later; PR #387 failed there on four violations that
      # were all plain text matching. This moves that class of failure to the
      # front of the run without needing a Swift toolchain.
      - name: Swift serious violations self-test (the gate must be able to fail)
        run: node scripts/check-swift-serious.mjs --self-test
      - name: Swift serious violations (the error-severity swiftlint rules, without a Swift toolchain)
        run: node scripts/check-swift-serious.mjs
      - name: iOS demo flags (every simulator flag the shell reads is documented, and vice versa)
        run: node scripts/check-demo-flags-documented.mjs
      - name: Lab registry self-test (the gate must be able to fail)
        run: node scripts/check-lab-registry.mjs --self-test
      - name: Lab registry (both halves agree; every deployment claim cites evidence on disk)
        run: node scripts/check-lab-registry.mjs
      - name: Evidence sources self-test (the gate can fail)
        run: node scripts/check-evidence-sources.mjs --self-test
      - name: Evidence sources (the contract's vocabulary matches what exists)
        run: node scripts/check-evidence-sources.mjs
      - name: Assist wire self-test (the gate must be able to fail)
        run: node scripts/check-assist-wire-served.mjs --self-test
      - name: Assist wire served-ness (a bound wire is served or a declared gap)
        run: node scripts/check-assist-wire-served.mjs
      - name: Decision palette self-test (the gate must be able to fail)
        run: node scripts/check-decision-palette.mjs --self-test
      - name: Verdict tone source (a verdict may not pick its own colour inline)
        run: node scripts/check-verdict-tone-source.mjs
      - name: Verdict tone source self-test (the gate can fail)
        run: node scripts/check-verdict-tone-source.mjs --self-test
      - name: Decision palette (one palette, every tree, AA everywhere)
        run: node scripts/check-decision-palette.mjs
      - name: Reason codes self-test (the gate must be able to fail)
        run: node scripts/check-reason-codes.mjs --self-test
      - name: Reason codes (the engine's vocabulary is the catalog's and the contract's)
        run: node scripts/check-reason-codes.mjs
      - name: Retention claims self-test (the gate must be able to fail)
        run: node scripts/check-retention-claims.mjs --self-test
      - name: Retention claims (no surface sells a duration nothing implements)
        run: node scripts/check-retention-claims.mjs
      - name: "Connector discipline (gated + proven, no device actuators)"
        run: node scripts/check-connector-discipline.mjs
      - name: Ungated-fetch self-test (the gate must be able to fail)
        run: node scripts/check-ungated-fetch.mjs --self-test
      - name: "Ungated fetch (the live boundary covers every outbound path)"
        run: node scripts/check-ungated-fetch.mjs
      # Sibling of the gate above: that one asks whether the call was allowed and whether
      # it is bounded, this one asks whether it went out SIGNED.
      - name: Signing-unconditional self-test (the gate must be able to fail)
        run: node scripts/check-signing-unconditional.mjs --self-test
      - name: "Signing unconditional (a missing secret refuses; it never sends unsigned)"
        run: node scripts/check-signing-unconditional.mjs
      # Third question at the same boundary: ungated-fetch asks whether the call was
      # ALLOWED, signing-unconditional whether it went out SIGNED, this asks WHAT WAS
      # IN IT. The emit gate decides whether anything may leave, not what it looks like.
      - name: "Emit-payload-discipline self-test (the gate must be able to fail)"
        run: node scripts/check-emit-payload-discipline.mjs --self-test
      - name: "Emit payload discipline (every field crossing to a vendor is named)"
        run: node scripts/check-emit-payload-discipline.mjs
      # Fourth question at the same boundary: ungated-fetch asks whether the call was
      # ALLOWED and BOUNDED, signing-unconditional whether it went out SIGNED,
      # emit-payload-discipline WHAT WAS IN IT — this one asks about the WIRE.
      - name: "Emitter-wire-discipline self-test (the gate must be able to fail)"
        run: node scripts/check-emitter-wire-discipline.mjs --self-test
      - name: "Emitter wire discipline (validated target, one signature scheme, checked vendor values)"
        run: node scripts/check-emitter-wire-discipline.mjs
      # Sibling of the gate above: that one asks whether the call was allowed to happen,
      # this one asks whether the result reported was one anybody observed.
      - name: "Fabricated status (a connector may not report a status it never observed)"
        run: node scripts/check-fabricated-status.mjs
      - name: "Fabricated status self-test (the gate can actually fail)"
        run: node scripts/check-fabricated-status.mjs --self-test
      # decision:read was enforced in memory and skipped on the durable path — the branch
      # returned before listDecisions/getDecision/getSnapshot ever authorized. The core proof
      # covers the new authorizedContext method; this covers the ROUTES calling it.
      - name: "Durable-path authorization (a durable read must authorize, not just authenticate)"
        run: node scripts/check-durable-path-authorization.mjs

      # Six offline proofs that ran in NO pull-request gate. They executed only in
      # mac-lane.yml, which loops every proof:* key but triggers on workflow_dispatch
      # and a weekly cron — never on pull_request — and is framed as a rehearsal, not
      # evidence. So a break in cross-tenant scoping, or a renamed ASAM bundle id in a
      # .mobileconfig, passed preflight and every check on the way in.
      - name: "Proof — isolation-scope (no tenant can read another's row)"
        run: pnpm run proof:isolation-scope
      - name: "Proof — mdm-profile (the shipped profiles say what the product claims)"
        run: pnpm run proof:mdm-profile
      - name: "Proof — graph-wire (throttling, 5xx, auth, malformed bodies fail closed)"
        run: pnpm run proof:graph-wire
      - name: "Assessor package (links/commands an external reviewer follows)"
        run: node scripts/check-assessor-package.mjs
      - name: OpenAPI validity (the published contract parses as OpenAPI)
        run: node scripts/check-openapi-valid.mjs
      - name: Launch claims (nothing deferred presented as current)
        run: node scripts/check-launch-claims.mjs
      - name: Permission enforcement (DR-002 — no scope granted that no surface demands)
        run: node scripts/check-permission-enforcement.mjs
      - name: Decision-record format (every call states how it gets undone)
        run: node scripts/check-decision-record-format.mjs
      - name: Test execution (a test no runner reaches is not coverage)
        run: node scripts/check-test-execution.mjs
      # Surface-level sibling of the file-level review-coverage gate. The owner's
      # worry, verbatim: "only a select portion of the repo vs the full repo".
      # Validation is whole-repo; the deep reads are not, and nothing showed which
      # surfaces had ever been read. Self-test first, so a drifted derivation
      # cannot report green about a surface set it no longer computes.
      - name: Surface-read-coverage self-test (the gate must be able to fail)
        run: node scripts/check-surface-review-coverage.mjs --self-test
      - name: Surface read coverage (an unread surface is named, never silent)
        run: node scripts/check-surface-review-coverage.mjs
      - name: Accuracy doctrine (DR-015 — unsourced citations, bare external statistics)
        run: node scripts/check-accuracy-doctrine.mjs
      - name: Agent roster (DR-016 — tier, charter, disjoint write boundary)
        run: node scripts/check-agent-roster.mjs
      - name: Skill-plane conformance self-test (the gate must be able to fail)
        run: node scripts/check-skill-plane-conformance.mjs --self-test
      - name: Skill-plane conformance (every skill/agent carries the name+description the harness selects it by)
        run: node scripts/check-skill-plane-conformance.mjs
      - name: Positioning trace (every ratified claim resolves by id in the launch profile)
        run: node scripts/check-positioning-trace.mjs
      - name: Module init order (a const read before it is initialised)
        run: node scripts/check-module-init-order.mjs
      - name: Walker-floor self-test (a floorless roots-array walk must fail)
        run: node scripts/check-walker-floors.mjs --self-test
      - name: Walker floors (every ROOTS/roots-array walk declares a non-vacuity floor)
        run: node scripts/check-walker-floors.mjs
      - name: NaN fail-open (an unparseable expiry must read as EXPIRED)
        run: node scripts/check-nan-fail-open.mjs
      - name: Posed-bound self-test (the gate must be able to fail)
        run: node scripts/check-posed-bounds.mjs --self-test
      - name: Posed bounds (a caller-posed numeric bound is never read with ??)
        run: node scripts/check-posed-bounds.mjs
      - name: Freshness-divergence self-test (the gate must be able to fail)
        run: node scripts/check-freshness-divergence.mjs --self-test
      - name: Freshness divergence (one future/age rule, one body; exemptions REPORTED)
        run: node scripts/check-freshness-divergence.mjs
      - name: CI liveness (a sweep that stops running must fail a build)
        run: node scripts/check-ci-liveness.mjs
      - name: CI job timeouts (an unbounded job is an unbounded outage)
        run: node scripts/check-ci-job-timeouts.mjs

      # The declared product edge must match the real one, in BOTH directions. The
      # omission direction is the freeze: a new connector family, signal kind, API
      # path or app surface fails this until a human classifies it, because
      # "unexamined" is the door breadth walks back in through.
      - name: "Launch profile (declared product edge == real one)"
        run: node scripts/check-launch-profile.mjs
      - name: Proof — launch profile (Limited GA scope is coherent; figures published)
        run: pnpm run proof:launch-profile
      # The connector→decision seam, closed and pinned: fixture-mode resolution
      # hands back WORKING connectors for all three launch families, and their
      # output flows through the integration bridge into a core decision whose
      # evidence carries the family facts — with fetch() disabled for the run.
      - name: Proof — launch seam (fixture connector → bridge → decision, offline)
        run: pnpm run proof:launch-seam
      - name: Proof — evidence adapter (source-agnostic swap, fleet/headwind/intune)
        run: pnpm run proof:evidence-adapter
      - name: Proof — mobile-app-catalog scanner (hardening delta over the filed original)
        run: pnpm run proof:mobile-app-catalog
      - name: Proof — sim-request loop (cloud asks, only the Mac answers, unrun is never green)
        run: pnpm run proof:sim-requests
      - name: /v1 under concurrency (correctness gated; throughput reported)
        run: pnpm run test:load
      - name: Simulation request loop (results bind to requests; pending reported)
        run: node scripts/check-sim-requests.mjs
      - name: Simulation request loop self-test (the gate can fail)
        run: node scripts/check-sim-requests.mjs --self-test
      - name: Known-false claims (a claim proven false once is not made twice)
        run: node scripts/check-known-false-claims.mjs
      - name: Known-false-claim self-test (the gate can fail)
        run: node scripts/check-known-false-claims.mjs --self-test
      - name: Memory freshness (an aging "as of" claim is named; registry rot is fatal)
        run: node scripts/check-memory-freshness.mjs
      - name: Memory freshness self-test (the gate can fail)
        run: node scripts/check-memory-freshness.mjs --self-test
      - name: Action pinning (third-party actions must be immutable commits)
        run: node scripts/check-action-pinning.mjs
      - name: Action pinning self-test (the gate can fail)
        run: node scripts/check-action-pinning.mjs --self-test
      - name: Org roster (unactivated roles are named, never silent)
        run: node scripts/check-org-roster.mjs
      - name: Org roster self-test (the gate can fail)
        run: node scripts/check-org-roster.mjs --self-test
      - name: Backlog ownership (work left in a row names the role that owns it)
        run: node scripts/check-backlog-ownership.mjs
      - name: Backlog ownership self-test (the gate can fail)
        run: node scripts/check-backlog-ownership.mjs --self-test
      - name: Backlog evidence (a row that says DONE says how you'd check)
        run: node scripts/check-backlog-evidence.mjs
      - name: Backlog evidence self-test (the gate can fail)
        run: node scripts/check-backlog-evidence.mjs --self-test
      - name: Surface-ownership self-test (the gate must be able to fail)
        run: node scripts/check-surface-ownership.mjs --self-test
      - name: Surface ownership (every file is somebody's)
        run: node scripts/check-surface-ownership.mjs
      - name: Role coverage (has each role read what it owns; ratcheted)
        run: node scripts/check-role-coverage.mjs
      - name: Role-coverage self-test (the gate can fail)
        run: node scripts/check-role-coverage.mjs --self-test
      - name: Owner-gated surfaces manifest (autonomous-merge escalation line is non-empty)
        run: node scripts/check-owner-gated-surfaces.mjs
      - name: Owner-gated surfaces self-test (classify routes owner-gated diffs to the owner)
        run: node scripts/check-owner-gated-surfaces.mjs --self-test
      - name: Cited commands (documents may not promise a command that is gone)
        run: node scripts/check-cited-commands.mjs
      - name: Cited-command self-test (the gate can fail)
        run: node scripts/check-cited-commands.mjs --self-test
      - name: Review coverage (printed beside every green suite)
        run: node scripts/check-review-coverage.mjs
      - name: Review-coverage self-test (the gate can fail)
        run: node scripts/check-review-coverage.mjs --self-test
      # MOVED HERE 2026-08-19 because it was path-filtered away from half its own
      # subject. This gate asserts that EVERY Assist client consumes the shared
      # wire vectors, and it discovers two — native/android/core (Kotlin) and
      # native/desktop/core (Rust). It ran only in desktop.yml, whose filter is
      # native/desktop/** and native/shared/**, so a change to the KOTLIN client
      # never triggered it: the precise failure it exists to catch ("a client
      # quietly stops reading the file, keeps its own tests, keeps passing"), in
      # the client where it already caught two real defects, was invisible. It is
      # a pure Node file-read with no platform dependency, so gating every PR
      # costs nothing and removes the whole class.
      - name: Assist conformance (every client bound to the shared wire vectors)
        run: node scripts/check-assist-conformance.mjs
      - name: Assist-conformance self-test (the gate can fail)
        run: node scripts/check-assist-conformance.mjs --self-test
      - name: Proof — lane messages (identity derived; no lane acknowledges its own mail)
        run: pnpm run proof:lane-messages
      - name: Lane messages (unread mail is named on every run, never silent)
        run: node scripts/check-lane-messages.mjs
      - name: Lane message self-test (the gate can fail)
        run: node scripts/check-lane-messages.mjs --self-test
      - name: Proof — operating method (the handbook is a gate, not a memory)
        run: pnpm run proof:operating-method

      # SEVEN gates lived in scripts/preflight.mjs and ran NOWHERE in CI — checked
      # against all 12 workflow files, not just this one. That made them local
      # conveniences rather than gates: they fired only when somebody remembered to
      # run preflight, and every one exists to catch drift that is silent by
      # definition. A ratchet that depends on being remembered is not a ratchet.
      #
      # The preflight header warns about keeping these lists "in lockstep", but only
      # in the CI→preflight direction ("a proof that runs in CI but not here would
      # let a red build pass preflight"). The reverse gap is worse and was the one
      # that had actually opened: a guard that runs in preflight but not in CI does
      # not fail a pull request, so the drift it exists to catch lands on the branch
      # unchallenged and the guard reports green forever after.
      #
      # The most consequential is review-invariants — the repo's automated "second
      # reviewer", encoding the defect classes Codex repeatedly caught on this repo
      # (fail-closed control flow, determinism, Assist-safety, truthfulness). It was
      # the FIRST gate in preflight and ran in no workflow at all.
      #
      # All seven are pure Node and need no external service.
      - name: "Doc orphans (a new doc must be reachable from an index)"
        run: node scripts/check-doc-orphans.mjs
      - name: "Doc-orphan self-test (a prose mention is not a route)"
        run: node scripts/check-doc-orphans.mjs --self-test
      # One level up from doc-orphans: that one asks whether a reader can REACH a
      # document, this one whether the index tells the truth about it. Six entries
      # described SUPERSEDED / ARCHIVED / RETIRED documents in the present tense --
      # counted by running this gate against `git show HEAD:docs/INDEX.md`, not from
      # memory; see the FIXTURE note in the script header for the reproduction.
      - name: "Index\u2194banner parity self-test (the gate must be able to fail)"
        run: node scripts/check-index-banner-parity.mjs --self-test
      - name: "Index\u2194banner parity (a bannered doc is not described alive in INDEX.md)"
        run: node scripts/check-index-banner-parity.mjs
      # The #336 self-check tooling, wired 2026-08-31 after its fail-closed
      # inversions were fixed. Latent standalone scripts are how check:postman
      # rotted out of every lane; these fail the PR now.
      - name: "Gate census (every gate runs somewhere)"
        run: node scripts/check-gate-census.mjs
      - name: "Gate census self-test (the guard can actually fail)"
        run: node scripts/check-gate-census.mjs --self-test
      - name: "Failure-diagnosis registry audit (evidence paths still exist)"
        run: node scripts/classify-failure.mjs --audit
      - name: "Gap scan (blocking findings fail; a degraded scan is blocking)"
        run: node scripts/scan-gaps.mjs
      - name: "Gap scan self-test (a dying scan command must surface)"
        run: node scripts/scan-gaps.mjs --self-test
      # One name for the decision transaction. Blocks new nouns; never forces a
      # breaking rename of generated or published contracts.
      - name: "Decision vocabulary (one name for the decision transaction)"
        run: node scripts/check-decision-vocabulary.mjs
      - name: "Decision-vocabulary gate self-test (the gate can actually fail)"
        run: node scripts/check-decision-vocabulary.mjs --self-test
      - name: "Product framing (current-truth surfaces reference PURPOSE.md)"
        run: node scripts/check-product-framing.mjs
      - name: "Product-framing gate self-test (the gate can actually fail)"
        run: node scripts/check-product-framing.mjs --self-test
      # The docs↔proof figure guard reads markdown, and only inside a section that
      # names its proof. `docs/architecture.html` contradicted SIGNAL_CATEGORIES by
      # five for months in a format no gate read.
      - name: "Docs-HTML figure guard self-test (the gate can actually fail)"
        run: node scripts/check-doc-html-figures.mjs --self-test
      - name: "Docs-HTML figures (no rendered page contradicts a derived figure)"
        run: node scripts/check-doc-html-figures.mjs
      # Markdown figures no proof publishes, so the docs↔proof guard cannot see them:
      # the Bruno request count (docs/INDEX.md + the collection README), the Postman
      # request/folder counts, the proof-script count. Derived from the artifacts
      # themselves — no server is booted, only committed files are read.
      - name: "Derived-doc-figure self-test (a planted drift in each live document must fail)"
        run: node scripts/check-derived-doc-figures.mjs --self-test
      - name: "Derived doc figures (a stated count equals the artifact it describes)"
        run: node scripts/check-derived-doc-figures.mjs
      # Two documents stated the four tier branches as live after all four were
      # pruned, while BRANCH_HYGIENE.md recorded the opposite. Offline by design.
      - name: "Documented-branch self-test (the gate can actually fail)"
        run: node scripts/check-documented-branches.mjs --self-test
      - name: "Documented branches (a doc may not state a pruned branch as existing)"
        run: node scripts/check-documented-branches.mjs
      # Orphans ask whether a reader can REACH a doc; this asks whether the doc points
      # anywhere real once reached. Added after two separate analyses cited files that
      # did not exist and were read as evidence by everyone downstream.
      - name: "Cited paths (a doc may not cite a file that does not exist)"
        run: node scripts/check-cited-paths.mjs
      - name: "Cited-path self-test (the gate can actually fail)"
        run: node scripts/check-cited-paths.mjs --self-test
      # The MCP-ecosystem source-independence map: every externally-sourced connector
      # family must carry a row in docs/research/MCP_ECOSYSTEM_SIGNAL_SOURCES.md (an
      # MCP server or an explicit gap marker), and the map may not name a family the
      # tree does not have. Derived from the family directories under
      # lib/integrations/src/integrations, self-tested both directions (DR-028).
      - name: "MCP-ecosystem-map self-test (the gate can fail both directions)"
        run: node scripts/check-mcp-ecosystem-map.mjs --self-test
      - name: "MCP-ecosystem map (every externally-sourced family has an ecosystem row or a stated gap)"
        run: node scripts/check-mcp-ecosystem-map.mjs
      - name: "Absence-check self-test (a word in a disclaimer is not the thing existing)"
        run: node scripts/agent/absence-check.mjs --self-test
      # The same shape one level down: doc-orphans asks whether a reader can reach a
      # document, this asks whether a shipped artifact can reach a library. Both catch
      # the failure mode that never announces itself — everything green, nothing
      # arrives. Added after a design pass found `lib/dual-control` had zero shipped
      # consumers AFTER the work to wire it had already been scoped.
      - name: "Package reachability (a library nobody ships is a library nobody runs)"
        run: node scripts/check-package-reachability.mjs
      # The provenance stamp is GENERATED, so the gate is "regenerate and compare
      # content" — deliberately not `git diff`, which is blind to untracked files and
      # would have passed on the very commit that introduced the artifacts.
      - name: "Core normalization-version (provenance stamp tracks the covered core source)"
        run: node scripts/generate-core-normalization-version.mjs --check
      # Same shape, one document over: docs/CLAIM_INVENTORY.md is derived from
      # docs/agent/CLAIM_INVENTORY.json and had no re-derivation anywhere — the
      # generator ran in no lane and no workflow, so drift was silent and the
      # document's own preamble vouched for whatever was committed.
      - name: "Claim-inventory drift (the derived Markdown matches its JSON source)"
        run: node scripts/gen-claim-inventory-md.mjs --check
      - name: "Claim-inventory self-test (the drift check can actually fail)"
        run: node scripts/gen-claim-inventory-md.mjs --self-test
      - name: "Proof — dual control"
        run: pnpm run proof:dual-control
      - name: "Pagination-truncation guard (a capped read must not look complete)"
        run: node scripts/check-pagination-truncation.mjs
      - name: "Absent-collection law (nothing observed ≠ nothing wrong)"
        run: pnpm run proof:absent-collection
      - name: "Mutation sharding partitions the registry (the daily sweep loses no target)"
        run: node scripts/check-mutation-sharding.mjs
      - name: "Backlog row citations name rows that exist"
        run: node scripts/check-row-citations.mjs
      - name: "Row-citation gate self-test (it can actually fail)"
        run: node scripts/check-row-citations.mjs --self-test
      - name: "IT-layer model (every refusal has an owner; nothing routes to a phantom)"
        run: node scripts/check-it-layer-model.mjs
      - name: "IT-layer model self-test (the gate can actually fail)"
        run: node scripts/check-it-layer-model.mjs --self-test
      - name: "Port parity (DecisionEngine + AppWorkflows vs their TS originals; SignalGridMobile mock vs the core vocabulary)"
        run: node scripts/check-decision-port-parity.mjs
      - name: "Read-error swallowing (a failed lookup must not report nothing-found)"
        run: node scripts/check-read-error-swallowing.mjs
      # Every other gate here checks what the text MEANS. This one checks the text is
      # what it appears to be — no bidirectional control or invisible character may
      # make a tracked file render differently from how it executes (CVE-2021-42574).
      # gitleaks scans for secrets and CodeQL for dataflow; neither has an opinion
      # about text that lies about itself, and nothing else in this repo looked.
      - name: "Text safety (no file may render differently from how it executes)"
        run: node scripts/check-text-safety.mjs
      # Cheap and direct. The container jobs DID fail on the conflict marker that
      # reached Dockerfile.web, but only because a build happens to parse that file
      # — a marker in a doc, fixture or Swift source produces no build failure at
      # all. This finds it in milliseconds, everywhere.
      - name: "Merge markers (no unresolved conflict may be committed)"
        run: node scripts/check-merge-markers.mjs
      - name: "Proof — mcp-server (published plugin path boots + serves declared tools)"
        run: pnpm run proof:mcp-server
      # And the ratchet for the ratchets: fails if a future preflight gate is added
      # without being wired into a workflow. It has to run HERE, not only in
      # preflight, or it would be the very thing it exists to prevent.
      - name: "Preflight↔CI parity self-test (a comment mention is not a run)"
        run: node scripts/check-preflight-ci-parity.mjs --self-test
      - name: "Preflight↔CI parity (a gate that runs only locally is not a gate)"
        run: node scripts/check-preflight-ci-parity.mjs

      # The Mac MCP lane and iOS shell build against this repo's contracts from
      # OUTSIDE CI's reach. This gate hard-fails when contracts change without
      # republishing the machine-readable sync manifest, and soft-reports when
      # committed real-hardware evidence has gone stale — only the owner's
      # hardware can refresh that, so staleness never blocks a commit.
      - name: Live-sync manifest drift (Mac MCP + iOS instructions current)
        run: node scripts/check-live-sync.mjs
      - name: MCP surface self-test (coverage + resource parity can fail)
        run: node scripts/check-mcp-surface.mjs --self-test
      - name: MCP surface drift gate (server = docs = ready message = manifest = resources = exercised)
        run: node scripts/check-mcp-surface.mjs

      - name: Figure-guard self-test (the baseline-age report must be able to fail)
        run: node scripts/check-proof-figures.mjs --self-test
      - name: Docs↔proof figure guard
        run: node scripts/check-proof-figures.mjs

      - name: PIM activation decision proof
        run: pnpm run proof:pim-activation

      - name: Grant-safety harness self-proof (allow-path brute-force detector)
        run: pnpm run proof:grant-safety

      # Documented proof check-counts are evidence; evidence that silently drifts is
      # worse than none. Fails if any "(N checks)" in docs/ disagrees with the proof.
      - name: Proof-count self-test (a zeroed claim scan fails via the floor)
        run: node scripts/check-proof-counts.mjs --self-test
      - name: Proof-count sync (docs match their proofs)
        run: pnpm run check:proof-counts

      - name: Posture-composition (unified signal fusion) proof
        run: pnpm run proof:posture-composition

      - name: Incident-playbook (decision to prioritized incident) proof
        run: pnpm run proof:incident-playbook

      - name: Fabric decision-evals (golden multi-signal decision quality) proof
        run: pnpm run proof:fabric-evals

      - name: Connector emulator proof
        run: pnpm run proof:connector-emulator

      - name: OpenAPI contract check
        run: pnpm run proof:api-contract

      - name: API integration test
        run: pnpm run test:api

      # The MCP server's own node:test suite — wire-visible tool/resource contract
      # and read-only annotations (incl. the deliberately not-read-only
      # bruno_collection_run). It was executed by no lane until 2026-09-02;
      # check-test-execution.mjs now reads this line to see it reached.
      - name: MCP server unit tests (tool/resource contract + annotations)
        run: pnpm --filter @workspace/mcp-server run test
      - name: Console routes self-test (the gate must be able to fail)
        run: node scripts/check-console-routes.mjs --self-test
      - name: Console routes (every console fetch target maps to a served route)
        run: node scripts/check-console-routes.mjs
      - name: Dead nav self-test (the gate must be able to fail)
        run: node scripts/check-dead-nav.mjs --self-test
      - name: Dead nav (a *_NAV/*_GROUPS array rendered nowhere is dead code)
        run: node scripts/check-dead-nav.mjs

      - name: OIDC middleware test (the production auth branch actually executes)
        run: pnpm run test:oidc
      - name: Bruno collection live run (the committed contract, executed both profiles)
        run: node scripts/run-bruno-collection.mjs

      - name: Observability (metrics endpoint) proof
        run: pnpm run proof:observability

      - name: Enterprise auth (OIDC/JWT) proof
        run: pnpm run proof:enterprise-auth

      # Real cryptographic material, zero cost: a certified OIDC provider booted
      # in-process mints genuine RS256/DPoP tokens over real HTTP, and every
      # accept/reject decision runs through the production verifier. The fixture
      # proof above shows the logic is right; this shows it is right against
      # bytes SignalGrid did not fabricate.
      - name: Live IdP proof (real OIDC provider, real DPoP, in-process)
        run: pnpm run proof:live-idp

      # The first browser-level gate: what a human actually sees. The suite's
      # maiden run caught a real gap (a decision-evidence row the core carried
      # and no console scenario ever rendered), so this layer has already paid
      # for itself once.
      # The GitHub runner ships no Playwright browser — the preinstalled Chromium
      # this suite uses locally is a property of the dev sandbox, not of CI. The
      # maiden CI run proved it: all 15 tests failed browser LAUNCH in <11ms
      # while the same suite passed 15/15 locally. Install before running.
      # BOUNDED AND RETRIED, because this step hung for 16 minutes on 2026-08-19
      # and consumed the whole job. `--with-deps` shells out to apt to install
      # Chromium's system libraries; that run found `azure.archive.ubuntu.com`
      # unreachable (repeated `Ign:`), fell back to `archive.ubuntu.com`, and then
      # stalled with no timeout of its own. Everything before it had already
      # passed — every gate and all 31 assertions of proof:live-idp — so the job
      # reported `cancelled` for a reason that had nothing to do with the branch.
      #
      # A mirror flake is transient, so retry; but an unbounded step that eats a
      # 20-minute budget and reports an ambiguous status is the same defect this
      # workflow's concurrency comment already complains about — a result nobody
      # can tell apart from a real regression. The step timeout makes it fail
      # FAST and legibly instead.
      - name: Install Playwright Chromium for the E2E suite
        timeout-minutes: 10
        run: |
          # SPLIT ON PURPOSE. `--with-deps` does two things: download the browser
          # (from Playwright's CDN) and apt-install system libraries. Only the
          # second touches a distro mirror, and that is the half that failed twice
          # on 2026-08-19 — first hanging 16 minutes until the job timeout, then
          # again at the step timeout added in response.
          #
          # Each ATTEMPT is bounded with `timeout`, not just the step: a retry loop
          # around an unbounded command is dead code, because one hung attempt eats
          # the whole budget before the second ever starts. That was the flaw in
          # the first fix, and it is exactly the shape this repo keeps finding — a
          # guard that looks like protection and never runs.
          ok=
          for attempt in 1 2 3; do
            if timeout 180 pnpm --filter @workspace/scripts exec playwright install chromium; then
              ok=1; break
            fi
            echo "::warning::Chromium download failed (attempt ${attempt}/3) — retrying"
            sleep $((attempt * 10))
          done
          if [ -z "$ok" ]; then
            echo "::error::Playwright Chromium download failed three times; the E2E suite cannot run."
            exit 1
          fi

          # System libraries are BEST EFFORT. ubuntu-latest already ships nearly
          # all of Chromium's, so a mirror outage must not fail a build whose
          # browser is already in place. If a library really is missing, the E2E
          # suite fails on launch with a message that names it — a better signal
          # than an apt stall, and it fails in the step that actually needs it.
          timeout 240 pnpm --filter @workspace/scripts exec playwright install-deps chromium \
            || echo "::warning::playwright install-deps did not complete (distro mirror?); relying on the runner's preinstalled libraries."

      - name: Browser E2E (review console, website, admin console)
        run: pnpm run test:e2e

      - name: WebAuthn signature-verification proof
        run: pnpm run proof:webauthn-verify

      - name: Audit-ledger (redaction + tamper-evident chain) proof
        run: pnpm run proof:audit-ledger
      # Inherited byte-identical from the legacy DEV repo, whose roadmap flagged it and
      # whose fix was never written: String.replace $-expansion in ITSM ticket templates.
      - name: Proof - itsm-credential-crypto (a weak key is refused, not stretched)
        run: pnpm run proof:itsm-credential-crypto
      - name: Proof - telemetry-posture-cache (stale posture is never served as current)
        run: pnpm run proof:telemetry-posture-cache
      - name: Proof — itsm-template (values verbatim, keys inert)
        run: pnpm run proof:itsm-template

      - name: Orchestration (Trust→Action) proof
        run: pnpm run proof:orchestration

      - name: Room-sim (Trusted-Entry, multi-vertical) proof
        run: pnpm run proof:room-sim

      - name: App-workflows (application gating) proof
        run: pnpm run proof:app-workflows

      - name: App-workflow templates + validation lint proof
        run: pnpm run proof:app-workflow-templates

      - name: Flows (admin flow config + health) proof
        run: pnpm run proof:flows

      - name: Grid-coverage (build the grid — the coverage ceiling and its basis) proof
        run: pnpm run proof:grid-coverage

      - name: Grid-config (workflows as code — CI validation) proof
        run: pnpm run proof:grid-config

      - name: App-resilience (cloud-app downtime, PHI-safe fallback) proof
        run: pnpm run proof:app-resilience

      - name: Provisioning (zero-touch setup — record/validate/apply) proof
        run: pnpm run proof:provisioning

      - name: Provisioning teardown-proof (prove the retreat before deploy)
        run: pnpm run proof:provisioning-teardown

      - name: Recommendations (learned-habit proposals) proof
        run: pnpm run proof:recommendations

      - name: Signal-discovery (auto-onboarding) proof
        run: pnpm run proof:signal-discovery

      - name: DDM / device-health connector proof
        run: pnpm run proof:ddm-connector

      - name: Fleet (osquery MDM) connector proof
        run: pnpm run proof:fleet-connector

      - name: Signal Radar (new-signal detection) proof
        run: pnpm run proof:signal-radar

      - name: Control-plane (cloud↔edge contract) proof
        run: pnpm run proof:control-plane

      - name: Edge-sync (config-down integrity) proof
        run: pnpm run proof:edge-sync

      - name: Decision-continuity (which decision wins across a partition) proof
        run: pnpm run proof:decision-continuity

      - name: Safety gate (guardrails)
        run: pnpm run safety:check

      - name: Postman collection is committed in sync
        run: |
          # ls-files first: `git diff` says nothing about an UNTRACKED path, so the
          # diff alone passes for a file that was never committed or was deleted.
          git ls-files --error-unmatch docs/postman > /dev/null || (echo "::error::docs/postman is not tracked." && exit 1)
          pnpm run build:postman
          git diff --exit-code docs/postman || (echo "::error::Postman collection out of date — run 'pnpm run build:postman' and commit." && exit 1)

      - name: Shell lint (shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          node scripts/check-shell.mjs

      - name: Evidence Coverage page is committed in sync
        run: |
          git ls-files --error-unmatch docs/evidence-coverage.html > /dev/null || (echo "::error::docs/evidence-coverage.html is not tracked — generated pages must be committed." && exit 1)
          pnpm run build:evidence-coverage
          git diff --exit-code -- docs/evidence-coverage.html || (echo "::error::docs/evidence-coverage.html out of date — run 'pnpm run build:evidence-coverage' and commit." && exit 1)

      # docs/STATUS.md is generated, but deliberately NOT gated by regenerate-and-diff
      # like the three checks above: it embeds the HEAD sha as its own staleness tell,
      # so it can never equal its own regeneration, and its generator is slow and hits
      # the network. Gate the inventory counts instead — cheap, offline, and the part
      # that had actually rotted (95 proof gates against a real 122, 8 E2E specs
      # against 10, 12 CI workflows against 16).
      - name: STATUS.md figures still describe the repo
        run: node scripts/check-status-figures.mjs
      - name: STATUS.md figure gate self-test (the gate can actually fail)
        run: node scripts/check-status-figures.mjs --self-test

      - name: Decision-latency pilot gate
        run: pnpm run bench:decision-latency

      # Saturation companion to the gate above. The decisions/sec it prints are a
      # property of the runner and are reported, not asserted; what fails a PR is
      # a throughput floor derived from the 750 ms p95 gate, no gain from adding
      # cores, or a verdict that changes under concurrency.
      - name: Decision-throughput saturation gate
        run: pnpm run bench:decision-throughput -- --seconds=2

  # The deferred-family and doctrine-document proofs (plan §11.4 step 4). A
  # required lane on every PR, run IN PARALLEL with `validation` so the wall
  # clock drops rather than grows — moved out of the serial per-push preflight,
  # never out of CI. Membership is enforced inside the script against the
  # launch profile, and check-ci-preflight-sync.mjs keeps this lane and
  # preflight disjoint and jointly complete.
  breadth:
    name: Breadth lane (deferred families + doctrine docs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Breadth lane (47 deferred-family gates + 8 doctrine-doc proofs)
        run: pnpm run verify:breadth

  docs-sanity:
    timeout-minutes: 15
    name: Required docs and unsafe-claim sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Required docs exist + affirmative-unsafe-claim scan. Shared with
      # `pnpm run preflight` via scripts/docs-sanity.mjs so the check is the same
      # locally and in CI.
      - name: CI↔preflight drift (every proof runs in both places)
        run: node scripts/check-ci-preflight-sync.mjs

      - name: Docs-sanity self-test (a planted over-claim fails; empty scan roots fail via the floor)
        run: node scripts/docs-sanity.mjs --self-test
      - name: Docs sanity (required docs + unsafe-claim scan)
        run: node scripts/docs-sanity.mjs

  durable-persistence:
    name: Durable persistence (Postgres audit ledger)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sg
          POSTGRES_PASSWORD: sg
          POSTGRES_DB: signalgrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Migrations run FIRST, so every durable proof below exercises a schema
      # the migration path produced — the upgrade path is tested on every PR
      # instead of being discovered at the first real upgrade. The psql
      # assertion pins that the runner actually RECORDED a version: a runner
      # that silently did nothing would leave the proofs green against
      # store-created tables, which is exactly the unearned affirmative this
      # job exists to refuse. The second run pins idempotency.
      - name: Schema migrations + version assertion (idempotent on re-run)
        env:
          DATABASE_URL: postgres://sg:sg@localhost:5432/signalgrid
          PGPASSWORD: sg
        run: |
          pnpm run db:migrate
          V=$(psql -h localhost -U sg -d signalgrid -tAc "SELECT COALESCE(MAX(version),0) FROM schema_version")
          echo "schema_version records: $V"
          if [ "$V" -lt 1 ]; then
            echo "::error::db:migrate ran but schema_version records nothing"
            exit 1
          fi
          pnpm run db:migrate

      # Exercises the REAL durable path: writes/reads the tamper-evident audit
      # ledger against a live Postgres, proving durability, redaction, tamper
      # detection, and fork-free concurrency. The default (DATABASE_URL unset)
      # in-memory path is covered separately by proof:audit-ledger.
      - name: Durable audit-ledger proof on Postgres
        env:
          DATABASE_URL: postgres://sg:sg@localhost:5432/signalgrid
          # The proofs DROP the tables they test (and the role-split proof alters the
          # cluster-wide runtime role). They refuse to run without this declaration —
          # the service container above is exactly the throwaway cluster it names.
          SIGNALGRID_DB_DISPOSABLE: "1"
        run: pnpm run proof:audit-ledger-pg

      # Durable decision + evidence store: save/get/list, tenant isolation,
      # tamper-evident snapshots, durability across instances, and concurrency.
      - name: Durable decision-store proof on Postgres
        env:
          DATABASE_URL: postgres://sg:sg@localhost:5432/signalgrid
          # The proofs DROP the tables they test (and the role-split proof alters the
          # cluster-wide runtime role). They refuse to run without this declaration —
          # the service container above is exactly the throwaway cluster it names.
          SIGNALGRID_DB_DISPOSABLE: "1"
        run: pnpm run proof:decision-store-pg

      # Durable session lifecycle: start/refresh/expire/end, isolation, durability.
      - name: Durable session-store proof on Postgres
        env:
          DATABASE_URL: postgres://sg:sg@localhost:5432/signalgrid
          # The proofs DROP the tables they test (and the role-split proof alters the
          # cluster-wide runtime role). They refuse to run without this declaration —
          # the service container above is exactly the throwaway cluster it names.
          SIGNALGRID_DB_DISPOSABLE: "1"
        run: pnpm run proof:session-store-pg

      # Backup and restore, END TO END. Seeds the tamper-evident ledger, backs it up,
      # DESTROYS the schema, restores, and re-verifies the chain — plus the negative
      # controls (a flipped byte, a truncated archive, a missing manifest must all be
      # REFUSED). A backup nobody has restored is not a backup, and until this existed
      # the repository had no `pg_dump` anywhere at all.
      #
      # pg_dump/pg_restore must be at least as new as the server (16). ubuntu-latest
      # ships 16 client tools; asserted rather than assumed, because a silent version
      # skew would fail here in a confusing way.
      - name: Assert the Postgres client tools match the server major
        run: |
          CLIENT=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "pg_dump major: $CLIENT"
          if [ "$CLIENT" -lt 16 ]; then
            echo "::error::pg_dump $CLIENT cannot dump a PostgreSQL 16 server"
            exit 1
          fi

      - name: Backup/restore proof on Postgres
        env:
          DATABASE_URL: postgres://sg:sg@localhost:5432/signalgrid
          # The proofs DROP the tables they test (and the role-split proof alters the
          # cluster-wide runtime role). They refuse to run without this declaration —
          # the service container above is exactly the throwaway cluster it names.
          SIGNALGRID_DB_DISPOSABLE: "1"
        run: pnpm run proof:backup-restore

      # The DATABASE ROLE SPLIT, both directions (owner-ordered shift 2): as
      # `signalgrid_runtime` every legitimate write works (ledger appends chain,
      # decision upserts, session transitions) and every destructive statement is
      # DENIED with 42501 (UPDATE/DELETE/TRUNCATE/DROP/ALTER/CREATE) — the ledger
      # is append-only BY PRIVILEGE, not just by hash chain. The admin credential
      # CAN update (rolled back), so the denial is proven to be the role, not the
      # table. Then backup → posture destroyed → restore: the SAME posture comes
      # back (restoreBackup re-applies the split after pg_restore --no-privileges
      # strips it) and the runtime still owns nothing.
      - name: Database role-split proof on Postgres (append-only by privilege)
        env:
          DATABASE_URL: postgres://sg:sg@localhost:5432/signalgrid
          # The proofs DROP the tables they test (and the role-split proof alters the
          # cluster-wide runtime role). They refuse to run without this declaration —
          # the service container above is exactly the throwaway cluster it names.
          SIGNALGRID_DB_DISPOSABLE: "1"
        run: pnpm run proof:db-role-split

  # Podman is the repo's chosen runtime (scripts/lib/container-engine.mjs). It was
  # verified locally — full docker-verify lane green under podman 4.9.3 — but a local
  # run is not a gate, and the whole point of that abstraction is that BOTH engines
  # keep working. So the container lane runs here under podman on every PR, next to
  # the docker job below, and a divergence between them shows up as a red check
  # rather than as a surprise on someone's laptop.
  #
  # CONTAINER_ENGINE=podman is set explicitly rather than relying on auto-detection:
  # this job exists to prove PODMAN specifically, and a silent fallback to docker
  # would leave it green while testing the thing the other job already covers.
  podman-stack:
    name: Prod stack (Podman)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONTAINER_ENGINE: podman
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Podman version (a missing engine must fail loudly, not skip)
        run: podman version --format '{{.Server.Version}}'

      # THE FIX, and why it is needed. `podman run` goes through libpod, which sets
      # RLimitDefaultValue = 1048576 (clamped to the host hard limit). `podman build`
      # RUN steps go through BUILDAH, whose 4.9.3 vendored copy has no such constant,
      # so they inherit the OCI runtime's nofile=1024. Confirmed in podman 4.9.3's own
      # source. Newer podman (6.2.0-dev) vendors a buildah that DOES define it, so this
      # flag is a compatibility measure — harmless where the default is already high. Rollup
      # opens hundreds of modules concurrently during `vite build`; at 1024 it hits
      # EMFILE and reports whichever module lost the race as "failed to resolve" —
      # which is exactly why a DIFFERENT package failed on every run. Docker's builder
      # inherits the daemon's much higher limit, so the same Dockerfile never fails
      # there. Measured, not guessed:
      #
      #   BUILD-TIME  nofile=1024     (podman build RUN)
      #   RUN-TIME    nofile=20000    (podman run)
      #
      # Raise it to the host's hard limit, capped. Do NOT hardcode 65535: a value
      # above the hard limit fails at container init with "error setting rlimit".
      - name: Compute a safe nofile limit for podman build
        run: |
          LIM=$(ulimit -Hn)
          case "$LIM" in unlimited) LIM=65536 ;; esac
          [ "$LIM" -gt 65536 ] && LIM=65536
          echo "PODMAN_NOFILE=$LIM" >> "$GITHUB_ENV"
          echo "podman build will use nofile=$LIM (podman 4.9.3 defaults RUN steps to 1024)"

      - name: Build the API image with podman
        run: podman build --ulimit nofile=$PODMAN_NOFILE:$PODMAN_NOFILE --platform linux/amd64 --file Dockerfile.api --tag signalgrid-api:ci .

      # The web image — the one that used to fail. It builds under podman once the
      # descriptor limit is raised AND the base images are fully qualified (podman
      # refuses unqualified short names, or resolves them through a host alias file;
      # docker silently implies docker.io). Both engines now build both images.
      #
      # THE ULIMIT IS A 4.9.3 WORKAROUND, NOT A PODMAN ONE — measured, not inferred.
      # The same web image, 2,798 modules, builds on podman 6.0.2 (macOS/applehv,
      # rootless) with NO --ulimit flag at all: buildah 6.x defines the
      # RLimitDefaultValue that 4.9.3's vendored copy lacks, so RUN steps stop
      # inheriting the OCI runtime's 1024. Keep the flag while this runner is on
      # 4.9.3; drop it when the runner image ships podman 5.x or newer. See
      # docs/MAC_LANE.md for the run that established this.
      - name: Build the web image with podman
        run: podman build --ulimit nofile=$PODMAN_NOFILE:$PODMAN_NOFILE --platform linux/amd64 --file Dockerfile.web --tag signalgrid-web:ci .

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The durable lane: postgres + redis under podman, then the three
      # durable-persistence proofs and the enrollment-race proof against them.
      - name: Durable verification lane under podman
        run: node scripts/docker-verify.mjs

  deploy-stack:
    name: Prod stack (Docker compose smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The web image, built for real — the gap that let two broken COPY lines ship.
      #
      # docker-compose.prod.yml declares only `db` and `api`, so the step below has
      # never built Dockerfile.web. #179 added a STATIC gate proving its base image
      # targets a platform triple the workspace ships binaries for, and that gate was
      # green while the image still could not build: `tsconfig.base.json` and
      # `scripts/enforce-pnpm.cjs` were never copied into the context, so the install
      # crashed in its preinstall hook and vite could not resolve the tsconfig
      # `extends`. Found by the owner's Mac lane, which is the only place a real
      # build was happening.
      #
      # A static check cannot see this class at all: the build context is assembled
      # BY the Dockerfile, so a path that is never COPY'd simply does not exist. The
      # only thing that proves an image builds is building it. Kept as its own step
      # rather than folded into compose, so a web-image failure is legible on sight
      # instead of arriving as a compose error.
      - name: Build the web image (a static base check is not a build)
        run: docker build --file Dockerfile.web --tag signalgrid-web:ci .

      # Build the API image and bring up the durable stack (api + Postgres) so
      # the packaged deployment is proven, not just the source. DATABASE_URL in
      # the compose file turns on the gated persistence layer.
      # Phase 1: the EVALUATION profile (review-demo), so the demo-credential
      # end-to-end flow can run — the packaged image must still prove a real
      # decision written through to durable Postgres.
      - name: Build and start the durable stack (review-demo profile)
        env:
          SIGNALGRID_PRODUCT_PROFILE: review-demo
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for the API to be healthy
        # --retry-all-errors (not just --retry-connrefused): Docker's port proxy
        # accepts the connection before Node finishes booting and then resets it,
        # which surfaces as curl error 56 (recv failure), not a refusal — so we
        # must retry on ALL transient errors, or the very first probe fails.
        run: curl -sf --retry 60 --retry-delay 2 --retry-all-errors http://localhost:8080/api/healthz

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Exercises the running container stack end to end: a real decision is
      # evaluated, read back from durable Postgres, its evidence verifies, cross-
      # tenant reads are denied, and /metrics reflects the traffic.
      - name: Smoke-test the running stack
        env:
          BASE_URL: http://localhost:8080
          SMOKE_EXPECT_PROFILE: review-demo
        run: node scripts/smoke-stack.mjs

      # The packaged container must not run as root. (A durableStore-label
      # probe on /readyz was tried here and removed as UNREACHABLE BY DESIGN:
      # the verbose body exists only under review-demo, and this phase runs as
      # the database owner — whose readyz is honestly 503, because the owner
      # holds DELETE on the ledger. The positive durable-store probe is the
      # gateway smoke's readyz-200 requirement in phase 2, which pings all
      # three Postgres stores with both-direction privilege assertions —
      # strictly stronger than reading a JSON label.)
      - name: The api container runs as a non-root user
        run: |
          UID_IN_CONTAINER=$(docker compose -f docker-compose.prod.yml exec -T api id -u)
          echo "container uid: $UID_IN_CONTAINER"
          test "$UID_IN_CONTAINER" != "0"

      # Phase 2: the PRODUCTION default (shared-device-gateway) on the SAME
      # image — and in the PRODUCTION POSTURE, by executing the runbook's
      # migrate-then-boot sequence literally rather than simulating it. The
      # gateway smoke now requires /readyz 200, and readyz asserts the
      # append-only boundary in BOTH directions: an owner credential holds
      # DELETE on the ledger, so a gateway running as the owner is honestly
      # not-ready (a rewritable ledger is not a tamper-evidence component).
      # The only way to a green phase 2 is the documented path: migrate as
      # admin, boot as signalgrid_runtime. The fence assertions ride along:
      # /v1/keys and the simulator unmounted, demo bearers refused — the leak
      # measured on 2026-08-21 (nine demo bearers to an anonymous caller),
      # pinned so it cannot come back.
      - name: Publish the db to the runner loopback (CI-only overlay)
        run: docker compose -f docker-compose.prod.yml -f docker-compose.migrate.yml up -d db

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies (the migration runner)
        run: pnpm install --frozen-lockfile

      - name: "Runbook step 1: migrate with the admin credential"
        run: DATABASE_URL=postgres://sg:sg@127.0.0.1:55432/signalgrid pnpm run db:migrate

      - name: "Runbook step 2: set the runtime password"
        # ci-smoke is a throwaway for this runner's ephemeral Postgres, same
        # standing as the compose file's sg:sg. Real deployments set it out of
        # band via \password (see docs/DEPLOYMENT.md).
        run: docker compose -f docker-compose.prod.yml exec -T db psql -U sg -d signalgrid -c "ALTER ROLE signalgrid_runtime WITH LOGIN PASSWORD 'ci-smoke'"

      - name: "Runbook step 3: recreate the api as the runtime role on the production default profile"
        # The OIDC values are WELL-FORMED PLACEHOLDERS (a .invalid host cannot
        # resolve), because gateway readiness now refuses an instance whose
        # enterprise auth is unconfigured — an IdP-less gateway can
        # authenticate nobody. This proves the configuration path; no token
        # can verify against it, and the smoke's demo-bearer-401 assertion
        # still holds for exactly that reason.
        env:
          DATABASE_URL: postgres://signalgrid_runtime:ci-smoke@db:5432/signalgrid
          OIDC_ISSUER: https://idp.ci-placeholder.invalid
          OIDC_AUDIENCE: signalgrid-ci
          OIDC_JWKS_URI: https://idp.ci-placeholder.invalid/jwks
          OIDC_TENANT_MAP: '{"ci-tenant":"tenant-ci"}'
          OIDC_ROLE_MAP: '{"ci-role":"operator"}'
        run: docker compose -f docker-compose.prod.yml up -d --force-recreate api

      - name: Wait for the gateway-profile API
        run: curl -sf --retry 60 --retry-delay 2 --retry-all-errors http://localhost:8080/api/healthz

      - name: Smoke-test the gateway fence
        env:
          BASE_URL: http://localhost:8080
          SMOKE_EXPECT_PROFILE: shared-device-gateway
        run: node scripts/smoke-stack.mjs

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
