name: SignalGrid CI

on:
  pull_request:
  push:
    branches:
      - dev
      - alpha
      - beta
      - prod
      - SignalGrid_Alpha
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Typecheck, build, and proof scaffold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: PORT=3000 BASE_PATH=/ pnpm run build

      - name: Intune / Entra posture proof
        run: pnpm run proof:intune-entra-posture

      - name: SignalGrid core proof
        run: pnpm run proof:signalgrid-core

      - name: SignalGrid simulator proof
        run: pnpm run proof:signalgrid-simulator

      - name: SignalGrid grid proof
        run: pnpm run proof:signalgrid-grid

      - name: Microsoft Graph sandbox proof
        run: pnpm run proof:microsoft-graph-sandbox

      - name: Connector emulator proof
        run: pnpm run proof:connector-emulator

      - name: OpenAPI contract check
        run: pnpm run proof:api-contract

      - name: API integration test
        run: pnpm run test:api

      - name: WebAuthn signature-verification proof
        run: pnpm run proof:webauthn-verify

      - name: Orchestration (Trust→Action) proof
        run: pnpm run proof:orchestration

      - name: Signal Radar (new-signal detection) proof
        run: pnpm run proof:signal-radar

      - name: Safety gate (guardrails)
        run: pnpm run safety:check

      - name: Postman collection is committed in sync
        run: |
          pnpm run build:postman
          git diff --exit-code docs/postman || (echo "::error::Postman collection out of date — run 'pnpm run build:postman' and commit." && exit 1)

      - name: Decision-latency pilot gate
        run: pnpm run bench:decision-latency

  docs-sanity:
    name: Required docs and unsafe-claim sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required docs exist
        run: |
          set -euo pipefail
          required_docs=(
            README.md
            docs/INDEX.md
            docs/INTEGRATION_CATALOG.md
            docs/PRODUCTION_PATH.md
            docs/INTUNE_ENTRA_POSTURE_PROOF.md
            docs/ECOSYSTEM_POSITIONING.md
            docs/MOBILE_AND_PLATFORM_STRATEGY.md
            docs/DOCKBRIDGE_STRATEGY.md
            docs/SIGNALGRID_REAL_LIFE_SIMULATOR.md
            docs/SIGNALGRID_APP_SUITE_PLAN.md
            docs/SIMULATOR_EVENT_MODEL.md
            docs/SIMULATOR_DECISION_ENGINE.md
            docs/SIMULATOR_VALIDATION_RUNBOOK.md
            docs/CLOUD_CONNECTOR_EMULATOR_HARNESS.md
            docs/CONNECTOR_EMULATOR_SCENARIOS.md
            docs/PRODUCT_CORE_FOUNDATION.md
            docs/PRODUCT_CORE_THREAT_MODEL.md
            docs/SECURITY_CONTROLS_MATRIX.md
            docs/PRODUCT_DATA_MODEL.md
            docs/PRIVATE_CORE_HANDOFF.md
            docs/RUN_AND_GO_LIVE.md
            docs/ECOSYSTEM_FLOW_AND_RESOLUTION.md
            docs/DOCKBRIDGE_PRODUCT_CONNECTOR.md
            docs/SECURITY_BASELINE_ALIGNMENT.md
            docs/APP_SUITE_MATRIX.md
            docs/WHAT_SIGNALGRID_DOES_TODAY.md
            SECURITY.md
          )

          for doc in "${required_docs[@]}"; do
            test -f "$doc" || { echo "Missing required doc: $doc" >&2; exit 1; }
          done

      - name: Check direct unsafe claims
        run: |
          set -euo pipefail
          denylist=(
            "SignalGrid is production-ready"
            "SignalGrid replaces"
            "SignalGrid is an Imprivata partner"
            "SignalGrid is MFi certified"
            "autonomous production remediation"
            "replaces ServiceNow"
            "replaces PagerDuty"
            "replaces CrowdStrike"
            "replaces Defender"
            "replaces ControlUp"
            "Imprivata partner"
            "MFi certified"
            "replaces Jamf"
            "replaces Intune"
            "replaces Apple Configurator"
            "replaces GroundControl"
            "available now"
            "SOC 2 Type II certified"
            "99.99% uptime SLA"
            "FedRAMP-authorized"
            "CMMC-certified"
            "STIG hardened"
            "EAL5+ certified"
            "FIPS 140-2 validated"
          )

          failed=0
          for phrase in "${denylist[@]}"; do
            while IFS= read -r match; do
              # Allow explicit disclaimers, validation-command examples, denylist docs,
              # guardrails, pre-announcement/design-target framing, and other non-claim
              # boundary language without weakening detection of affirmative unsafe
              # claims in product copy.
              if printf '%s\n' "$match" | grep -Eiq 'not |does not|do not|no |avoid|guardrail|disclaimer|should not|must not|without claiming|no claim|doesn.t claim|not claim|git grep|denylist|unsafe-claim scan|validation command|pre-announcement|design target'; then
                continue
              fi

              echo "Unsafe direct claim found for '$phrase': $match" >&2
              failed=1
            done < <(git grep -nF -- "$phrase" -- README.md docs artifacts/signalgrid-review/src artifacts/signalgrid-web/src artifacts/signalgrid-app/src artifacts/signalgrid-desktop/src artifacts/signalgrid-mobile-pwa/src 2>/dev/null || true)
          done

          exit "$failed"
