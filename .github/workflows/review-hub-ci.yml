name: SignalGrid CI

on:
  pull_request:
  push:
    branches:
      - dev
      - alpha
      - beta
      - prod
      - SignalGrid_Alpha
  workflow_dispatch:

# Supersede an in-flight run when a newer commit lands on the same ref, and say so.
#
# Without this, pushing three commits in half an hour left earlier runs to be abandoned
# and reported as `failure` with no logs (404, because they never uploaded). That is
# genuinely hard to tell apart from a real regression, and it cost a careful diagnosis:
# the only thing that distinguished them was noticing the superset commit had passed the
# same job. `cancel-in-progress` makes the outcome `cancelled` — an unambiguous status —
# and stops paying for runs whose result nobody will read.
#
# Scoped per workflow AND per ref, so concurrent PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Typecheck, build, and proof scaffold
    runs-on: ubuntu-latest
    # Bounded so a regression that makes a proof HANG (an unbounded prototype walk
    # against a Proxy returning a fresh prototype each call) fails red instead of
    # silently consuming the default job timeout.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Invariant review (fail-closed / determinism / Assist / truth)
        run: pnpm run review:invariants

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: PORT=3000 BASE_PATH=/ pnpm run build

      - name: Intune / Entra posture proof
        run: pnpm run proof:intune-entra-posture

      - name: SignalGrid core proof
        run: pnpm run proof:signalgrid-core

      - name: SignalGrid simulator proof
        run: pnpm run proof:signalgrid-simulator

      - name: SignalGrid grid proof
        run: pnpm run proof:signalgrid-grid

      - name: Microsoft Graph sandbox proof
        run: pnpm run proof:microsoft-graph-sandbox

      - name: Read-only Microsoft Graph connector proof
        run: pnpm run proof:graph-connector

      - name: Carrier / post-exit reachability proof
        run: pnpm run proof:carrier-reachability

      - name: Canonical event-contract proof (validation + cross-domain detections)
        run: pnpm run proof:event-contract

      - name: Location-services (geofence posture) proof
        run: pnpm run proof:location-services

      - name: Vulnerability-scan (device risk posture) proof
        run: pnpm run proof:vuln-scan

      - name: Network / NAC (access posture) proof
        run: pnpm run proof:network-nac

      - name: EDR / EPP (endpoint threat-state) proof
        run: pnpm run proof:edr-threat

      - name: Identity / SSO (sign-in risk) proof
        run: pnpm run proof:identity-risk

      - name: RTLS / badge-dwell (physical custody) proof
        run: pnpm run proof:rtls-custody

      - name: Removable-media / peripheral-control proof
        run: pnpm run proof:peripheral-control

      - name: Data-protection / DLP posture proof
        run: pnpm run proof:data-protection

      - name: Credential-exposure (endpoint secrets) proof
        run: pnpm run proof:credential-exposure

      - name: macOS endpoint-posture (grid-collected) proof
        run: pnpm run proof:macos-posture
      - name: "Proof: uem (read-only MDM/UEM, gated, no actuators)"
        run: pnpm run proof:uem
      - name: "Proof: nac (read-only endpoint identity, gated, no actuators)"
        run: pnpm run proof:nac

      - name: macOS posture ↔ apple/device-management schema alignment proof
        run: pnpm run proof:macos-apple-schema

      - name: OT / IIoT edge-device posture (grid-collected) proof
        run: pnpm run proof:ot-posture

      - name: IAM / access-governance runtime posture proof
        run: pnpm run proof:access-governance

      - name: Hardware-rooted device-attestation proof
        run: pnpm run proof:device-attestation

      - name: SSO session-binding proof
        run: pnpm run proof:sso-session

      - name: OAuth-consent / workload-identity proof
        run: pnpm run proof:oauth-consent

      - name: Token-binding / proof-of-possession proof
        run: pnpm run proof:token-binding

      - name: Physical access-control (PACS) proof
        run: pnpm run proof:pacs-access

      - name: Agentic / non-human-identity (NHI) proof
        run: pnpm run proof:agent-identity

      # Agent BEHAVIOR — the action-judgment layer. Access brokers (Okta AI Agent
      # Gateway, Entra Agent ID) answer WHO the agent is; this asks whether the ACTION
      # is in-pattern: a prompt that became 40k updates, a never-opened target, no
      # provenance, a broad blast radius, a superhuman cadence. Fail-closed; one combo
      # of 1,944 grants.
      - name: Proof — agent-behavior (action-judgment, one grant of 1,944)
        run: pnpm run proof:agent-behavior

      # Custody BEACON — the offline asset-recovery channel: an independent
      # case-embedded beacon fused with reachability tells "powered off in its bay"
      # (monitor) apart from "removed and dark" (escalate).
      - name: Proof — custody-beacon (asset recovery, offline channel)
        run: pnpm run proof:custody-beacon

      # App-update currency — min_version floors, force_update, install-channel
      # provenance as posture (an iOS app cannot install itself; distribution stays
      # with itms-services / MDM InstallApplication / ABM).
      - name: Proof — app-update (host-app version currency)
        run: pnpm run proof:app-update

      # Platform SSO — the METHOD decides the credential's worth; a login policy
      # claimed on a method that cannot enforce it is config drift.
      - name: Proof — platform-sso (macOS platform credential)
        run: pnpm run proof:platform-sso
      - name: Proof — passkey-assurance (credential worth, not just "passkey")
        run: pnpm run proof:passkey-assurance

      # Policy binding — membership IS the policy: unbound, too-wide (fail-open),
      # too-narrow, or mixed-membership group assignment.
      - name: Proof — policy-binding (group-assignment correctness)
        run: pnpm run proof:policy-binding

      - name: Device-management-health / config-drift proof
        run: pnpm run proof:device-management-health

      - name: Proof — link usability (associated vs usable)
        run: pnpm run proof:link-usability

      # The task plane joins the grid: WMS/task-system exceptions (short pick,
      # wrong-aisle bin, assignment mismatch) as decision signals. The WMS stays
      # system of record; SignalGrid consumes, decides, and routes.
      - name: Proof — task exception (task-plane exceptions as grid signals)
        run: pnpm run proof:task-exception

      # Issue #136's portable work context: the context carries the WORK (tasks,
      # exceptions, restrictions travel with the person); trust is re-earned per
      # device. Three monotone invariants proven over the full matrix.
      - name: Proof — work context (portable, descriptive, never permissive)
        run: pnpm run proof:work-context

      # Issue #136's handoff criterion + the warehouse release loop: exception →
      # hold → the worker keeps working → fix posted → fix INDEPENDENTLY verified
      # → released on a trusted device. A resolution posting is not verification.
      - name: Proof — handoff simulation (exception-release loop)
        run: pnpm run proof:handoff-sim

      # Issue #136 step 6: the grid proposes better flows from observed history,
      # but a proposal can never activate itself — approval is a required human
      # gate, proven exhaustively over the transition table.
      - name: Proof — adaptive proposals (governed lifecycle, no self-activation)
        run: pnpm run proof:adaptive-proposals

      # The self-aware, self-healing checklist over backend/frontend/API contracts:
      # fail-closed status, coverage-gap self-reporting, and a heal that cannot
      # apply itself — the same human-gate invariant as adaptive-proposals.
      - name: Proof — self-audit (fail-closed checklist, governed self-healing)
        run: pnpm run proof:self-audit

      # SLO / error-budget reliability for the decision plane. Latency and
      # availability carry error budgets; fail-closed integrity is zero-tolerance —
      # one fail-open exhausts it, so reliability can never be bought at the cost of
      # the fabric's core promise.
      - name: Proof — reliability (SLO/error-budget, fail-closed has no budget)
        run: pnpm run proof:reliability

      # Trust-gated GitOps: a declared desired-state is diffed (plan), rolled out
      # only through a governed lifecycle whose apply needs BOTH a recorded human
      # approval and an `allow` trust decision, and drift between declared and
      # observed becomes a self-audit signal. A rollout cannot apply itself.
      - name: Proof — iac (trust-gated GitOps, a rollout cannot apply itself)
        run: pnpm run proof:iac

      - name: Proof — verdict attestation (forged verdicts degrade)
        run: pnpm run proof:verdict-attestation

      - name: Guard-registry drift check
        run: node scripts/check-guard-registries.mjs
      - name: "Connector discipline (gated + proven, no device actuators)"
        run: node scripts/check-connector-discipline.mjs

      # The Mac MCP lane and iOS shell build against this repo's contracts from
      # OUTSIDE CI's reach. This gate hard-fails when contracts change without
      # republishing the machine-readable sync manifest, and soft-reports when
      # committed real-hardware evidence has gone stale — only the owner's
      # hardware can refresh that, so staleness never blocks a commit.
      - name: Live-sync manifest drift (Mac MCP + iOS instructions current)
        run: node scripts/check-live-sync.mjs

      - name: Docs↔proof figure guard
        run: node scripts/check-proof-figures.mjs

      - name: PIM activation decision proof
        run: pnpm run proof:pim-activation

      - name: Grant-safety harness self-proof (allow-path brute-force detector)
        run: pnpm run proof:grant-safety

      # Documented proof check-counts are evidence; evidence that silently drifts is
      # worse than none. Fails if any "(N checks)" in docs/ disagrees with the proof.
      - name: Proof-count sync (docs match their proofs)
        run: pnpm run check:proof-counts

      - name: Posture-composition (unified signal fusion) proof
        run: pnpm run proof:posture-composition

      - name: Incident-playbook (decision to prioritized incident) proof
        run: pnpm run proof:incident-playbook

      - name: Fabric decision-evals (golden multi-signal decision quality) proof
        run: pnpm run proof:fabric-evals

      - name: Signal-fabric capstone (end-to-end fusion to incident) proof
        run: pnpm run proof:fabric-scenario

      - name: Connector emulator proof
        run: pnpm run proof:connector-emulator

      - name: OpenAPI contract check
        run: pnpm run proof:api-contract

      - name: API integration test
        run: pnpm run test:api

      - name: Observability (metrics endpoint) proof
        run: pnpm run proof:observability

      - name: Enterprise auth (OIDC/JWT) proof
        run: pnpm run proof:enterprise-auth

      # Real cryptographic material, zero cost: a certified OIDC provider booted
      # in-process mints genuine RS256/DPoP tokens over real HTTP, and every
      # accept/reject decision runs through the production verifier. The fixture
      # proof above shows the logic is right; this shows it is right against
      # bytes SignalGrid did not fabricate.
      - name: Live IdP proof (real OIDC provider, real DPoP, in-process)
        run: pnpm run proof:live-idp

      # The first browser-level gate: what a human actually sees. The suite's
      # maiden run caught a real gap (a decision-evidence row the core carried
      # and no console scenario ever rendered), so this layer has already paid
      # for itself once.
      # The GitHub runner ships no Playwright browser — the preinstalled Chromium
      # this suite uses locally is a property of the dev sandbox, not of CI. The
      # maiden CI run proved it: all 15 tests failed browser LAUNCH in <11ms
      # while the same suite passed 15/15 locally. Install before running.
      - name: Install Playwright Chromium for the E2E suite
        run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium

      - name: Browser E2E (review console, website, admin console)
        run: pnpm run test:e2e

      - name: WebAuthn signature-verification proof
        run: pnpm run proof:webauthn-verify

      - name: Audit-ledger (redaction + tamper-evident chain) proof
        run: pnpm run proof:audit-ledger

      - name: Orchestration (Trust→Action) proof
        run: pnpm run proof:orchestration

      - name: Room-sim (Trusted-Entry, multi-vertical) proof
        run: pnpm run proof:room-sim

      - name: App-workflows (application gating) proof
        run: pnpm run proof:app-workflows

      - name: App-workflow templates + validation lint proof
        run: pnpm run proof:app-workflow-templates

      - name: Flows (admin flow config + health) proof
        run: pnpm run proof:flows

      - name: Grid-coverage (build the grid — situations handled) proof
        run: pnpm run proof:grid-coverage

      - name: Grid-config (workflows as code — CI validation) proof
        run: pnpm run proof:grid-config

      - name: App-resilience (cloud-app downtime, PHI-safe fallback) proof
        run: pnpm run proof:app-resilience

      - name: Provisioning (zero-touch setup — record/validate/apply) proof
        run: pnpm run proof:provisioning

      - name: Provisioning teardown-proof (prove the retreat before deploy)
        run: pnpm run proof:provisioning-teardown

      - name: Factory-floor workflows (manufacturing/OT) proof
        run: pnpm run proof:factory-flows

      - name: Grid-lifecycle (capstone — 6 models, provision→decommission) proof
        run: pnpm run proof:grid-lifecycle

      - name: Recommendations (learned-habit proposals) proof
        run: pnpm run proof:recommendations

      - name: Signal-discovery (auto-onboarding) proof
        run: pnpm run proof:signal-discovery

      - name: DDM / device-health connector proof
        run: pnpm run proof:ddm-connector

      - name: Fleet (osquery MDM) connector proof
        run: pnpm run proof:fleet-connector

      - name: Signal Radar (new-signal detection) proof
        run: pnpm run proof:signal-radar

      - name: Control-plane (cloud↔edge contract) proof
        run: pnpm run proof:control-plane

      - name: Edge-sync (config-down integrity) proof
        run: pnpm run proof:edge-sync

      - name: Telemetry-up (decision plane → control plane) proof
        run: pnpm run proof:telemetry-up

      - name: Safety gate (guardrails)
        run: pnpm run safety:check

      - name: Postman collection is committed in sync
        run: |
          pnpm run build:postman
          git diff --exit-code docs/postman || (echo "::error::Postman collection out of date — run 'pnpm run build:postman' and commit." && exit 1)

      - name: Decision-latency pilot gate
        run: pnpm run bench:decision-latency

  docs-sanity:
    name: Required docs and unsafe-claim sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Required docs exist + affirmative-unsafe-claim scan. Shared with
      # `pnpm run preflight` via scripts/docs-sanity.mjs so the check is the same
      # locally and in CI.
      - name: Docs sanity (required docs + unsafe-claim scan)
        run: node scripts/docs-sanity.mjs

  durable-persistence:
    name: Durable persistence (Postgres audit ledger)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sg
          POSTGRES_PASSWORD: sg
          POSTGRES_DB: signalgrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exercises the REAL durable path: writes/reads the tamper-evident audit
      # ledger against a live Postgres, proving durability, redaction, tamper
      # detection, and fork-free concurrency. The default (DATABASE_URL unset)
      # in-memory path is covered separately by proof:audit-ledger.
      - name: Durable audit-ledger proof on Postgres
        env:
          DATABASE_URL: postgres://sg:sg@localhost:5432/signalgrid
        run: pnpm run proof:audit-ledger-pg

      # Durable decision + evidence store: save/get/list, tenant isolation,
      # tamper-evident snapshots, durability across instances, and concurrency.
      - name: Durable decision-store proof on Postgres
        env:
          DATABASE_URL: postgres://sg:sg@localhost:5432/signalgrid
        run: pnpm run proof:decision-store-pg

      # Durable session lifecycle: start/refresh/expire/end, isolation, durability.
      - name: Durable session-store proof on Postgres
        env:
          DATABASE_URL: postgres://sg:sg@localhost:5432/signalgrid
        run: pnpm run proof:session-store-pg

  deploy-stack:
    name: Prod stack (Docker compose smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Build the API image and bring up the durable stack (api + Postgres) so
      # the packaged deployment is proven, not just the source. DATABASE_URL in
      # the compose file turns on the gated persistence layer.
      - name: Build and start the durable stack
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for the API to be healthy
        # --retry-all-errors (not just --retry-connrefused): Docker's port proxy
        # accepts the connection before Node finishes booting and then resets it,
        # which surfaces as curl error 56 (recv failure), not a refusal — so we
        # must retry on ALL transient errors, or the very first probe fails.
        run: curl -sf --retry 60 --retry-delay 2 --retry-all-errors http://localhost:8080/api/healthz

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Exercises the running container stack end to end: a real decision is
      # evaluated, read back from durable Postgres, its evidence verifies, cross-
      # tenant reads are denied, and /metrics reflects the traffic.
      - name: Smoke-test the running stack
        env:
          BASE_URL: http://localhost:8080
        run: node scripts/smoke-stack.mjs

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
