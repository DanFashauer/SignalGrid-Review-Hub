name: Scheduled Verification

# Report-only "continuous verification" bot. Runs the full deterministic gate
# suite on a schedule (and on demand) and, if anything regresses, opens or
# updates a single tracking issue. It NEVER pushes code or changes the repo —
# it only reports, so a green main stays trustworthy between PRs.
#
# Note: GitHub runs `schedule` triggers only on the repository's default branch,
# so this fires once merged to the default branch. Use "Run workflow"
# (workflow_dispatch) to run it on demand from any branch in the meantime.

on:
  schedule:
    - cron: "17 7 * * *" # daily at 07:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduled-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Full gate suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all projects)
        run: pnpm run typecheck

      - name: Build (all projects)
        run: pnpm run build

      - name: Core proof (deterministic invariants)
        run: pnpm run proof:signalgrid-core

      - name: API integration test
        run: pnpm run test:api

      - name: OpenAPI contract check
        run: pnpm run proof:api-contract

      - name: Decision-latency pilot gate
        run: pnpm run bench:decision-latency

      - name: Grid / simulator / emulator / posture proofs
        run: |
          pnpm run proof:signalgrid-grid
          pnpm run proof:signalgrid-simulator
          pnpm run proof:connector-emulator
          pnpm run proof:microsoft-graph-sandbox
          pnpm run proof:intune-entra-posture

      - name: Open or refresh the regression tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Scheduled verification failing";
            const label = "scheduled-verification";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled verification gate suite failed on \`${context.sha.slice(0, 7)}\`.`,
              ``,
              `- Run: ${runUrl}`,
              `- Triggered by: \`${context.eventName}\``,
              ``,
              `This bot is report-only — no code was changed. Investigate the failing step in the run above.`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 10,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
