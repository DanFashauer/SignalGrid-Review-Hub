name: Scheduled Verification

# Report-only "continuous verification" bot. Runs the WHOLE preflight gate suite
# (`node scripts/preflight.mjs`, full mode, heavy builds included) plus the breadth
# lane on a schedule (and on demand) and, if anything regresses, opens or updates a
# single tracking issue. It NEVER pushes code or changes the repo — it only
# reports, so a green main stays trustworthy between PRs.
#
# WHY PREFLIGHT ITSELF, NOT A LIST (plan row 171). This job used to run about ten
# hand-picked proofs — a tenth of the gate suite — while its header called that the
# full suite, then (once corrected) admitted the selection was hand-picked. A
# hand-picked list is the fossil shape this repo derives scope to avoid: every gate
# added to preflight since was invisible to the only thing watching the default
# branch between pull requests, including the time- and externally-dependent gates
# that are the ones able to go red WITHOUT a commit. Running preflight makes the
# selection preflight's STEPS, so a new gate joins the nightly run the day it is
# registered. `scripts/check-scheduled-verification-scope.mjs` (preflight + CI)
# fails if the verify job grows a hand-picked gate step again, stops running full
# preflight, or loses the token the liveness gate needs.
#
# WHAT THAT TAKES, and why it was not a one-line change: `check-ci-liveness.mjs` is
# FATAL in CI when it cannot reach the Actions API, so the workflow grants
# `actions: read` and the preflight step hands GITHUB_TOKEN over (Actions never
# exports it on its own). Preflight also needs shellcheck and a Playwright
# Chromium, installed below the same bounded way review-hub-ci.yml does.
# What preflight does NOT cover it prints itself (derived from .github/workflows/
# on every run); the mutation sweep, image vulnerability gate and hands watch
# below are this workflow's own additions to it.
#
# Note: GitHub runs `schedule` triggers only on the repository's default branch,
# so this fires once merged to the default branch. Use "Run workflow"
# (workflow_dispatch) to run it on demand from any branch in the meantime.

on:
  schedule:
    - cron: "17 7 * * *" # daily at 07:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # check-ci-liveness.mjs (inside preflight) reads workflow runs; FATAL in CI without it.
  actions: read

concurrency:
  group: scheduled-verification
  cancel-in-progress: false

jobs:
  verify:
    # KEPT deliberately (plan §11.4 step 5, decided 2026-08-11): report-only rot
    # detection on the default branch between PRs is exactly the failure mode the
    # breadth lane's daily cadence should cover, so the lane runs here too. The
    # job was once named "Full gate suite" while running ~10 launch gates; it now
    # runs preflight whole (plan row 171), and the name says so.
    name: Daily verification (full preflight + breadth lane)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install shellcheck (preflight's shell-lint gate needs it)
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Bounded and retried per attempt — the reasoning is review-hub-ci.yml's step of
      # the same name (an unbounded apt/CDN stall once ate a whole job).
      - name: Install Playwright Chromium for preflight's E2E gate
        timeout-minutes: 10
        run: |
          ok=
          for attempt in 1 2 3; do
            if timeout 180 pnpm --filter @workspace/scripts exec playwright install chromium; then
              ok=1; break
            fi
            echo "::warning::Chromium download failed (attempt ${attempt}/3) — retrying"
            sleep $((attempt * 10))
          done
          if [ -z "$ok" ]; then
            echo "::error::Playwright Chromium download failed three times; preflight's E2E gate cannot run."
            exit 1
          fi
          timeout 240 pnpm --filter @workspace/scripts exec playwright install-deps chromium \
            || echo "::warning::playwright install-deps did not complete (distro mirror?); relying on the runner's preinstalled libraries."

      - name: Preflight — the whole gate suite (daily rot check)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preflight.mjs

      # Runs even when preflight went red: the first failing preflight gate must not
      # hide the whole breadth lane from the same night's report.
      - name: Breadth lane (deferred families + doctrine docs — daily rot check)
        if: success() || failure()
        run: pnpm run verify:breadth

      - name: Open or refresh the regression tracking issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Scheduled verification failing";
            const label = "scheduled-verification";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled verification gate suite failed on \`${context.sha.slice(0, 7)}\`.`,
              ``,
              `- Run: ${runUrl}`,
              `- Triggered by: \`${context.eventName}\``,
              ``,
              `This bot is report-only — no code was changed. Investigate the failing step in the run above.`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 10,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

  mutation-sweep:
    # The full mutation sweep — one proof run per mutation, per registered
    # file. Measured 2026-08-21: 1,160 mutations in 40m29s on one runner
    # (1,083 killed, 77 documented-inert, 0 survivors, 0 hung), which is why
    # this is a DAILY lane and not a per-push gate: the cadence follows the
    # measurement. Preflight deliberately does not run it and says so.
    #
    # SHARDED 2026-08-25, when registering the connector files the guard had
    # never mutated took the registry from 1,160 mutations to 1,367 (+18%),
    # projecting ~48 min on one runner. That still fit inside 75, so the lane
    # was not broken — it was on a trajectory, and the fix for a trajectory is
    # not a bigger number that needs raising again the next time someone
    # registers a file. `--shard=i/N` splits TARGETS balanced by MUTATION COUNT,
    # not by target count: one family can outweigh ten others, and the slowest
    # shard sets the wall clock. `check-mutation-sharding.mjs` (per-push) proves
    # the split is a PARTITION — a sharder that dropped a target would report
    # success over work it never did, which is the failure this whole lane
    # exists to catch, reintroduced at the scheduling layer.
    name: Daily mutation sweep (every guard must be falsifiable)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mutation sweep (shard ${{ matrix.shard }} of 4)
        run: node scripts/mutation-guard.mjs --shard=${{ matrix.shard }}/4

      - name: Open or refresh the regression tracking issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Scheduled verification failing";
            const label = "scheduled-verification";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The DAILY MUTATION SWEEP failed on \`${context.sha.slice(0, 7)}\` — a mutation survived, hung, or the sweep broke.`,
              `Shard **${{ matrix.shard }} of 4**. Shards run independently (\`fail-fast: false\`), so check the run before concluding the whole sweep is red — and check it before concluding the rest is GREEN, which is the more dangerous half.`,
              ``,
              `- Run: ${runUrl}`,
              ``,
              `A surviving mutation means a guard stopped being falsifiable — the repo's worst defect class. Investigate before anything else ships.`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: label, per_page: 10,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [label] });
            }

  vuln-gate:
    # The daily half of the image-evidence lane (supply-chain.yml holds the
    # per-PR report-only half, and the split is deliberate): a new critical
    # CVE published overnight SHOULD go red here — that is signal, not flake —
    # but it must never block an unrelated pull request, which is why the
    # per-PR job only reports. Fails on Critical severity with a fix
    # available; everything else is reported in the run log.
    name: Daily image vulnerability gate (critical, fix available)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned syft + grype (sha256-verified)
        run: |
          set -euo pipefail
          curl -sSL -o syft.tgz https://github.com/anchore/syft/releases/download/v1.44.0/syft_1.44.0_linux_amd64.tar.gz
          echo "0e91737aee2b5baf1d255b959630194a302335d848ff97bb07921eb6205b5f5a  syft.tgz" | sha256sum -c -
          curl -sSL -o grype.tgz https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz
          echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  grype.tgz" | sha256sum -c -
          mkdir -p "$HOME/bin"
          tar -xzf syft.tgz -C "$HOME/bin" syft
          tar -xzf grype.tgz -C "$HOME/bin" grype
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build the api image
        run: docker build -f Dockerfile.api -t signalgrid-api:evidence .
      - name: Gate on critical vulnerabilities with a fix available
        run: |
          syft signalgrid-api:evidence -o cyclonedx-json=image-sbom.cyclonedx.json
          grype db update
          # --only-fixed: an unfixable critical is REPORTED (the log carries it)
          # but cannot be acted on by bumping anything, so it opens the tracking
          # issue conversation rather than sitting permanently red.
          grype sbom:image-sbom.cyclonedx.json --fail-on critical --only-fixed
      - name: Open or refresh the regression tracking issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Scheduled verification failing";
            const label = "scheduled-verification";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The DAILY IMAGE VULNERABILITY GATE failed on \`${context.sha.slice(0, 7)}\` — a CRITICAL vulnerability with a fix available is in the api image.`,
              ``,
              `- Run: ${runUrl}`,
              ``,
              `Bump the affected base layer or dependency. The per-PR image-evidence job carries the full severity report as an artifact.`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: label, per_page: 10,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [label] });
            }

  # WATCHING THE WATCHER (owner, 2026-09-23: "build something that monitors the raise
  # your hand function"). raised-hands.yml rewrites the owner's stuck-list issue every
  # hour. If that job stops — a disabled schedule (GitHub disables them after 60 days
  # without repository activity), a broken token, a deleted label — the issue keeps
  # showing the last list and looks current. This job needs no session to be awake.
  hands-watch:
    name: Raised-hands issue is fresh (the stuck list itself has not stalled)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const label = "raised-hands";
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: label, per_page: 5 });
            const ageH = open.length === 0 ? Infinity : (Date.now() - Date.parse(open[0].updated_at)) / 3_600_000;
            if (ageH <= 3) { core.info(`raised-hands issue #${open[0].number} updated ${ageH.toFixed(1)}h ago — fresh`); return; }
            const why = open.length === 0 ? "there is NO open issue labelled raised-hands" : `issue #${open[0].number} was last updated ${ageH.toFixed(1)}h ago (bound 3h)`;
            const body = `The hourly raised-hands job has stalled: ${why}. The owner's stuck list is not current. Check .github/workflows/raised-hands.yml runs (a disabled schedule is re-enabled from the Actions tab).`;
            const { data: sv } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "scheduled-verification", per_page: 5 });
            if (sv.length > 0) await github.rest.issues.createComment({ ...context.repo, issue_number: sv[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title: "Scheduled verification failing", body, labels: ["scheduled-verification"] });
            core.setFailed(body);
