name: SignalGrid Autopilot Evidence Bot

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - SignalGrid_Alpha

permissions:
  contents: read
  pull-requests: write

jobs:
  evidence:
    name: Full deterministic evidence suite
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      BASE_PATH: /
      AUTOPILOT_EVIDENCE_ARTIFACT_NAME: signalgrid-autopilot-evidence
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Autopilot Evidence Bot
        id: evidence
        run: pnpm run autopilot:evidence

      - name: Upload sanitized Autopilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signalgrid-autopilot-evidence
          path: artifacts/signalgrid-autopilot-evidence/

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_NAME: signalgrid-autopilot-evidence
        run: |
          set +e
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const marker = '<!-- signalgrid-autopilot-evidence-bot -->';
          let summary = { status: 'unknown', validationCommands: [], riskLane: 'YELLOW', publicSafetyStatus: 'unknown', nextRecommendedPr: 'Add production-shaped tenant/auth scaffold', ownerActionRequired: 'Review the YELLOW-lane automation result.' };
          try {
            summary = JSON.parse(readFileSync('artifacts/signalgrid-autopilot-evidence/summary.json', 'utf8'));
          } catch (error) {
            summary.commentWarning = `Evidence summary unavailable: ${error.message}`;
          }
          const passed = summary.validationCommands.filter((item) => item.status === 'passed').length;
          const failed = summary.validationCommands.filter((item) => item.status === 'failed').length;
          const body = `${marker}\n### SignalGrid Autopilot Evidence Bot: ${summary.status}\n\n- Validation summary: ${passed} passed, ${failed} failed\n- Risk lane: ${summary.riskLane}\n- Public-safety: ${summary.publicSafetyStatus}\n- Artifact: ${process.env.ARTIFACT_NAME}\n- Next recommended phase: ${summary.nextRecommendedPr}\n- Owner action required: ${summary.ownerActionRequired}\n\nPublic-safety note: deterministic, sanitized evidence only; no live vendor calls, secrets, customer data, PHI/PII, production device actions, autonomous remediation, production-ready claim, compliance/certification claim, partnership/endorsement claim, acquisition/valuation/legal claim, or blind auto-merge.${summary.commentWarning ? `\n\nWarning: ${summary.commentWarning}` : ''}\n`;
          writeFileSync('/tmp/signalgrid-autopilot-evidence-comment.md', body);
          let existing = '';
          try {
            existing = execFileSync('gh', ['pr', 'view', process.env.PR_NUMBER, '--json', 'comments', '--jq', `.comments[] | select(.body | contains("${marker}")) | .id`], { encoding: 'utf8' }).trim().split('\n').filter(Boolean).pop() || '';
          } catch (_) {}
          if (existing) {
            execFileSync('gh', ['api', 'graphql', '-f', `query=mutation($id:ID!,$body:String!){updateIssueComment(input:{id:$id,body:$body}){issueComment{id}}}`, '-f', `id=${existing}`, '-f', `body=${body}`], { stdio: 'inherit' });
          } else {
            execFileSync('gh', ['pr', 'comment', process.env.PR_NUMBER, '--body-file', '/tmp/signalgrid-autopilot-evidence-comment.md'], { stdio: 'inherit' });
          }
          NODE
          exit 0
