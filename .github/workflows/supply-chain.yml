name: Supply Chain

# Secret scanning + a generated CycloneDX SBOM for the workspace.
on:
  push:
    branches:
      - SignalGrid_Alpha
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # READ-ONLY, deliberately. This job runs `pnpm install`, which executes the
    # lifecycle scripts of every third-party package in the tree. Those scripts
    # must never see a token that can push. Before this split, ONE job both
    # installed dependencies AND held `contents: write` for the dependabot SBOM
    # refresh below — so a malicious postinstall in any transitive dependency had
    # a push-capable GITHUB_TOKEN in its environment on every PR and push. The
    # write scope now lives in `sbom-sync`, which installs nothing.
    permissions:
      contents: read
    outputs:
      drifted: ${{ steps.verify.outputs.drifted }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a pull_request event, checkout defaults to a MERGE commit in detached
          # HEAD. Check out the PR's actual head branch so the SBOM is generated from
          # what the branch really contains — and so `sbom-sync` commits that same file.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.1
          run_install: false
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SBOM
        run: pnpm run sbom
      - name: Licence policy self-test (the gate must be able to fail)
        run: node scripts/check-licence-policy.mjs --self-test
      - name: Licence policy (every component's licence resolves to a declared class)
        run: node scripts/check-licence-policy.mjs

      # Uploaded BEFORE verification so the artifact exists even when the SBOM has
      # drifted: `sbom-sync` consumes exactly this file rather than regenerating it,
      # which is what keeps dependency installation out of the write-scoped job.
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: artifacts/sbom/cyclonedx.json
          if-no-files-found: error

      # The committed SBOM must match the lockfile — that is the invariant.
      #
      # But it made EVERY dependency update red by construction. Dependabot changes
      # the lockfile and cannot regenerate the SBOM, so the verify step failed on all
      # eight of its pull requests — including four whose only failure was this one.
      # A guard that no automated update can ever satisfy does not enforce the
      # invariant, it just guarantees a permanently red bot and trains reviewers to
      # merge past it. So on dependabot's own branches the drift is REPORTED and
      # handed to `sbom-sync`; everywhere else it still fails the build.
      - name: Verify SBOM is committed and up to date
        id: verify
        env:
          # Computed in the workflow context and read as an ENV VAR — never
          # interpolated into the script body. A login is attacker-influenced text,
          # and `${{ }}` inside `run:` is exactly how that becomes shell injection.
          IS_DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if git diff --quiet -- artifacts/sbom/cyclonedx.json; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "SBOM is in sync with the lockfile."
            exit 0
          fi
          echo "drifted=true" >> "$GITHUB_OUTPUT"
          if [ "$IS_DEPENDABOT_PR" = "true" ]; then
            echo "::notice::SBOM drift on a Dependabot branch - the sbom-sync job commits the refreshed file."
            exit 0
          fi
          echo "::error::artifacts/sbom/cyclonedx.json is out of date. Run 'pnpm run sbom' and commit the result."
          git --no-pager diff --stat -- artifacts/sbom/cyclonedx.json
          exit 1

  # Container-image evidence: the report's release-assurance chain, first half.
  # The committed source-scope SBOM above answers "what code is in the tree";
  # this job answers "what is in the IMAGE a deployment actually runs" — base
  # layers and OS packages included, which the source SBOM's own docs state it
  # does not cover. Syft and Grype are version-pinned release binaries with
  # sha256 verification (recorded 2026-08-21 from the published release
  # artifacts) — not install-latest scripts, so a hijacked release cannot ride
  # in silently. Per-PR this job REPORTS: it fails on tool failure, never on
  # vulnerability count, because scanner databases move daily and a gate that
  # goes red without a code change is a flaky gate (the repo switches those
  # off). The daily fail-on-critical gate lives in scheduled-verification.yml.
  image-evidence:
    name: Image SBOM + vulnerability evidence (report-only per PR)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # For the keyless signing step below (DR-009) — the OIDC token that IS
      # the signing identity. Present on every run; the signing step itself
      # only executes on push events.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned syft + grype (sha256-verified)
        run: |
          set -euo pipefail
          curl -sSL -o syft.tgz https://github.com/anchore/syft/releases/download/v1.44.0/syft_1.44.0_linux_amd64.tar.gz
          echo "0e91737aee2b5baf1d255b959630194a302335d848ff97bb07921eb6205b5f5a  syft.tgz" | sha256sum -c -
          curl -sSL -o grype.tgz https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz
          echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  grype.tgz" | sha256sum -c -
          mkdir -p "$HOME/bin"
          tar -xzf syft.tgz -C "$HOME/bin" syft
          tar -xzf grype.tgz -C "$HOME/bin" grype
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build the api image
        run: docker build -f Dockerfile.api -t signalgrid-api:evidence .
      - name: Image SBOM (CycloneDX, from the built image)
        run: |
          syft signalgrid-api:evidence -o cyclonedx-json=image-sbom.cyclonedx.json -o spdx-json=image-sbom.spdx.json
          echo "Image SBOM components: $(python3 -c "import json;print(len(json.load(open('image-sbom.cyclonedx.json')).get('components',[])))")"
      - name: Vulnerability scan (REPORTED — database version recorded as evidence)
        run: |
          # Evidence, not a frozen claim: the same image scans differently as
          # the database moves, so the db build date rides with the result.
          grype db update
          grype sbom:image-sbom.cyclonedx.json -o json --file grype-report.json || true
          python3 - <<'PY'
          import json
          r = json.load(open("grype-report.json"))
          desc = r.get("descriptor", {}).get("db", {}) or {}
          sev = {}
          for m in r.get("matches", []):
              s = m.get("vulnerability", {}).get("severity", "Unknown")
              sev[s] = sev.get(s, 0) + 1
          print("grype db:", desc.get("built", "unknown build date"))
          print("matches by severity:", dict(sorted(sev.items())))
          PY
      # DR-009: keyless signatures over the evidence blobs, push events only —
      # a pull request (fork context included) must never mint signatures under
      # the repository's identity. Sigstore's public Rekor log records every
      # one; the .sigstore.json bundles travel with the artifacts so a verifier
      # needs nothing but cosign and the expected identity.
      - name: Install pinned cosign (sha256-verified)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          curl -sSL -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  cosign" | sha256sum -c -
          chmod +x cosign && mv cosign "$HOME/bin/cosign"
      - name: Sign the evidence blobs (keyless, DR-009)
        if: github.event_name == 'push'
        run: |
          cosign sign-blob --yes image-sbom.cyclonedx.json --bundle image-sbom.cyclonedx.json.sigstore.json
          cosign sign-blob --yes grype-report.json --bundle grype-report.json.sigstore.json
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: image-evidence
          path: |
            image-sbom.cyclonedx.json
            image-sbom.spdx.json
            grype-report.json
            *.sigstore.json
          if-no-files-found: error

  # The ONLY job here with write scope - and deliberately the one that installs
  # NOTHING and runs no third-party code. It downloads the SBOM the read-only job
  # produced and commits it. Tightly gated: dependabot-authored PRs only, same-repo
  # branches only (never a fork), and only when the SBOM actually drifted. A
  # GITHUB_TOKEN push does not retrigger workflows, so this cannot loop.
  sbom-sync:
    name: CycloneDX SBOM sync (dependabot)
    needs: sbom
    # Gate on the PR's AUTHOR, not `github.actor`. `actor` is whoever triggered the
    # run, so the moment a human clicks "re-run jobs" it becomes that human and this
    # silently skips - precisely the case most likely to be used to test whether it
    # works. The PR author does not change on a re-run.
    if: >-
      needs.sbom.outputs.drifted == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download the SBOM the read-only job generated
        uses: actions/download-artifact@v8
        with:
          name: cyclonedx-sbom
          path: artifacts/sbom
      - name: Commit the refreshed SBOM
        run: |
          if git diff --quiet -- artifacts/sbom/cyclonedx.json; then
            echo "SBOM already in sync - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/sbom/cyclonedx.json
          git commit -m "deps: regenerate CycloneDX SBOM for the updated lockfile"
          # A Dependabot-triggered run gets a READ-ONLY GITHUB_TOKEN by default; the
          # job-scoped `contents: write` above is what elevates it. A repository
          # RULESET protecting dependabot/* refs also blocks this push (GH013)
          # regardless of token scope - see docs/OWNER_ACTIONS.md item 2.
          if ! git push origin "HEAD:${GITHUB_HEAD_REF}"; then
            echo "::error::Could not push the refreshed SBOM to ${GITHUB_HEAD_REF}."
            echo "::error::Either the token is read-only for this run (Settings ->"
            echo "::error::Actions -> Workflow permissions), or a ruleset protects"
            echo "::error::dependabot/** refs from the github-actions app."
            exit 1
          fi
          echo "Committed a refreshed SBOM to ${GITHUB_HEAD_REF}."
