name: Supply Chain

# Secret scanning + a generated CycloneDX SBOM for the workspace.
on:
  push:
    branches:
      - dev
      - alpha
      - beta
      - prod
      - SignalGrid_Alpha
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    # Write scope is needed ONLY to push a regenerated SBOM back to a dependabot
    # branch (see the step below). The workflow default stays read-only, so this is
    # the single job that can write, and it can only write to dependabot PRs.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a pull_request event, checkout defaults to a MERGE commit in detached
          # HEAD — pushing that back would send the merge, not the branch. Check out
          # the PR's actual head branch so the SBOM commit below lands on it, and so
          # the SBOM is generated from what the branch really contains.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
          run_install: false
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SBOM
        run: pnpm run sbom

      # The committed SBOM must match the lockfile — that is the whole point of the
      # verify step below, and it is a good invariant.
      #
      # But it made EVERY dependency update red by construction. Dependabot changes
      # the lockfile and cannot regenerate the SBOM, so the verify step failed on all
      # eight of its pull requests — including four whose only failure was this one.
      # A guard that no automated update can ever satisfy does not enforce the
      # invariant, it just guarantees a permanently red bot and trains reviewers to
      # merge past it.
      #
      # So for dependabot's own branches, regenerate and commit rather than fail. The
      # invariant is kept true instead of merely asserted, and the human review is
      # about the dependency change rather than about a mechanical file.
      #
      # Tightly gated: dependabot only, same-repo branches only (never a fork), and
      # only when the SBOM actually changed. A GITHUB_TOKEN push does not retrigger
      # workflows, so this cannot loop.
      - name: Commit refreshed SBOM (dependabot only)
        # Gate on the PR's AUTHOR, not `github.actor`. `actor` is whoever triggered
        # the run, so the moment a human clicks "re-run jobs" it becomes that human
        # and this step silently skips — which is precisely the case most likely to
        # be used to test whether this works. The PR author does not change on a
        # re-run, so it is the property actually being asked about.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- artifacts/sbom/cyclonedx.json; then
            echo "SBOM already in sync — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/sbom/cyclonedx.json
          git commit -m "deps: regenerate CycloneDX SBOM for the updated lockfile"
          # A Dependabot-triggered run gets a READ-ONLY GITHUB_TOKEN by default; the
          # job-scoped `permissions: contents: write` above is what elevates it. If
          # that is ever not in effect, the push fails with a bare git error that
          # looks like this whole approach is broken. Say what it actually means.
          if ! git push origin "HEAD:${GITHUB_HEAD_REF}"; then
            echo "::error::Could not push the refreshed SBOM to ${GITHUB_HEAD_REF}."
            echo "::error::Most likely the token is read-only for this run. Check that"
            echo "::error::Settings → Actions → Workflow permissions allows write, and"
            echo "::error::that this job's contents:write permission is in effect."
            exit 1
          fi
          echo "Committed a refreshed SBOM to ${GITHUB_HEAD_REF}."

      - name: Verify SBOM is committed and up to date
        run: git diff --exit-code -- artifacts/sbom/cyclonedx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: artifacts/sbom/cyclonedx.json
          if-no-files-found: error
