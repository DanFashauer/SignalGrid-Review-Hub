# gitleaks configuration for SignalGrid Review Hub.
#
# This repository is public-safe by design. The only "credential-shaped" strings
# it contains are the deterministic demo API tokens `sgk_demo_*`, which are
# intentional public fixtures used in docs, examples, and the in-memory core —
# they are NOT real secrets. This config keeps the full default gitleaks rule
# set and allowlists only those demo tokens so real leaks are still caught.

title = "SignalGrid gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public-safe demo fixtures — sgk_demo_* tokens are intentional and are not real credentials"
# Match against the whole line so example curl `Authorization: Bearer sgk_demo_*`
# lines are allowlisted, while genuine high-entropy secrets are not.
regexTarget = "line"
regexes = [
  '''sgk_demo_[a-z_]+''',
  # Deliberately-fake fixture literals used ONLY to PROVE secret redaction in the
  # audit-ledger proofs (scripts/src/audit-ledger*-proof.ts). They are not real
  # credentials; allowlisted by exact value so genuine high-entropy secrets in
  # those same files are still caught. gitleaks scans each commit's diff in the PR
  # range, so an inline `gitleaks:allow` added in a later commit can't cover the
  # commit that first introduced the literal — a config allowlist can.
  '''pg-s3cr3t-never-persisted''',
  '''s3cr3t-should-never-appear''',
  # The fake vendor key in the work-context proof's NEGATIVE CONTROL. It exists to
  # prove the credential-refusal guard fires on `sk_live…` shapes, so the scanner
  # flagging it is the guard's own test material being read as the thing it guards
  # against. Allowlisted by exact value — a real `sk_live_` key is still caught.
  '''sk_live_51H8xample''',
  # The planted FAKE JWT in the mobile-app-catalog scanner fixtures
  # (scripts/mobile-app-catalog/fixtures + golden + scan.py selftest +
  # scripts/src/mobile-app-catalog-proof.ts). It exists to PROVE the hardened
  # scanner refuses to emit credential-shaped identifiers — alg is "none", the
  # payload says "never-real", and the signature is the words
  # "fixture-signature-not-real" in base64. Allowlisted by its exact header
  # segment so a genuine JWT anywhere (including in those same files) is still
  # caught.
  '''eyJhbGciOiJub25lIiwidHlwIjoiSldUIiwia2lkIjoiZml4dHVyZSJ9''',
  # Placeholder credentials in the review console's INTEGRATION DOCUMENTATION
  # samples (artifacts/signalgrid-review/src/data/integrationData.ts). They are the
  # literal words a reader replaces, not secrets. Anchored to the auth-header shape
  # rather than allowlisting the file, so a genuine token pasted into that same file
  # is still caught.
  '''Authorization: (?:Bearer )?YOUR_(?:TOKEN|API_KEY)''',
  '''-u "api_user:api_password"''',
  # ── line-scoped .md allowances (backlog row 16) ──────────────────────────────
  # These five REPLACE what used to be a blanket `paths = ['.*\.md$']` exemption.
  # That exemption meant a real DATABASE_URL password or API key pasted into any
  # doc passed this scanner green — in exactly the file class operators paste
  # command lines into. Removing it was tested empirically (gitleaks 8.30.0 over
  # the full tree): five findings, every one illustrative, each allowlisted by
  # its own shape below. Docs are now scanned like everything else.
  #
  # The RFC 7638 thumbprint exhibit in docs/KEYCLOAK_LIVE_INTEGRATION.md — two
  # PUBLIC key thumbprints (hashes, not secrets) shown to prove member-ordering
  # changes the digest. Anchored to the exhibit's own `name = value` layout.
  '''(?:keycloak|ours)\s+= [A-Za-z0-9_-]{43}''',
  # Any YOUR_*-style placeholder in a curl/example line — the literal words a
  # reader replaces (native/ios/README.md and friends). A real key contains no
  # such marker.
  '''YOUR_[A-Z_]{4,}''',
]
# Prose fragments shaped like `word/word` ("compliant/hybrid", "OPC/industrial")
# that the generic-api-key rule misreads as key material. Targeted at the
# candidate SECRET itself — pure-alphabetic word/word is never a credential —
# so a genuine mixed-alphanumeric secret on the same line is still caught.
[[rules]]
id = "generic-api-key"
[rules.allowlist]
regexTarget = "secret"
regexes = [
  '''^[A-Za-z]+/[A-Za-z]+$''',
]
