# gitleaks configuration for SignalGrid Review Hub.
#
# This repository is public-safe by design. The only "credential-shaped" strings
# it contains are the deterministic demo API tokens `sgk_demo_*`, which are
# intentional public fixtures used in docs, examples, and the in-memory core —
# they are NOT real secrets. This config keeps the full default gitleaks rule
# set and allowlists only those demo tokens so real leaks are still caught.

title = "SignalGrid gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public-safe demo fixtures — sgk_demo_* tokens are intentional and are not real credentials"
# Match against the whole line so example curl `Authorization: Bearer sgk_demo_*`
# lines are allowlisted, while genuine high-entropy secrets are not.
regexTarget = "line"
regexes = [
  '''sgk_demo_[a-z_]+''',
  # Deliberately-fake fixture literals used ONLY to PROVE secret redaction in the
  # audit-ledger proofs (scripts/src/audit-ledger*-proof.ts). They are not real
  # credentials; allowlisted by exact value so genuine high-entropy secrets in
  # those same files are still caught. gitleaks scans each commit's diff in the PR
  # range, so an inline `gitleaks:allow` added in a later commit can't cover the
  # commit that first introduced the literal — a config allowlist can.
  '''pg-s3cr3t-never-persisted''',
  '''s3cr3t-should-never-appear''',
  # The fake vendor key in the work-context proof's NEGATIVE CONTROL. It exists to
  # prove the credential-refusal guard fires on `sk_live…` shapes, so the scanner
  # flagging it is the guard's own test material being read as the thing it guards
  # against. Allowlisted by exact value — a real `sk_live_` key is still caught.
  '''sk_live_51H8xample''',
  # Placeholder credentials in the review console's INTEGRATION DOCUMENTATION
  # samples (artifacts/signalgrid-review/src/data/integrationData.ts). They are the
  # literal words a reader replaces, not secrets. Anchored to the auth-header shape
  # rather than allowlisting the file, so a genuine token pasted into that same file
  # is still caught.
  '''Authorization: (?:Bearer )?YOUR_(?:TOKEN|API_KEY)''',
  '''-u "api_user:api_password"''',
]
# Documentation is prose + illustrative examples (e.g. `Authorization: Bearer …`,
# vendor feature lists), which trip the generic-api-key / curl-auth-header rules.
# This repo is public-safe by policy (no real secrets anywhere), and the
# scripts/safety-check.mjs gate independently scans ALL tracked files — including
# docs — for high-confidence real-secret patterns (AWS keys, Stripe live keys,
# GitHub PATs, private keys), so genuine leaks are still caught.
paths = [
  '''.*\.md$''',
]
