kind = "web"
previewPath = "/review"
title = "SignalGrid Second-Opinion Review"
version = "1.0.0"
id = "artifacts/signalgrid-review"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/review" ]
localPort = 24168

[services.development]
run = "pnpm --filter @workspace/signalgrid-review run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/signalgrid-review", "run", "build" ]
publicDir = "artifacts/signalgrid-review/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24168"
BASE_PATH = "/review"
