kind = "web"
previewPath = "/"
title = "SignalGrid — Product Website"
version = "1.0.0"
id = "artifacts/signalgrid-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21579

[services.development]
run = "pnpm --filter @workspace/signalgrid-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/signalgrid-web", "run", "build" ]
publicDir = "artifacts/signalgrid-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21579"
BASE_PATH = "/"
