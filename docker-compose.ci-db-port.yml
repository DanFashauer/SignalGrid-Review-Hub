# CI-ONLY overlay: publish the db to the runner's loopback so the deploy-stack
# job can run `pnpm run db:migrate` against it — the runbook's step 1 executed
# for real, not simulated. NOT part of the documented deployment: a production
# stack never publishes Postgres to a host port, which is why this lives in an
# overlay instead of docker-compose.prod.yml.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.ci-db-port.yml up -d db
services:
  db:
    ports:
      - "127.0.0.1:55432:5432"
