# Production-shaped topology: the SignalGrid API with DURABLE Postgres
# persistence. This is the deploy profile that turns on the gated persistence
# layer (audit ledger, decisions/evidence, sessions) via DATABASE_URL.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Fixture-safe by default: SIGNALGRID_TIER=prod sets the tier, but live vendor
# calls stay OFF unless SIGNALGRID_LIVE_INTEGRATIONS=true is added explicitly, so
# this stack makes no external calls out of the box.
services:
  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sg
      POSTGRES_PASSWORD: sg
      POSTGRES_DB: signalgrid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sg -d signalgrid"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - sg_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      SIGNALGRID_TIER: prod
      # THE PROFILE FENCE. Without this line the server resolves to
      # `review-demo` and SERVES THE DEMO SURFACES: GET /api/v1/keys hands an
      # anonymous caller nine bearer tokens (including a tenant owner), and
      # the unauthenticated simulator and control plane are mounted. Measured
      # before this line existed — a stack booted from this very file did
      # exactly that. A production deployment is the gateway profile, always.
      # Overridable for an EVALUATION stack (SIGNALGRID_PRODUCT_PROFILE=review-demo
      # docker compose up …), because the demo surfaces are the point of an
      # evaluation — but the DEFAULT is the production truth.
      SIGNALGRID_PRODUCT_PROFILE: ${SIGNALGRID_PRODUCT_PROFILE:-shared-device-gateway}
      # The gateway profile accepts only verified enterprise credentials, so a
      # usable gateway stack NEEDS these passed through — without them every
      # caller is 401 and the API is a fence around nothing. Empty stays unset
      # server-side (the reader trims and treats blank as unconfigured).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_TENANT_CLAIM: ${OIDC_TENANT_CLAIM:-}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-}
      OIDC_SUBJECT_CLAIM: ${OIDC_SUBJECT_CLAIM:-}
      OIDC_CLOCK_TOLERANCE_SEC: ${OIDC_CLOCK_TOLERANCE_SEC:-}
      # The two maps are REQUIRED by loadEnterpriseAuthConfig — without them the
      # OIDC config is invalid and every gateway request is 401, so dropping
      # them here would un-deploy the gateway while appearing configured.
      OIDC_TENANT_MAP: ${OIDC_TENANT_MAP:-}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-}
      SIGNALGRID_ENROLLMENT_SECRET: ${SIGNALGRID_ENROLLMENT_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Enabling durable persistence: with DATABASE_URL set, the audit ledger,
      # decision/evidence store, and session store persist to Postgres.
      #
      # This demo stack connects as the database owner for a zero-step boot. A
      # REAL deployment should run the API as the minimally-privileged
      # `signalgrid_runtime` role instead (migration v2 creates it; the ledger
      # is append-only by privilege): run `pnpm run db:migrate` with the admin
      # credential, set the runtime password, and point this URL at it — see
      # docs/BACKUP_AND_RESTORE.md § "The runtime role". `proof:db-role-split`
      # proves both directions of that posture in CI. The value interpolates so
      # exporting DATABASE_URL on the host actually takes effect — a hardcoded
      # URL here silently kept the API running as the database owner no matter
      # what the runbook's step 3 said.
      DATABASE_URL: ${DATABASE_URL:-postgres://sg:sg@db:5432/signalgrid}
    ports:
      - "8080:8080"
    # `db` has a healthcheck and `api` waits for it — but nothing described whether
    # `api` ITSELF was ready. `docker compose ps` printed "Up" the moment the
    # container started, which is a statement about the process existing, not about
    # the server answering. Anyone reading that (me, twice) treats it as ready.
    #
    # CI does probe /api/healthz with `curl --retry 60`, so the pipeline was covered.
    # Nothing else was: `up -d --wait` had no health condition to wait on for the one
    # service that serves traffic, and a container that boots and then fails to listen
    # is indistinguishable from a working one at the compose level.
    #
    # wget, not curl: this image is node:22-alpine and has BusyBox wget but NO curl —
    # verified by running the image, not assumed. A healthcheck whose binary is absent
    # reports unhealthy forever, which is a worse failure than having none.
    #
    # /healthz is a pure liveness handler (no DB touch), so this answers "is the server
    # answering" and deliberately not "is Postgres reachable" — those are different
    # questions and conflating them makes a DB blip restart a healthy API.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  sg_pgdata:
