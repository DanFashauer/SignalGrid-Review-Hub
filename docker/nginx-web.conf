# Static-serving config for the `web` container (Dockerfile.web).
# Listens on 3000 to match docker-compose.yml (PORT 3000, "3000:3000") and the
# reverse-proxy upstream `web { server web:3000; }` in nginx.conf. Serves the
# marketing site at / and the operator dashboard SPA at /app/, each with an
# SPA history-fallback to its own index.html.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Operator dashboard SPA (built with BASE_PATH=/app/).
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Marketing site SPA (built with BASE_PATH=/).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
