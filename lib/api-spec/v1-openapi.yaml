openapi: 3.1.0
info:
  title: SignalGrid v1 (public-safe product core)
  version: 1.0.0
  description: >-
    The product-shaped SignalGrid decision API, backed by the deterministic,
    fixture-backed public-safe core (`@workspace/signalgrid-core`). This is a
    review surface, not a production system — no real credentials, tenant data,
    PHI/PII, or live vendor calls.

    TWO SURFACES, AND THEY ARE NOT SCOPED THE SAME WAY. Read this before
    building against either.

    `/v1/*` is the product surface. Every one of its routes is tenant-scoped:
    the tenant is derived from the authenticated bearer token, never from a
    client-supplied id.

    `/cp/v1/*` is the control-plane DEMO surface. It carries no principal at
    all — every one of its operations declares `security: []`, and a
    client-supplied `?tenant=` query parameter is the only scoping present.
    Do not read the `/v1` sentence above as covering it; for a long while this
    document said "every route" and meant only half of them.

    PROFILE GATING — a documented path is not necessarily a served one. The
    entire `/cp/v1/*` surface and `GET /v1/keys` are registered ONLY under the
    review-demo profile. Under `shared-device-gateway` they are not mounted at
    all and answer 404 with the standard Error schema. That is deliberate: an
    unauthenticated control plane cannot be made safe by adding a check inside
    it, and a route that exists and refuses still answers "does this deployment
    have a control plane?". Check the deployment's profile before treating any
    of it as available.

    RATE LIMITING (applies to every path in this document): requests are limited
    per API key and, more coarsely, per client address. Exceeding either bound
    answers 429 with the standard Error schema body ({requestId, error:
    "rate_limited", message}) plus RateLimit-* and Retry-After headers a client
    can back off on — never a 5xx. Unknown paths under /api answer 404 with the
    same Error schema, never an HTML page. Errors of every class share that one
    flat envelope.

    IDEMPOTENCY (opt-in, POST routes under /v1): send an Idempotency-Key header
    (any client-chosen string up to 256 chars) and a retry of the same key on
    the same route by the same caller replays the stored first response instead
    of executing again, marked with an Idempotency-Replay: true header. Keys
    are caller-scoped — one tenant's key can never replay another's response.
    Only 2xx outcomes are stored; the store is per-instance memory, so a
    multi-instance deployment needs a shared store before this is a
    cross-instance guarantee.

    VERSIONING (docs/API_VERSIONING_POLICY.md is the authority): the /v1 prefix
    is the contract. Additive change — new routes, new response fields, new
    optional inputs — may land without notice, and clients must ignore fields
    they do not recognize. Removing or renaming anything a client could already
    receive, changing a field's type or the error envelope, is breaking and
    requires /v2. A route is never removed without a warning period announced
    in machine-readable headers: Deprecation (RFC 9745, "@" + unix seconds)
    and Sunset (RFC 8594, HTTP-date). info.version tracks this document, not
    the contract.
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: context
  - name: decisions
  - name: policies
  - name: connectors
  - name: audit
  - name: metrics
  - name: control-plane

paths:
  /v1/keys:
    get:
      operationId: listDemoKeys
      tags: [context]
      security: []
      summary: List public-safe demo keys (not real credentials)
      responses:
        "200": { description: Demo keys }

  /v1/context:
    get:
      operationId: getContext
      tags: [context]
      summary: Resolve the caller's principal and tenant
      responses:
        "200":
          description: Tenant context + assurance posture
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      principal:
                        type: object
                        description: The authenticated principal (role, permissions). Not rendered by the launch console.
                        additionalProperties: true
                      tenant:
                        type: object
                        description: The resolved tenant record. Not rendered by the launch console.
                        additionalProperties: true
                      assurance: { $ref: "#/components/schemas/Assurance" }
                    required: [principal, tenant, assurance]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/decisions/evaluate:
    post:
      operationId: evaluateDecision
      tags: [decisions]
      summary: Run the shared-device decision loop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateRequest" }
      responses:
        "200":
          description: Decision evaluated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      decision: { $ref: "#/components/schemas/EvaluateResult" }
                    required: [decision]
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/authorize:
    post:
      operationId: authorize
      tags: [decisions]
      summary: The Assist wire — the shared-device decision in the shape a host app obeys
      description: >-
        The same decision as POST /v1/decisions/evaluate (same request body, same
        persisted record, same decisionId), returned as the minimal obedience envelope
        the Kotlin and Rust host-app SDKs bind: `assist` is one of allow / step_up /
        restrict / deny, `reasons` is the engine's reason codes verbatim. A host app
        must fail closed on any value outside that vocabulary and on any non-2xx.
        Bound by the 42 shared conformance vectors in
        native/shared/assist-wire-conformance.json (DR-007 declared the gap; DR-023
        closed it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateRequest" }
      responses:
        "200":
          description: Assist decision
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/AssistResult"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/decisions:
    get:
      operationId: listDecisions
      tags: [decisions]
      summary: List the tenant's decisions
      responses:
        "200":
          description: Decision list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      decisions:
                        type: array
                        items: { $ref: "#/components/schemas/DecisionRecord" }
                      total: { type: integer }
                    required: [decisions, total]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/decisions/{id}:
    get:
      operationId: getDecision
      tags: [decisions]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: Get a decision
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      decision: { $ref: "#/components/schemas/DecisionRecord" }
                    required: [decision]
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/decisions/{id}/evidence:
    get:
      operationId: getDecisionEvidence
      tags: [decisions]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: Get a decision's immutable evidence snapshot and integrity check
      responses:
        "200":
          description: Evidence snapshot + verified flag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      evidence: { $ref: "#/components/schemas/EvidenceSnapshot" }
                      verified:
                        type: boolean
                        description: Snapshot digest recomputed server-side on THIS request.
                    required: [evidence, verified]
        "404": { $ref: "#/components/responses/NotFound" }

  # Reconciliation stores NOTHING. Every record is caller-supplied and the reduction is
  # pure, so there is no decision id to mint and no evidence snapshot to write — the
  # route answers a question about records the caller already holds.
  #
  # `evaluatedOffline` and `policyKnownSuperseded` are REQUIRED on every record and are
  # not defaulted anywhere on the path. Omitting one is a 400, not an "online". Both
  # defaults would point the permissive way: an omitted field would buy the record the
  # right to relax a better-informed decision.
  /v1/decisions/reconcile:
    post:
      operationId: reconcileDecisions
      tags: [decisions]
      summary: Decide which decision stands after a network partition (order-independent, clock-free)
      description: >-
        Reduces the set of decisions that exist for one subject and action — the one a
        device minted offline and the one the control plane minted — to the one that
        stands. Neither a last-write-wins tiebreak nor a CRDT join: an order-independent
        set reduction over the product order on (policyVersion, coreNormalizationVersion)
        with a one-directional veto, so a newer policy lets a device be MORE restrictive
        on its own but never less restrictive than a better-connected evaluation. No
        clock is read; the standing bound is posed by the caller as a bound plus the
        elapsed seconds per record. At most 64 records, and an oversized request is
        REFUSED rather than truncated — a dropped record can only remove a restriction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    type: object
                    required: [id, outcome, provenance]
                    properties:
                      id: { type: string }
                      outcome: { type: string, enum: [allow, step_up, restrict, deny] }
                      provenance:
                        type: object
                        required: [policyVersion, evaluatedOffline, policyKnownSuperseded]
                        properties:
                          policyVersion: { type: integer, minimum: 1 }
                          coreNormalizationVersion:
                            type: integer
                            minimum: 1
                            description: >-
                              Optional. ABSENT MEANS UNKNOWN, never zero — an unstamped
                              record is incomparable with every stamped one and always
                              forces the fail-closed join.
                          evaluatedOffline:
                            type: boolean
                            description: Whether a required source was unreachable when this decision was made.
                          policyKnownSuperseded:
                            type: boolean
                            description: >-
                              Whether the evaluating node already knew a newer policy
                              bundle was available. Captured at mint time, so a node that
                              has since caught up cannot retroactively claim currency.
                standingBound:
                  type: object
                  description: >-
                    Optional, caller-posed. An offline decision past its bound is RAISED
                    to the floor, never dropped. A record whose age is not stated is
                    treated as expired.
                  required: [maxStandingSeconds]
                  properties:
                    maxStandingSeconds: { type: number, exclusiveMinimum: 0 }
                    elapsedSecondsById:
                      type: object
                      additionalProperties: { type: number, minimum: 0 }
                    floor: { type: string, enum: [allow, step_up, restrict, deny] }
      responses:
        "200": { description: "The outcome that stands, its reason codes, the provenance frontier, whether it was contested, and which records expired" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /v1/decisions/{id}/simulate:
    post:
      operationId: simulateDecision
      tags: [decisions]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: Replay a decision's evidence against a chosen policy version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policyVersionId: { type: string }
              required: [policyVersionId]
      responses:
        "200": { description: Simulation result }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/policies:
    get:
      operationId: listPolicies
      tags: [policies]
      summary: List policies
      responses:
        "200": { description: Policy list }

  /v1/policies/{id}/versions:
    get:
      operationId: listPolicyVersions
      tags: [policies]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: List policy versions
      responses:
        "200": { description: Version list }
    post:
      operationId: createPolicyDraft
      tags: [policies]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: Create a draft policy version (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  type: array
                  items: { type: object }
              required: [rules]
      responses:
        "201": { description: Draft version created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/policies/{id}/versions/{versionId}/activate:
    post:
      operationId: activatePolicyVersion
      tags: [policies]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - in: path
          name: versionId
          required: true
          schema: { type: string }
      summary: Activate a policy version (owner/admin)
      responses:
        "200": { description: Policy with new active version }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/policies/{id}/tests:
    get:
      operationId: runPolicyTests
      tags: [policies]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - in: query
          name: versionId
          schema: { type: string }
      summary: Run a policy version's test fixtures
      responses:
        "200": { description: Test results + passed flag }

  /v1/connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      summary: List connectors and health
      responses:
        "200": { description: Connector list }

  /v1/connectors/{id}/sync-runs:
    get:
      operationId: listSyncRuns
      tags: [connectors]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: List connector sync runs
      responses:
        "200": { description: Sync run history }

  /v1/connectors/{id}/sync:
    post:
      operationId: syncConnector
      tags: [connectors]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: Replay the fixture connector sync (read-only)
      responses:
        "200": { description: Sync run }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: List audit events and verify the tamper-evident chain
      responses:
        "200": { description: Audit events + chain verification }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/metrics:
    get:
      operationId: getMetrics
      tags: [metrics]
      summary: Operator metrics for the tenant's decisions
      responses:
        "200": { description: Metrics summary }

  /v1/decisions/{id}/resolution:
    get:
      operationId: getResolution
      tags: [decisions]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: Resolution Assistant plan for a decision (deterministic)
      responses:
        "200": { description: "Resolution plan (steps, classes, channels)" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/decisions/{id}/resolve:
    post:
      operationId: simulateResolution
      tags: [decisions]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: Preview the outcome after resolvable fixes (simulated, approval-gated)
      responses:
        "200": { description: Resolution simulation (projected outcome) }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/webhooks:
    get:
      operationId: listWebhookEndpoints
      tags: [connectors]
      summary: List configured webhook endpoints (simulated sinks)
      responses:
        "200": { description: Webhook endpoints }

  /v1/webhooks/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [connectors]
      summary: List simulated webhook deliveries with retry/backoff attempts
      responses:
        "200": { description: Delivery records }

  /v1/remediation:
    get:
      operationId: listRemediation
      tags: [decisions]
      summary: List proposed remediation (always approval-required and simulated)
      responses:
        "200": { description: Remediation actions }

  /v1/remediation/{id}/approve:
    post:
      operationId: approveRemediation
      tags: [decisions]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: Approve a remediation request (simulated only — never executed)
      responses:
        "200": { description: Approved (simulated) remediation }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/app-workflows/integrations:
    get:
      operationId: listAppIntegrations
      tags: [decisions]
      summary: List integrated app-workflow catalogs (optionally by vertical)
      parameters:
        - in: query
          name: vertical
          schema: { type: string }
      responses:
        "200": { description: App integrations }

  /v1/app-workflows/evaluate:
    post:
      operationId: evaluateAppWorkflow
      tags: [decisions]
      summary: Gate an app's actions — real decision + Assist plan for one integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [integrationId, identityRef, deviceRef]
              properties:
                integrationId: { type: string }
                identityRef: { type: string }
                deviceRef: { type: string }
                requestContext: { type: object, additionalProperties: { type: string } }
      responses:
        "200": { description: Decision + app-session plan (as decided; a step_up keeps its high-assurance actions held) }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Step-up completion (real, user-verified WebAuthn) ──────────────────────
  # "User-verified", not "hardware-backed": registration requests attestation
  # "none", so the server receives no authenticator provenance and a software
  # authenticator is accepted. The guarantee is a cryptographically verified,
  # user-verified (UV) assertion over a single-use, action-bound challenge —
  # nothing more is claimed.
  # The ONLY path that releases a held step_up action: enroll a credential,
  # obtain a single-use challenge, sign it with a native user-verified gesture,
  # and present the assertion for cryptographic verification. Nothing in any
  # request body can set the released state; a failed/replayed assertion is a
  # 403 with no plan. Credentials are tenant-scoped.
  /v1/step-up/enroll/options:
    post:
      operationId: stepUpEnrollOptions
      tags: [decisions]
      summary: Mint a WebAuthn registration challenge for this identity
      parameters:
        - in: header
          name: x-enrollment-authorization
          required: false
          schema: { type: string }
          description: >-
            Out-of-band enrollment authorization. Required whenever the server is
            configured with SIGNALGRID_ENROLLMENT_SECRET (any real deployment) —
            the role gate alone is not sufficient there, because a demo core
            publishes operator/owner tokens via /v1/keys. Absent on the fixture
            demo, whose responses carry a demoNote saying enrollment is
            self-service and releases only simulated plans.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityRef]
              properties:
                identityRef: { type: string }
      responses:
        "200": { description: challengeId + WebAuthn PublicKeyCredentialCreationOptions (+ demoNote on a demo core with no out-of-band secret configured) }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { description: "Role not operator/owner, or the configured out-of-band authorization header is absent/wrong — fail closed" }

  /v1/step-up/enroll/verify:
    post:
      operationId: stepUpEnrollVerify
      tags: [decisions]
      summary: Verify the registration attestation and store the credential
      parameters:
        - in: header
          name: x-enrollment-authorization
          required: false
          schema: { type: string }
          description: Out-of-band enrollment authorization (see stepUpEnrollOptions).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityRef, challengeId, response]
              properties:
                identityRef: { type: string }
                challengeId: { type: string }
                response: { type: object, description: WebAuthn registration response (clientDataJSON + attestationObject) }
      responses:
        "200": { description: Credential enrolled (+ demoNote on a demo core with no out-of-band secret configured) }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { description: "Attestation failed verification, role not operator/owner, or out-of-band authorization absent/wrong — fail closed, nothing stored" }

  /v1/step-up/challenge:
    post:
      operationId: stepUpChallenge
      tags: [decisions]
      summary: Mint a single-use authentication challenge BOUND to a pending step-up action
      description: >-
        The challenge is bound at mint time to the exact pending action (tenant,
        identity, integration, device, and the SELECTED action key); completion
        verifies that server-persisted binding, so a gesture signed for one pending
        action can never release a different one — and the eventual release is
        scoped to that single action, never the integration's other gated actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityRef, integrationId, deviceRef, actionKey]
              properties:
                identityRef: { type: string }
                integrationId: { type: string }
                deviceRef: { type: string }
                actionKey: { type: string, description: The one action of this integration the gesture will release }
      responses:
        "200": { description: challengeId + WebAuthn PublicKeyCredentialRequestOptions (userVerification required) }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { description: "Unknown app integration, or unknown action key for it" }
        "409": { description: No enrolled credential for this identity in this tenant — enroll first (fail closed) }

  /v1/app-workflows/complete-step-up:
    post:
      operationId: completeAppStepUp
      tags: [decisions]
      summary: Release a held step_up plan — requires a verified WebAuthn assertion
      description: >-
        Verifies the signed assertion (single-use challenge, tenant+identity-bound
        credential, user-verification flag required), then re-evaluates the decision
        fresh and re-cuts the plan with the step-up satisfied FOR THE ONE ACTION the
        challenge was bound to — the integration's other gated actions stay held, so
        the plan honestly remains in step_up mode while they do. A valid assertion can
        never upgrade a restrict or deny — release applies only when the CURRENT
        outcome is step_up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [integrationId, identityRef, deviceRef, actionKey, challengeId, assertion]
              properties:
                integrationId: { type: string }
                identityRef: { type: string }
                deviceRef: { type: string }
                actionKey: { type: string, description: Must equal the action the challenge was minted for (the release is scoped to it) }
                challengeId: { type: string }
                assertion: { type: object, description: WebAuthn authentication response (clientDataJSON + authenticatorData + signature) }
                requestContext: { type: object, additionalProperties: { type: string } }
      responses:
        "200": { description: Decision + re-cut plan + stepUp verification record (released only if the current outcome was step_up) }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { description: "Assertion failed verification (bad signature, replayed/expired challenge, missing user-verification) — no plan returned" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Control plane (public management surface; see docs/DEPLOYMENT_MODELS.md) ──
  # The cloud half of the hybrid architecture: manages tenants/sites/fleet,
  # distributes policy bundles DOWN, ingests telemetry UP. Deterministic
  # fixtures; the control plane never decides — the edge decision core does.
  /cp/v1/tenants:
    get:
      operationId: cpListTenants
      tags: [control-plane]
      security: []
      summary: List tenants (with vertical + tier)
      responses:
        "200": { description: Tenants }

  /cp/v1/sites:
    get:
      operationId: cpListSites
      tags: [control-plane]
      security: []
      summary: List sites, optionally scoped to a tenant
      parameters:
        - in: query
          name: tenant
          schema: { type: string }
      responses:
        "200": { description: Sites }

  /cp/v1/edge-nodes:
    get:
      operationId: cpListEdgeNodes
      tags: [control-plane]
      security: []
      summary: List edge nodes (local decision planes), optionally by tenant
      parameters:
        - in: query
          name: tenant
          schema: { type: string }
      responses:
        "200": { description: Edge nodes }

  /cp/v1/fleet:
    get:
      operationId: cpListFleet
      tags: [control-plane]
      security: []
      summary: List fleet devices, optionally scoped to a site
      parameters:
        - in: query
          name: site
          schema: { type: string }
      responses:
        "200": { description: Fleet devices }

  /cp/v1/policy-bundle:
    get:
      operationId: cpGetPolicyBundle
      tags: [control-plane]
      security: []
      summary: The policy bundle pushed DOWN to a tenant's edge nodes (checksummed)
      parameters:
        - in: query
          name: tenant
          required: true
          schema: { type: string }
      responses:
        "200": { description: Policy bundle }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cp/v1/sync/{nodeId}:
    get:
      operationId: cpSyncPlan
      tags: [control-plane]
      security: []
      summary: An edge node's sync plan (is its bundle behind the target?)
      parameters:
        - in: path
          name: nodeId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Sync plan }
        "404": { $ref: "#/components/responses/NotFound" }

  /cp/v1/telemetry:
    post:
      operationId: cpIngestTelemetry
      tags: [control-plane]
      security: []
      summary: Ingest a telemetry batch reported UP by an edge node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeId]
              properties:
                nodeId: { type: string }
                windowMins: { type: integer }
                decisions: { type: integer }
                allow: { type: integer }
                stepUp: { type: integer }
                restrict: { type: integer }
                deny: { type: integer }
      responses:
        "200": { description: Ingested }
        "400": { $ref: "#/components/responses/ValidationError" }

  /cp/v1/health:
    get:
      operationId: cpFleetHealth
      tags: [control-plane]
      security: []
      summary: Fleet-wide health rollup with a per-vertical breakdown
      parameters:
        - in: query
          name: tenant
          schema: { type: string }
      responses:
        "200": { description: Fleet health }

  /cp/v1/ops-intelligence:
    get:
      operationId: cpOpsIntelligence
      tags: [control-plane]
      security: []
      summary: Operational-intelligence rollup (friction hotspots, posture drift, custody gaps)
      parameters:
        - in: query
          name: tenant
          schema: { type: string }
      responses:
        "200": { description: Operational-intelligence rollup }

  /cp/v1/flows:
    get:
      operationId: cpListFlows
      tags: [control-plane]
      security: []
      summary: List admin-configured flows (signals → actions with approval policy)
      responses:
        "200": { description: Flows }

  /cp/v1/flows/health:
    get:
      operationId: cpFlowsHealth
      tags: [control-plane]
      security: []
      summary: Flow + signal health with self-heal / incident resolution and a grid-intelligence score
      responses:
        "200": { description: "Flow health, break resolution, and grid intelligence" }

  /cp/v1/recommendations:
    get:
      operationId: cpRecommendations
      tags: [control-plane]
      security: []
      summary: Learned-habit recommendations (advisory flow/signal improvements)
      responses:
        "200": { description: Advisory recommendations }

  /cp/v1/signal-discovery:
    get:
      operationId: cpSignalDiscovery
      tags: [control-plane]
      security: []
      summary: Detected signals across sources, with auto-onboard vs. admin-gate plan
      responses:
        "200": { description: Discovery + onboarding plan }

  /cp/v1/ddm:
    get:
      operationId: cpDdm
      tags: [control-plane]
      security: []
      summary: DDM / device-health signals normalized to decision dimensions (macOS 27)
      responses:
        "200": { description: Normalized DDM signals + assurance hints }

  /cp/v1/fleet-mdm:
    get:
      operationId: cpFleetMdm
      tags: [control-plane]
      security: []
      summary: Fleet (open-source, osquery MDM) host posture normalized to decision dimensions (fixtures; distinct from /cp/v1/fleet inventory)
      responses:
        "200": { description: Normalized Fleet host signals + assurance hints (weak/unsupervised posture only raises assurance) }

  /cp/v1/self-audit:
    get:
      operationId: cpSelfAudit
      tags: [control-plane]
      security: []
      summary: Self-audit checklist + proposed heals (real run if an operator emitted one, else fixture)
      description: >-
        Serves the last REAL run when `artifacts/self-audit/status.json` exists
        (labelled source:"real-run" with the commit it ran at); otherwise a
        deterministic fixture snapshot labelled source:"fixture". A heal is only
        ever PROPOSED — nothing is applied without a recorded human approval.
      responses:
        "200": { description: "Checklist report, plain-language summary, and proposed heals" }

  /cp/v1/reliability:
    get:
      operationId: cpReliability
      tags: [control-plane]
      security: []
      summary: SLO / error-budget snapshot over a deterministic window of decision outcomes (fixture)
      description: >-
        Latency and availability carry error budgets; fail-closed integrity is
        zero-tolerance — one fail-open exhausts it and can never be bought back.
      responses:
        "200": { description: Reliability report + plain-language summary }

  /cp/v1/iac:
    get:
      operationId: cpIacPlan
      tags: [control-plane]
      security: []
      summary: GitOps desired-state vs observed fleet-state — plan and drift, read-only (fixture)
      description: >-
        Read-only and simulated. A real rollout actuates through the MDM
        backend's own API on a supervised device, gated on a live `allow`
        decision plus a recorded human approval; a rollout can never apply
        itself. See docs/IAC_GITOPS.md.
      responses:
        "200": { description: "Plan and drift, each with a summary" }

  /cp/v1/grid/coverage:
    get:
      operationId: cpGridCoverage
      tags: [control-plane]
      security: []
      summary: Which situations the Grid handles on its own, given active workflows + sourced signals
      responses:
        "200": { description: Sourcing summary + per-situation coverage }

  /cp/v1/grid/sourcing:
    get:
      operationId: cpGridSourcing
      tags: [control-plane]
      security: []
      summary: How each signal reaches the Grid — api / native / grid-collected / gap — and at what fidelity
      responses:
        "200": { description: Sourcing summary + per-signal path and fidelity }

  /cp/v1/grid/evidence-coverage:
    get:
      operationId: cpGridEvidenceCoverage
      tags: [control-plane]
      security: []
      summary: Which decision-evidence axes a declared estate can honestly answer
      description: >
        Parameterised by the caller's declared source planes. Reads no customer data.
        `silentHoles` is the headline — axes that are dark AND ungraded, where silence
        would otherwise read as health. An unrecognised plane is refused with 400 rather
        than dropped, because dropping one would understate what the estate can answer.
      parameters:
        - name: planes
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated source planes, e.g. `identity,device_management`. Omit for the empty estate.
      responses:
        "200": { description: "Coverage report — per-axis findings, answerable/needsInstrumentation/notSourced counts, and silentHoles" }
        "400": { description: An unrecognised source plane was supplied; the response names it and lists the valid planes }

  /cp/v1/grid/config:
    get:
      operationId: cpGridConfig
      tags: [control-plane]
      security: []
      summary: Workflows as code — the declarative grid and the CI validation run before it runs
      responses:
        "200": { description: "Validation result, summary, issues, and the declarative config" }

  /cp/v1/grid/provisioning:
    get:
      operationId: cpGridProvisioning
      tags: [control-plane]
      security: []
      summary: Zero-touch device setup plan (simulated) — a non-matching device is never touched
      parameters:
        - name: serial
          in: query
          required: false
          schema: { type: string }
          description: Preview the plan against a chosen device serial (defaults to a matching preset).
      responses:
        "200": { description: "Recording, validation, chosen device, preset devices, and the simulated plan" }

  /cp/v1/apps/resilience:
    get:
      operationId: cpAppsResilience
      tags: [control-plane]
      security: []
      summary: Each app's availability turned into a PHI-safe resilience decision (fallbacks described, not executed)
      responses:
        "200": { description: Fleet resilience rollup with per-app posture }

  /v1/sessions/start:
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start a device session (gated by a decision), durable when configured
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateRequest" }
      responses:
        "200": { description: Session started with its gating decision }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/sessions/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session (expiry applied), tenant-scoped
      responses:
        "200": { description: Session }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{id}/refresh:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: refreshSession
      tags: [sessions]
      summary: Extend an active session's TTL
      responses:
        "200": { description: Session refreshed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{id}/end:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: endSession
      tags: [sessions]
      summary: End a session (sign-out)
      responses:
        "200": { description: Session ended }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Public-safe demo key, e.g. `sgk_demo_northwind_operator`.
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or unknown bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Role lacks the required permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (includes cross-tenant access, which fails closed)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Envelope:
      description: >-
        Every successful /v1 response is wrapped in this envelope; the
        operation-specific payload is added alongside these fields.
      type: object
      properties:
        requestId: { type: [string, "null"] }
        timestamp: { type: string, format: date-time }
      required: [timestamp]
    Error:
      type: object
      properties:
        requestId: { type: [string, "null"] }
        error: { type: string }
        message: { type: string }
      required: [error, message]
    EvaluateRequest:
      type: object
      properties:
        identityRef: { type: string }
        deviceRef: { type: string }
        workflowKey: { type: string }
        requestContext:
          type: object
          additionalProperties: { type: string }
      required: [identityRef, deviceRef, workflowKey]
    AssistResult:
      # The Assist wire (DR-007 / DR-023): the minimal envelope a shared-device host
      # app obeys. `assist` is DecisionOutcome by construction — the same four strings
      # the engine emits — so there is no mapping table to drift. `reasons` is
      # reasonCodes verbatim and is optional on the wire (absent is not an error).
      type: object
      properties:
        assist:
          type: string
          enum: [allow, step_up, restrict, deny]
        decisionId: { type: string }
        reasons:
          type: array
          items: { type: string }
      required: [assist, decisionId]
    EvaluateResult:
      type: object
      properties:
        decisionId: { type: string }
        outcome:
          type: string
          enum: [allow, step_up, restrict, deny]
        reasonCodes:
          type: array
          # Deliberately NOT an enum: tenant-authored policy rules carry custom
          # reason codes verbatim, so the wire set is open by construction. The
          # list below is the ENGINE-emitted vocabulary — the catalog a host
          # app renders worker messages from (docs/REASON_CODES.md) — held
          # against source by scripts/check-reason-codes.mjs.
          items: { type: string }
          x-signalgrid-reason-codes:
            - ALLOW_SUPPRESSED_DEGRADED_EVIDENCE
            - BADGE_FORCED_REMOVAL
            - BADGE_REMOVED
            - BASELINE_DRIFTED
            - BASELINE_DRIFTED_STRICT
            - BATTERY_CRITICAL
            - BATTERY_FAILING
            - BENCHMARK_SELECTION_MISFIT
            - BENCHMARK_SELECTION_UNESTABLISHED_STRICT
            - CRITICAL_WORKFLOW_UNTRUSTED_DEVICE
            - CUSTODY_EXCEPTION
            - CUSTODY_MAINTENANCE
            - CUSTODY_OVERDUE
            - DEVICE_NONCOMPLIANT
            - DEVICE_UNMANAGED
            - DOCK_FAULTED
            - DOCK_OFFLINE
            - ENCRYPTION_REQUIRED_FOR_WORKFLOW
            - IDENTITY_DISABLED
            - IDENTITY_STATE_UNKNOWN
            - IDENTITY_STATE_UNKNOWN_STRICT
            - LOCAL_AUTHORITY_WITHHELD
            - MANAGEMENT_HEALTH_BROKEN
            - NEWER_PROVENANCE_RELAXED_STALE_DECISION
            - NO_RULE_MATCHED_DEFAULT_STEP_UP
            - OFFLINE_AUTHORITY_CANNOT_RELAX
            - OFFLINE_STANDING_AGE_UNSTATED
            - OFFLINE_STANDING_BOUND_EXCEEDED
            - POSTURE_MISSING
            - POSTURE_STALE
            - POSTURE_STALE_STRICT
            - PROVENANCE_CONTESTED_FAIL_CLOSED
            - PROVENANCE_UNIFORM_ACROSS_RECORDS
            - SHIFT_CONTEXT_MISFIT
            - SHIFT_CONTEXT_UNESTABLISHED_STRICT
            - SUPERSEDED_POLICY_AUTHORITY_CANNOT_RELAX
            - TAMPER_CONFIRMED
            - TAMPER_SENSOR_UNAVAILABLE
            - TAMPER_SUSPECTED
            - TRUST_ESTABLISHED
        policyId: { type: string }
        policyVersion: { type: integer }
        policyVersionId: { type: string }
        evidenceSnapshotId: { type: string }
        # Pre-existing drift, fixed here rather than left: the route has always
        # returned matchedRules and this schema has always omitted it. Adding one
        # field to an already-drifted schema would make "contract sync" half-true.
        matchedRules:
          type: array
          items:
            type: object
            properties:
              ruleId: { type: string }
              # Engine rules use the x-signalgrid-reason-codes vocabulary above;
              # tenant-authored rules extend it with custom codes (open set).
              reasonCode: { type: string }
              outcome:
                type: string
                enum: [allow, step_up, restrict, deny]
              severity: { type: string }
        reviewable: { type: boolean }
        latencyMs: { type: integer }
        explanation: { type: string }
        coreNormalizationVersion:
          type: integer
          description: >-
            Which build of the core decision path derived this decision's evidence.
            Generated by scripts/generate-core-normalization-version.mjs from a content
            digest of the covered core source. The claim is ONE-WAY: the same value means
            that source was byte-identical, a different value means something in the core
            decision path changed — not necessarily normalization itself. ABSENT on a
            decision minted before provenance stamping existed; absence means "unstamped",
            never version zero. It does NOT version the vendor connector normalizers,
            which the core cannot import and whose output is never persisted.
      required:
        [decisionId, outcome, reasonCodes, policyVersionId, evidenceSnapshotId]

    # The launch read surface, specified field-by-field (D2 straggler closed
    # 2026-08-11): these three response shapes are what the operator console
    # renders — the decision record, the evidence snapshot with per-signal
    # freshness and provenance, and the assurance posture. They had
    # description-only 200s, so a partner building from this spec would never
    # have learned tenantId, assurance, or signalsUsed existed. The field lists
    # mirror the served objects (core store records + routes/v1.ts envelopes);
    # the browser E2E suite pins the same fields end to end.
    MatchedRule:
      type: object
      properties:
        ruleId: { type: string }
        reasonCode: { type: string }
        outcome:
          type: string
          enum: [allow, step_up, restrict, deny]
        severity: { type: string }
      required: [ruleId, reasonCode, outcome, severity]

    DecisionRecord:
      type: object
      description: >-
        The persisted decision (`GET /v1/decisions[/{id}]`) — a superset of
        EvaluateResult: ids are `id` (not `decisionId`), and the record carries
        subjects, review state and creation time.
      properties:
        id: { type: string }
        tenantId: { type: string }
        identityId: { type: string }
        deviceId: { type: string }
        workflowId: { type: string }
        outcome:
          type: string
          enum: [allow, step_up, restrict, deny]
        policyId: { type: string }
        policyVersionId: { type: string }
        policyVersion: { type: integer }
        matchedRules:
          type: array
          items: { $ref: "#/components/schemas/MatchedRule" }
        reasonCodes:
          type: array
          items: { type: string }
        signalIds:
          type: array
          items: { type: string }
        evidenceSnapshotId: { type: string }
        requestContext:
          type: object
          additionalProperties: { type: string }
        latencyMs: { type: number }
        createdAt: { type: string, format: date-time }
        reviewStatus: { type: string }
        reviewable: { type: boolean }
        explanation: { type: string }
        coreNormalizationVersion:
          type: integer
          description: See EvaluateResult.coreNormalizationVersion — absent means "unstamped", never version zero.
      required:
        [id, tenantId, identityId, deviceId, workflowId, outcome, policyId,
         policyVersionId, policyVersion, matchedRules, reasonCodes,
         evidenceSnapshotId, latencyMs, createdAt, reviewStatus, reviewable]

    SignalUsed:
      type: object
      description: One normalized signal the engine read, with freshness and provenance.
      properties:
        id: { type: string }
        category: { type: string }
        value:
          description: The normalized value — string, number, boolean, or null.
          nullable: true
        observedAt: { type: string, format: date-time }
        freshness:
          type: string
          enum: [fresh, stale, expired, missing, unknown]
        sourceReference:
          type: string
          description: >-
            Provenance, by convention "fixture:<system>:<collection>#<subject>"
            for fixture syncs or "<system>:<collection>#<subject>" for live
            adapters. Opaque — display it, do not parse it for logic.
      required: [id, category, observedAt, freshness, sourceReference]

    EvidenceSnapshot:
      type: object
      description: >-
        The tamper-evident evidence snapshot behind a decision. `evidence`,
        `signalsUsed` and `sourceReferences` are inside the snapshot digest;
        the serving route recomputes verification per request and returns it
        beside the snapshot as `verified`.
      properties:
        id: { type: string }
        tenantId: { type: string }
        decisionId: { type: string }
        capturedAt: { type: string, format: date-time }
        evidence:
          type: object
          description: The normalized facts the policy evaluated, key/value.
          additionalProperties: true
        signalsUsed:
          type: array
          items: { $ref: "#/components/schemas/SignalUsed" }
        policyVersionId: { type: string }
        policyVersion: { type: integer }
        sourceReferences:
          type: array
          items: { type: string }
          description: Sorted, deduplicated roll-up of signalsUsed[].sourceReference.
        digest: { type: string }
        coreNormalizationVersion: { type: integer }
      required:
        [id, tenantId, decisionId, capturedAt, evidence, signalsUsed,
         policyVersionId, policyVersion, sourceReferences]

    Assurance:
      type: object
      description: >-
        What these verdicts ARE in this deployment — derived per request, never
        cached copy. The console renders this beside every verdict.
      properties:
        profile: { type: string }
        tier: { type: string }
        signalSource:
          type: string
          enum: [live, fixtures]
        verdictEffect:
          type: string
          enum: [advisory]
          description: Always advisory at this tier — product law, not a default.
        stepUpAnswerable: { type: boolean }
      required: [profile, tier, signalSource, verdictEffect, stepUpAnswerable]
