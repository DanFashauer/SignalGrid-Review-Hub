name: EnterpriseShell
options:
  bundleIdPrefix: com.enterprise
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_ENTITLEMENTS: "EnterpriseShell/EnterpriseShell.entitlements"

targets:
  EnterpriseShell:
    type: application
    platform: iOS
    sources:
      - path: EnterpriseShell
        excludes:
          - "**/.DS_Store"
      - path: EnterpriseShell/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enterprise.shell
        INFOPLIST_FILE: EnterpriseShell/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_BITCODE: "NO"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "YES"
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    # NOTE: intentionally no `info:` or `entitlements:` block here. Those make
    # XcodeGen GENERATE (and thus overwrite) the hand-maintained Info.plist and
    # entitlements, which strips the scene manifest, launch screen, background
    # modes, external-accessory config, and permission strings — causing a black
    # screen and broken capabilities. The committed files are used as-is via the
    # INFOPLIST_FILE and CODE_SIGN_ENTITLEMENTS build settings above.

  # Hermetic logic tests for the decision engine + Assist planner ports. These
  # compile the pure-Foundation port sources directly (no host app, no UIKit), so
  # they run fast and reliably in CI without launching the simulator app.
  EnterpriseShellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EnterpriseShellTests
      - path: EnterpriseShell/Services/DecisionEngine.swift
      - path: EnterpriseShell/Services/AppWorkflows.swift
      - path: EnterpriseShell/Services/DecisionService.swift
      - path: EnterpriseShell/Services/SignalContext.swift
      - path: EnterpriseShell/Services/ScreenCapturePolicy.swift
      - path: EnterpriseShell/Models/SessionState.swift
      - path: EnterpriseShell/Models/SessionData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enterprise.shell.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  EnterpriseShell:
    build:
      targets:
        EnterpriseShell: all
        EnterpriseShellTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EnterpriseShellTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
